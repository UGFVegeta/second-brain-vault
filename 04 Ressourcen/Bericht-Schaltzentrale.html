<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bericht-Schaltzentrale</title>
<style>
  :root {
    --bg:#eef1f6; --card:#fff; --card2:#e9edf3; --line:#dde2ea;
    --t1:#141a24; --t2:#556070; --akzent:#2f6df6; --akzent-t:#fff; --ok:#1f8a4c; --fehler:#c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1218; --card:#151a23; --card2:#1c2330; --line:#222a38;
            --t1:#e8ecf3; --t2:#93a0b4; --akzent:#5b8cff; --akzent-t:#0b1020; --ok:#4cc27f; --fehler:#ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--t1);
         font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; line-height:1.45; }
  main { max-width:1100px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:1.75rem; margin:0 0 4px; }
  .sub { color:var(--t2); margin:0 0 22px; }
  .raster { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:18px; align-items:start; }
  @media (max-width:820px){ .raster{ grid-template-columns:1fr; } }
  .karte { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .karte h2 { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--t2); margin:0 0 12px; }
  .zeile { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
  .schalter { display:inline-flex; background:var(--card2); border-radius:10px; padding:3px; }
  .schalter button { border:0; background:none; color:var(--t2); font:inherit; padding:7px 16px; border-radius:8px; cursor:pointer; }
  .schalter button[aria-pressed="true"] { background:var(--card); color:var(--t1); font-weight:600; box-shadow:0 1px 2px #0003; }
  input[type=date] { font:inherit; color:var(--t1); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:7px 10px; }
  label.feld { display:block; font-weight:600; margin:14px 0 6px; }
  label.feld small { font-weight:400; color:var(--t2); }
  textarea { width:100%; min-height:96px; resize:vertical; font:inherit; color:var(--t1); background:var(--card2);
             border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  textarea:focus, input:focus, button:focus-visible { outline:2px solid var(--akzent); outline-offset:1px; }
  .befinden { display:flex; gap:6px; align-items:center; }
  .befinden button { width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card2);
                     color:var(--t1); font:inherit; cursor:pointer; }
  .befinden button[aria-pressed="true"] { background:var(--akzent); color:var(--akzent-t); border-color:var(--akzent); }
  .speichern { margin-top:18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .speichern > button { background:var(--akzent); color:var(--akzent-t); border:0; border-radius:10px; font:inherit;
                        font-weight:600; padding:10px 22px; cursor:pointer; }
  .speichern > button:disabled { opacity:.5; cursor:default; }
  #meldung { font-size:1rem; }
  #meldung.ok { color:var(--ok); } #meldung.fehler { color:var(--fehler); }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; font-size:1rem; color:var(--t1); }
  .leer { color:var(--t2); font-size:.8rem; }
  ul.verlauf { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:4px; }
  ul.verlauf button { width:100%; text-align:left; display:flex; justify-content:space-between; border:0; background:var(--card2);
                      color:var(--t1); font:inherit; font-size:.8rem; padding:7px 10px; border-radius:8px; cursor:pointer; }
  ul.verlauf span { color:var(--t2); }
  #offline { display:none; background:var(--card2); border:1px solid var(--fehler); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
</style>
</head>
<body>
<main>
  <h1>Bericht-Schaltzentrale</h1>
  <p class="sub">Tag oder Woche berichten. Jede Zeile wird ein Punkt in der Daily Note.</p>

  <div id="offline">Der Dashboard-Dienst läuft nicht. Starte <b>Dashboard-Dienst starten.command</b> im Ordner 04 Ressourcen und lade die Seite neu.</div>

  <div class="raster">
    <section class="karte">
      <h2>Bericht schreiben</h2>
      <div class="zeile">
        <div class="schalter" role="group" aria-label="Art des Berichts">
          <button type="button" id="b-tag" aria-pressed="true">Tag</button>
          <button type="button" id="b-woche" aria-pressed="false">Woche</button>
        </div>
        <input type="date" id="datum" aria-label="Datum">
        <span class="leer" id="kw"></span>
      </div>

      <div id="befinden-box">
        <label class="feld">Befinden heute <small>1 schlecht bis 5 sehr gut, optional</small></label>
        <div class="befinden" id="befinden"></div>
      </div>

      <label class="feld" for="geschafft">Geschafft</label>
      <textarea id="geschafft" placeholder="Was lief heute?"></textarea>
      <label class="feld" for="erkenntnisse">Erkenntnisse</label>
      <textarea id="erkenntnisse" placeholder="Was habe ich gelernt oder entschieden?"></textarea>
      <label class="feld" for="offen" id="offen-l">Offen / Nächste Schritte</label>
      <textarea id="offen" placeholder="Was bleibt liegen?"></textarea>

      <div class="speichern">
        <button type="button" id="speichern">In die Daily Note speichern</button>
        <span id="meldung" role="status"></span>
      </div>
    </section>

    <section class="karte">
      <h2>Das steht in der Note <span id="note-datum"></span></h2>
      <div id="vorschau"><span class="leer">Lädt …</span></div>
      <h2 style="margin-top:22px">Letzte Berichte</h2>
      <ul class="verlauf" id="verlauf"></ul>
    </section>
  </div>
</main>

<script>
const DIENST = "http://127.0.0.1:8765";
const $ = id => document.getElementById(id);
let art = "tag", befinden = null;

function heute() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function kw(iso) {
  const d = new Date(iso + "T12:00:00"); const t = new Date(d); t.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function zeigeArt() {
  $("b-tag").setAttribute("aria-pressed", art === "tag");
  $("b-woche").setAttribute("aria-pressed", art === "woche");
  $("offen-l").textContent = art === "tag" ? "Offen / Nächste Schritte" : "Nächste Woche";
  $("kw").textContent = art === "woche" ? "Wochenrückblick KW" + String(kw($("datum").value)).padStart(2, "0") : "";
  $("befinden-box").style.display = ($("datum").value === heute()) ? "" : "none";
}
function meld(t, k) { const m = $("meldung"); m.textContent = t; m.className = k || ""; }

async function dienst(pfad, opt) {
  try { const r = await fetch(DIENST + pfad, opt); const j = await r.json(); $("offline").style.display = "none"; return j; }
  catch (e) { $("offline").style.display = "block"; return null; }
}
function zeigeNote(j) {
  $("note-datum").textContent = j.d || "";
  $("vorschau").innerHTML = "";
  if (!j.vorhanden || !j.text) { $("vorschau").innerHTML = '<span class="leer">Für diesen Tag gibt es noch keine Note.</span>'; }
  else { const p = document.createElement("pre"); p.textContent = j.text; $("vorschau").append(p); }
  const ul = $("verlauf"); ul.innerHTML = "";
  (j.letzte || []).forEach(e => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = "<b></b><span></span>"; b.firstChild.textContent = e.d; b.lastChild.textContent = e.punkte + " Punkte";
    b.onclick = () => { $("datum").value = e.d; laden(); zeigeArt(); };
    li.append(b); ul.append(li);
  });
}
async function laden() {
  const j = await dienst("/bericht?d=" + $("datum").value);
  if (j && j.ok) zeigeNote(j);
  zeigeArt();
}
async function speichern() {
  $("speichern").disabled = true; meld("Speichert …");
  const body = { datum: $("datum").value, art, befinden,
    geschafft: $("geschafft").value, erkenntnisse: $("erkenntnisse").value, offen: $("offen").value };
  const j = await dienst("/bericht", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  $("speichern").disabled = false;
  if (!j) return meld("Dienst nicht erreichbar.", "fehler");
  if (!j.ok) return meld(j.fehler || "Fehler beim Speichern.", "fehler");
  ["geschafft", "erkenntnisse", "offen"].forEach(i => $(i).value = "");
  meld(j.punkte ? j.punkte + " Punkte in " + j.pfad + " gespeichert." : "Befinden gespeichert.", "ok");
  zeigeNote(j);
}

[1, 2, 3, 4, 5].forEach(n => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.setAttribute("aria-pressed", "false");
  b.onclick = () => { befinden = (befinden === n) ? null : n;
    [...$("befinden").children].forEach((x, i) => x.setAttribute("aria-pressed", befinden === i + 1)); };
  $("befinden").append(b);
});
$("b-tag").onclick = () => { art = "tag"; zeigeArt(); };
$("b-woche").onclick = () => { art = "woche"; zeigeArt(); };
$("datum").max = heute(); $("datum").value = heute();
$("datum").onchange = laden;
$("speichern").onclick = speichern;
laden();
</script>
</body>
</html>
