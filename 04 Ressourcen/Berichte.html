\" nur als visuelle Signatur (keine kryptografische).","**Extension-Beratung:** Bin schon sehr gut ausgestattet. Empfehlung: `productivity`-Plugin aktivieren (`/productivity:start`), Notion/Linear-Connectors als Overkill verworfen. Größter Hebel = eigene Skill für die Prüfungsaufgaben.","**Neuen Skill erstellt:** `pruefungsaufgaben-generator` (projektlokal unter `.claude/skills/`) – bündelt das Generator-System, Konventionen und Build-Pipeline aus der `ANLEITUNG.md`.","**Stochastik-A2-Aufgabenblatt gebaut** (`04 Ressourcen/Mathematik/Prüfungsaufgaben/Stochastik A2-Aufgabenblatt (Stil 2024).html`): 6 Aufgaben, 20 P, Hausstil der Übungsprüfung, Lösungsblatt für die Lehrkraft. Alle Lösungen rechnerisch verifiziert.","**Sechs Fachleitplanken empirisch abgeleitet** und in den Skill geschrieben: Stochastik, Trigonometrie, Quadratische Funktionen, Sachrechnen, Stereometrie, Boxplot. Grundlage: `Prüfungsarchiv/_rohdaten.json` (256 echte Prüfungsaufgaben 2011–2024). ### Triathlon-Coaching (abends)","**Trainingsdaten-Anbindung (intervals.icu) aufgebaut:** Garmin *direkt* verbunden (volle Historie, 488 Einheiten). TP-Virtual-Rollenfahrten per neuem Skript hochgeladen (68 Dateien, 0 Fehler). Zwei Skripte (`.scripts/intervals_live.py`, `.scripts/intervals_tpv_upload.py`) + Doku in CLAUDE.md; Zugangsdaten sicher in `~/.config/claude-intervals/`.","**Athletenprofil angelegt** (`03 Bereiche/Triathlon/Athletenprofil.md`): FTP 330 W (4,29 W/kg), Lauf-Schwelle 3:25/km, CSS 1:35/100 m, HF 161/178, 77 kg; Wochenstruktur, Stärken/Schwächen, Wettkampfkalender, Coaching-Leitlinien.","**Renntaktik A-Rennen Schluchsee (Sa 11.07.) ausgearbeitet:** Duell mit Andreas Schröder, non-draft, Neopren-Vorteil; Rennmodell „≤ 1 min Rückstand nach dem Rad, dann niederlaufen\". Taper-Woche bestätigt und leicht geschärft."],"erkenntnisse":["**Methode für „prüfungsechtes\" Niveau:** empirisch aus dem Prüfungsarchiv ableiten → mit eigenen Pools gegenchecken → von Oskar freigeben lassen. Nie aus dem Bauchgefühl/Training raten.","**Kontextabhängige Regeln** sind wichtiger als pauschale: Trig ist schriftlich nur rechtwinklig, mündlich mit Sinus-/Kosinussatz. Quadratische Funktionen: a≠1 nur beim Zuordnen/Ablesen, nie in Rechenaufgaben.","**Klasse-9/10-Stochastik BW:** max. 2× ziehen, mit/ohne Zurücklegen, „gleiche Farbe/Zahl\", „rot und blau\", „höchstens\". Keine Kombinatorik, Bernoulli-Ketten oder Vierfeldtafel.","Das Prüfungsarchiv ab ~2020 liegt teils nur als PNG-Scan vor, aber `_rohdaten.json` deckt textlich alle Jahre 2011–2024 ab.","**Datenweg Triathlon:** Garmin muss *direkt* mit intervals.icu verbunden sein – Strava-Aktivitäten sind an der API gesperrt. TP Virtual legt `.fit` lokal unter `~/TPVirtual/<USERID>/FITFiles/` ab (per API hochladbar). Cloudflare braucht Browser-User-Agent, sonst Fehler 1010.","**Athletentyp Oskar:** Läufer, der Triathlon macht – Lauf elitär (10 km 34:20, AK-Spitze BW), Schwimmen Limiter (Können + nur 1×/Woche). Größter Hebel: zweite Schwimm-Reizsetzung.","**Coaching-Prinzip:** Oskars bewährte Wettkampf-Routine respektieren und schärfen, nicht überschreiben."],"offen":["Optional: Skill um einen Abschnitt „Schriftliche Prüfungsblätter (A1/A2/B)\" ergänzen, falls solche Blätter öfter gebraucht werden (aktuell nur der mündliche Zweig dokumentiert).","`productivity`-Plugin bei Gelegenheit mit `/productivity:start` aktivieren (Konrektor-Prozess über Sessions tracken).","Kurzaufgaben-Leitplanke nicht nötig (schon klar in `ANLEITUNG.md`).","**Renntag-Ablaufplan Schluchsee** (Warm-up, Wechselzone, km-Taktik) – als Nächstes vor Samstag.","Danach **`triathlon-coach`-Skill** bauen (Wochenplanung Richtung Ravensburg/Welzheim).","Bestätigen: Waldlauf-Datum/-Distanz, Welzheim-Distanz.","**intervals.icu-Passwort ändern** (war im Klartext geteilt).","Morgen prüfen, ob Garmin-Backfill Jan/Feb 2026 vollständig gelandet ist."]}},{"d":"2026-07-05","teile":{"geschafft":["**Prüfungs-App (Mathe mündlich):** Eintippbare Felder für Vorname und Zielnote ergänzt – im Zufallsgenerator (`Pruefung.html`) in der Kopfzeile jedes Satzes, im Baukasten als Felder in der Werkzeugleiste. Eingaben erscheinen auf beiden Ausdrucken, werden aber nirgends gespeichert (Datenschutz). Details in [[02 Projekte/App Mündliche Prüfung Generator]].","**Notenliste Mathe 9 bewertet und neu gebaut:** Original hatte überschriebene Formeln, #DIV/0!-Fehler, Altlasten und lückenhafte Formelabdeckung. Neue Version „Notenliste 9 Mathematik leer v2.xlsx\" mit 6 Kurztest-Spalten, Gewichtung als änderbare Zellen, Leerzeilen-Behandlung, Blattschutz für Formeln, Wechselschattierung und Endnoten-Ampel.","**Notenliste Mathe 10** mit Prüfungsteil: Anmeldenote (= berechnete Jahresnote), Prüfungsnote, Abschlussnote 50:50 – zweite Nachkommastelle wird per ABRUNDEN abgeschnitten (1,65 → 1,6).","**Notenlisten Mathe 5–8** im 9er-Format erstellt (Schuljahr 25 26/Mathematik/).","**Physik-Grundlagen 7–10** („GDRS ICloud/Physik/\"): je 2 Kurztests, 2 KAs, 2 mündliche Noten, Gewichtung ⅔/⅓, mit je **7 Blanko-Klassenblättern (a–g)** zum Umbenennen. Jahres-Workflow: Datei ins neue Schuljahr kopieren, ungenutzte Blätter löschen.","**Noten-Dashboard gebaut** („GDRS ICloud/\"): `build_dashboard.py` + „Dashboard aktualisieren.command\" + `Noten-Dashboard.html`. Scannt automatisch den neuesten „Schuljahr …\"-Ordner (Mathematik/ + Physik/), zeigt pro Klasse Notentabelle, Notenverteilung, Klassenschnitt je Arbeit und Risikoliste (≥ 4,5). Blattname in Excel = Klassenname im Dashboard (Umbenennen wirkt direkt). „In Excel bearbeiten\"-Knopf über `ms-excel:`-Schema funktioniert nachweislich. DEMO-Dateien mit Fakenamen liegen zum Anschauen in den Schuljahresordnern."],"erkenntnisse":["Oskars Notenbildung: **Mathe** schriftlich:mündlich = 80:20, **Physik** = ⅔:⅓, jeweils 2 Kurztests = 1 Klassenarbeit (Faktor 0,5). **Klasse 10 Abschluss:** Jahresleistung und Prüfung 50:50, Ergebnis auf eine Nachkommastelle abgeschnitten (nicht gerundet).","Excel-Automation per AppleScript funktioniert auf dem Mac (nach macOS-Freigabe) – nützlich für Formel-Verifikation, da LibreOffice nicht installiert ist. Vorsicht bei `tell application \"Numbers\"`: trifft fälschlich „Numbers Creator Studio\", Bundle-ID `com.apple.iWork.Numbers` verwenden.","Dashboard/Notenlisten mit echten Namen gehören nicht ins Vault und perspektivisch auf einen dienstlichen Speicher statt iCloud.","Systemdoku in [[04 Ressourcen/Notenlisten & Dashboard/Notenlisten und Noten-Dashboard]].","**Sport-Entwurf (spontan noch ergänzt):** „Notenliste Sport 8 leer ENTWURF.xlsx\" in GDRS ICloud/Sport/ – **Kl-Spalte** je Schüler (Sportgruppen sind klassengemischt, z.B. 8a/8c/8e), 8 flexible Notenspalten (Beschriftung und Gewicht je Spalte frei änderbar, z.B. Leichtathletik-Disziplinen ×0,5, Fußball ×2) plus **2 feste päd. Noten (1./2. HJ)**, Bonus-Spalte für Notenverbesserung (Volkslauf), Zähler „Sportsachen vergessen\" (rot ab 3), Endnote = gewichteter Schnitt + Bonus begrenzt auf 1–6, 7 Klassenblätter a–g. Dashboard erkennt das Sport-Format inkl. Kl-Spalte (grüne Kacheln, unbenutzte Spalten ausgeblendet). Demo in Schuljahr 25 26/Sport/.","**Reinkopieren verifiziert:** Namens- und Klassenspalten aus Originallisten (Excel/CSV) lassen sich trotz Blattschutz per Copy & Paste in alle Vorlagen einfügen (Name-, Kl- und Eingabespalten sind entsperrt) – in Excel praktisch getestet. Tipp: „Inhalte einfügen → Werte\", damit die Zeilenformatierung erhalten bleibt."],"offen":["**Morgen: Sport 5–10 gemeinsam finalisieren.** Am Entwurf prüfen: Reichen 10 Notenspalten? Bonus als Zahl (−0,3) ok oder lieber Ankreuzfeld? Sportsachen nur Anzeige oder mit Malus-Regel? Danach die 6 Stufen-Dateien ausrollen.","DEMO-Dateien (3 Stück, „… DEMO.xlsx\") löschen, sobald genug angeschaut, danach „Dashboard aktualisieren\" doppelklicken.","Echte Klassenlisten anlegen: Vorlage kopieren, Namen eintragen, speichern, Dashboard aktualisieren.","Git-Commit im Vault ausstehend: Namensfelder der Prüfungs-App + Doku-Updates von heute.","Bei Gelegenheit: gefüllte Notenlisten auf dienstlichen Speicher/verschlüsselten Container umziehen."]}},{"d":"2026-07-03","teile":{"geschafft":["**Prüfungsarchiv Mathematik gebaut** ([[04 Ressourcen/Mathematik/Prüfungsaufgaben]]/Prüfungsarchiv/index.html): 256 Aufgaben mit Lösungen von walterbauer.net lokal gespiegelt (2011–2024, ~11.600 Bilder), filterbar nach Jahr, Prüfungsteil (P/W bzw. A1/A2/B) und 7 Themen. Läuft komplett offline per Doppelklick.","**Jahrgang 2026 integriert**: Original-Prüfungs-PDF + Schul-Lösung (handschriftliche Musterlösung mit Punkteverteilung). A1 existierte nur mit Handschrift – farbige Notizen per Sättigungsfilter entfernt und so eine saubere Aufgaben-Fassung erzeugt. Alle 19 Aufgaben als Einzelausschnitte, Aufgabe/Lösung getrennt umschaltbar.","**Eigene Übungsprüfung erstellt** (Übungsprüfung Mathematik (Stil 2024).html): komplette Prüfung im offiziellen Format (A1 7 Aufgaben/10 P ohne TR, A2 6 Aufgaben/20 P, Wahlteil B 3×10 P) mit neuen Kontexten, Zahlen, SVG-Grafiken und Lösungsblättern. Alle Aufgaben rechnerisch verifiziert. **Frei an Kollegen weitergebbar**, da vollständig eigenes Material.","**Druckfunktion fürs Archiv**: Aufgaben per Häkchen sammeln → Arbeitsblatt drucken, wahlweise mit Lösungsteil. Aufgaben werden eng gepackt (2–3 pro A4-Seite) und in Originalgröße gedruckt; dafür alle 550 Seiten automatisch vermessen (Inhalts-Begrenzungsrahmen)."],"erkenntnisse":["**Urheberrecht**: walterbauer.net-Inhalte nur privat nutzen – Verfremden macht Weitergabe nicht legal, sondern schlimmer (entfernte Urheberbezeichnung). Legaler Weg: Link teilen, Original-Prüfungen des Landes nutzen, oder eigene Varianten erstellen (Aufgaben-*Ideen* sind nicht geschützt, nur die konkrete Ausgestaltung). Die 2026er-Unterlagen sind „nur für den Dienstgebrauch\" – nicht veröffentlichen.","**Technisch**: Handschrift lässt sich aus Scans entfernen, wenn sie farbig ist (Sättigungsfilter: blau/rot raus, schwarzer Druck bleibt). Beim Drucken skalierter iframes in Chrome `zoom` statt `transform: scale` verwenden – sonst Leerseiten und kaputtes Rendering.","walterbauer.net hat vereinzelt Tippfehler in Dateinamen (Leerzeichen statt Unterstrich) – zwei Lösungsseiten (2018 P6, 2015 P8) waren deshalb zunächst nicht abrufbar, beide repariert."],"offen":["**Probedruck** der Arbeitsblätter auf Papier – Abstände/Skalierung ggf. nachjustieren (zentrale Werte im Druckgenerator).","**Prüfung 2025 fehlt** im Archiv (walterbauer endet 2024, 2026 ist drin). Falls PDFs vorhanden: nach demselben Muster integrieren.","Optional: **weitere eigene Übungssätze** (B, C, …) im Stil anderer Jahrgänge generieren – Grundgerüst und Arbeitsweise stehen.","Falls ein sauberer A1-Scan 2026 auftaucht: die gefilterte Fassung ersetzen (eine Minute Arbeit)."]}},{"d":"2026-07-02","teile":{"geschafft":["Mündliche-Prüfungs-App deutlich verbessert (alles in `build_exam.py`, Pools unangetastet):","  **Themen-Balance:** Die 5 gemischten Aufgaben kommen jetzt aus 5 verschiedenen anderen Themen und sind aufsteigend nach Schwierigkeit sortiert.","  **Schwierigkeitsprofil „⚖️ ausgewogen\":** 2·★, 2·★★, 2·★★★ pro Satz, zusätzlich zu den exakten Stufen.","  **Serien-Modus:** Bis zu 10 überschneidungsfreie Prüfungssätze auf einmal, jeder Satz mit Name/Datum-Zeile und eigener Druckseite.","  **Verwendet-Abgleich:** Zufallsgenerator und Baukasten teilen sich jetzt den „verwendet\"-Speicher; Button „✓ Satz als verwendet markieren\" + Verfügbarkeitsanzeige.","Alles im Browser verifiziert (8 Sätze: 0 Duplikate, korrekte Profile, Abgleich mit Baukasten funktioniert).","Doku abgeglichen: [[04 Ressourcen/Mathematik/Prüfungsaufgaben/Generator/ANLEITUNG.md]] (Trigonometrie 14 → 20, neue Features beschrieben), [[02 Projekte/App Mündliche Prüfung Generator.md]] (Status-Update, Datenbasis-Abschnitt aktualisiert), index.html (neue Optionen im „Prüfung erstellen\"-Block)."],"erkenntnisse":["Der Aufgabenbestand ist konsistent bei **125 Aufgaben in 7 Themen** – aktuelle Zahlen stehen immer in der ANLEITUNG-Tabelle, `build_exam.py` hält index.html automatisch synchron.","Die „verwendet\"-Liste liegt im localStorage des Browsers – Kollegen auf anderen Rechnern sehen sie nicht. Falls das relevant wird: Export/Import als Datei wäre der nächste Ausbau-Schritt."],"offen":["Ideen aus der Analyse, bewusst zurückgestellt: Satz-Code/Seed in der URL (Sätze reproduzierbar/teilbar), Bewertungs-/Notizbereich auf dem Lehrerblatt, Kurzaufgaben als Reserve an Sätze anhängen, Export/Import der „verwendet\"-Liste.","App im echten Einsatz testen (Serien-Druck am Prüfungstag) und Rückmeldung der Kollegen einholen."]}},{"d":"2026-06-24","teile":{"geschafft":["**Gespräch mit Schulrat Ade-Thurow (Schulamt Backnang)** über die Zukunft als Führungskraft – sehr positiv. Einstieg mit Selbstreflexion zu Fellbach (wie vorbereitet) kam genau richtig an, er sieht es genauso. Details: [[02 Projekte/Konrektor-Bewerbung.md]].","Ade-Thurow sieht Oskar klar als Konrektor („Sie wären schon einer\"), will ihn platzieren, ermutigt zu weiteren Bewerbungen.","Konkrete Verbesserungsvorschläge erhalten (Innovationsfähigkeit RS zeigen, Schule sichtbar kennen, Schulrecht-Sicherheit, sicherer „ablaufen\").","Karriereweg besprochen: 2. Konrektorstelle als Einstieg möglich, dann wachsen/weiter.","**Max-Eyth-Stelle entschieden: keine Bewerbung.** Nach Abwägung (zu kurzfristig, nur 2. Konrektor, interne Konkurrenz, v.a. Welzheim-Lock-out-Risiko) bewusst abgesagt; mit Julia abgestimmt. Taus ohnehin klar abgelehnt. → [[02 Projekte/Konrektor-Bewerbung.md]]."],"erkenntnisse":["**Roter Faden dreifach bestätigt:** Hauptproblem ist ein *Zeig-Defizit* unter Druck, kein Wissensdefizit. → Höchster Hebel: Üben, das Gewusste zu performen (Mock-Präsentationen), nicht nur mehr lernen.","**Beziehung zum Schulrat = wichtigstes Asset.** Auf dem Radar bleiben, Wachstum zeigen.","**Flexibilitäts-Falle:** Flexibel bei der Einstiegsstufe (2. Konrektor ok), diszipliniert bei der Passung. „Passung vor Verfügbarkeit\" nicht unter Zeitdruck aufgeben.","Schul-Positionierung geschärft: Realschule = Fokus, ideal **1. Konrektor**, Raum Rems-Murr; Welzheim = Wunschschule.","Fellbach-Diagnose korrigiert: kein Substanz-/Wissensdefizit (war exzellent vorbereitet), sondern *eine* Lücke – kein fertiges Konzept fürs Präsentationsthema (Konflikte) → falsche Format-Entscheidung unter Druck. Fix: Konzept-Gerüst statt „mehr lernen\"."],"offen":["WhatsApp-Absage an die 1. Konrektorin der Max-Eyth senden.","Welzheim-Timeline klären (Info über Kollegin).","Pipeline beobachten: Winnenden (Rektorin hört auf → evtl. 1.-Konrektor-Stelle frei), Welzheim; „einige Stellen kommen\".","Aktives Warten: Konzept-Gerüst + Konfliktmanagement-Konzept + Schulrecht vorbereiten, damit die nächste Stelle kein Sprint wird."]}},{"d":"2026-06-23","teile":{"geschafft":["**Baustromzähler/Syna recherchiert:** Web.de + Apple Notizen durchsucht, kompletten Verlauf rekonstruiert. Zähler `1ISK0071589912` seit März 2025 nicht mehr angeschlossen, Syna hat ihn nie abgemeldet → EnBW-Rechnung ~5.000 € (noch nicht bezahlt). Info-Karte angelegt: [[02 Projekte/Baustromzähler Abmeldung Syna.md]] + Apple-Notiz fürs Handy.","**Markisenprojekt:** Anfrage-Mails an Wigason Grunbach und Rolladen Benz vorbereitet (Maße 4 m × 3,5 m, Anhang Regelschnitt_Befestigungen.pdf). Hintergrund: keine Genehmigung für ursprüngliche Lösung → Markise als Alternative. Bereits im Kontakt mit Schäfer Wohnwintergärten.","**Council-Template** erstellt: [[Templates/council-entscheidung.md]] (Kritiker/Optimist/Realist) – nur bei explizitem Schicken anwenden.","**Schulrat-Gespräch Ade-Thurow vorbereitet** (Mi 24.06., 11:45, Backnang): komplette Strategie in [[02 Projekte/Konrektor-Bewerbung.md]] + Apple-Notiz."],"erkenntnisse":["**Handwerksbetriebe:** kein „Sehr geehrte Damen und Herren\" – wirkt zu förmlich, kommt schlecht an (Tipp vom Landschaftsgärtner). Stattdessen „Guten Tag,\". → in CCR-Memory gespeichert.","**Fellbach-Absage – eigentliche Ursache:** Nicht das Präsentationsformat war falsch (GLK-Simulation lief bei der allerersten Bewerbung In der Taus mit VERA-8 glänzend), sondern die fehlende inhaltliche Substanz. Kein tragfähiges Konzept → Moderationsrolle wurde Versteck → unsicher gewirkt. Lehre: Substanz zuerst, Format danach; Konzeptaufgabe = eigenes Denken sichtbar machen, nicht nur moderieren.","Diese Fellbach-Analyse ist für morgen ein Kompetenzbeweis statt Schwäche: zeigt genau die Reflexionsfähigkeit, die ein Schulrat sehen will."],"offen":["**Mi 24.06., 11:45:** Schulrat-Gespräch. Fellbach-Arc vorher 2–3× laut durchsprechen, nicht ablesen. Danach: ChatGPT/Gemini zur Gegenkritik der Vorbereitung.","**Markise:** Mails mit PDF selbst abschicken (Wigason + Rolladen Benz); ggf. Betreff für Rolladen Benz auf „Terrassenmarkise\" anpassen.","**Syna:** Techniker meldet sich nicht (Anruf 28.05., heute nur Mailbox) → erneut nachfassen. EnBW-Vertrag bis 02.09.2026 kündigen nicht vergessen."]}},{"d":"2026-06-22","teile":{"geschafft":["Cookidoo-API Integration eingerichtet (Julias Account: brosejulia@web.de, Abo aktiv bis Dez 2026)","545 Rezepte aus 6 Sammlungen abrufbar (inkl. Einfach. Selbst. Gemacht., Low Carb, Schnellrezepte, Beikost)","Essprofil-Interview geführt: wenig Fleisch unter der Woche, Kinder 20 Monate & 4 Jahre essen mit, keine Pilze/Thunfisch, max. 60 Min, vielfältig & gesund","Wochenplan Mo–Do eingetragen in Cookidoo-Kalender: Spaghetti Bolognese, Gnocchi mit mediterranem Gemüse, Zitronen-Hähnchen mit Gemüsecouscous, Fischfilet mit Brokkoli & Dillsauce","Bring!-API Integration eingerichtet (Home-Liste), 105 Zutaten eingetragen","Workflow festgelegt: Sonntags auf Zuruf „Wochenplan\" → Vorschlag → OK → Cookidoo + Bring! automatisch befüllen","Skripte erstellt: `.scripts/cookidoo_rezepte.py`","Kontext gespeichert: [[00 Kontext/Cookidoo Wochenplan]]"],"erkenntnisse":["Bring!-Duplikate entstanden weil `get_ingredient_items()` alle Cookidoo-Einkaufslisteneinträge zurückgibt (inkl. vorhandene) – nächstes Mal direkt die Rückgabe von `add_ingredient_items_for_recipes` verwenden","Remote CCR-Routinen haben keinen Zugriff auf lokale Dateien/Credentials → lokaler Trigger besser"],"offen":["Nächsten Sonntag: „Wochenplan\" sagen → neuen 4-Tage-Plan erstellen lassen"]}},{"d":"2026-06-21","teile":{"geschafft":["Gmail-Aufräumen abgeschlossen: weiterer Schwung Newsletter/Krypto/Werbung in den Papierkorb, Wordfence-Newsletter (314) und Jetpack-Meldungen der alten Seiten gezielt entfernt, weinstadtcross.de verschont. Posteingang final bei ~1.860.","Temu-Wunsch geklärt: dauerhafter Stopp geht nur über einen Gmail-Filter (nicht per IMAP). Anleitung gegeben.","YouTube-Video „AI Operating System\" bewertet: zeigt genau das Setup, das ich schon habe. Einziger echter Mehrwert für mich: automatische Routinen und Handysteuerung.","Handysteuerung recherchiert: offizielle Claude-Code-Funktion „Remote Control\" (`/rc`, QR scannen, Claude-App), setzt Claude Max voraus, Mac muss laufen.","Hermes Agent (Nous Research) ausführlich recherchiert als Alternative für 24/7-Handy-Assistent.","Hardware-/Setup-Plan entwickelt und festgehalten: [[02 Projekte/KI-Assistent Setup (Hermes & Hardware).md]]."],"erkenntnisse":["**Hermes Agent**: open-source, selbst gehostet, modell-agnostisch (kann Claude, Gemini, lokale Modelle), Messaging-Gateway (Telegram/WhatsApp/Signal/iMessage/E-Mail), liest CLAUDE.md, eigenes Gedächtnis, Cron, MCP. Frühe Version 0.x.","**Lokale Modelle auf dem Mac**: RAM ist der Flaschenhals. M1/8 GB reicht nicht. 32 GB → bis ~32B, 48 GB → 32B bequem, 70B knapp.","**Lokal vs. Claude**: Routine gleichauf, anspruchsvolles Deutsch (Bewerbung, heikle Mails) klar Claude. Starkes 70B lokal ≈ vorletzte Spitzengeneration.","**Mein Zielbild**: Mac mini (immer an, Cloud-Modell) für Handy/Privates + neues MacBook 48 GB (lokales Modell) für Schule/Datenschutz. Übers Handy bewusst nichts Schulisches."],"offen":["Hardware-Entscheidung: zwei Geräte oder ein starker Dauerläufer (Mac mini/Studio mit viel RAM)?","Optional: aus dem E-Mail-Aufräumen eine wiederkehrende Routine bauen.","web.de: `vertrag@info.web.de` und `kundencenter@web.de` noch entscheiden.","Gmail: kleinere Restabsender und Temu-Filter bei Gelegenheit."]}},{"d":"2026-06-20","teile":{"geschafft":["Zwei Coding-Frameworks bewertet ([[02 Projekte/App Mündliche Prüfung Generator.md]]): Superpowers und GSD. Fazit: beides Werkzeuge fürs Programmieren, nicht fürs Vault. Relevant erst, wenn die Prüfungs-App gebaut wird.","App-Idee festgehalten: Generator für mündliche Mathe-Prüfungen aus 6 Themen, gefiltert nach Schwierigkeit/Note. Siehe [[02 Projekte/App Mündliche Prüfung Generator.md]].","Mehrere Mails verfasst: Rücktritt Markise (Heim & Haus), Absage Autohaus Hahn (Rypalla).","E-Mail-Anbindung per IMAP eingerichtet für web.de und Gmail. Details in [[04 Ressourcen/E-Mail Anbindung/E-Mail Anbindung per IMAP.md]].","web.de aufgeräumt: ~9.725 → ~4.600 Posteingang, 937 Finanz-Mails in neuen Ordner \"Finanzen\" sortiert.","Gmail aufgeräumt: 9.677 → 3.121 Posteingang, ~6.800 Werbe-/Newsletter-Mails in den Papierkorb, 6 Rechnungen verschont."],"erkenntnisse":["**Schreibstil:** Keine Gedankenstriche/Bindestriche verwenden, kein blumiges Lob. Festgehalten in [[00 Kontext/Schreibstil.md]].","**Gmail-Eigenheit beim Löschen über IMAP:** Der erste Gmail-Durchlauf hat durch laufende Nummern + falsche Lösch-Methode Mails archiviert statt in den Papierkorb verschoben, inkl. Kollateral. Komplett rückgängig gemacht, nichts verloren. Korrekte Methode jetzt dokumentiert (UID + Trash-Label, kein expunge).","web.de verhält sich beim Löschen unkritisch, Gmail nicht. Wichtiger Unterschied."],"offen":["Gmail-Rest: WordPress-System-Mails (Jetpack, Wordfence, Elementor) und kleinere Krypto-/Werbeabsender bei Gelegenheit aufräumen.","web.de: die zwei zurückgestellten Adressen `vertrag@info.web.de` und `kundencenter@web.de` noch entscheiden.","Ca. 285 alte, früher archivierte Gmail-Mails sind durch das Zurückholen wieder im Posteingang gelandet (unkritisch)."]}},{"d":"2026-06-19","teile":{"geschafft":["Live-Check: 49,41 kWh Tagesertrag, 8,4 kW Momentanleistung, Speicher 98%, fast 100% Autarkie","Erkenntnis: Kostal-API speichert keinen Tages-Spitzenwert (W), nur Energiemengen (kWh) ### 🤖 Hermes Agent recherchiert","YouTube-Video (Jonas Keil) zu Hermes Desktop angeschaut","**Hermes Agent = von Nous Research**, Open Source, kostenlos, seriös","Selbst-lernender KI-Agent mit Skills, Cron Jobs, Memory, 24/7-Betrieb, lokale + Cloud-Modelle","**Fazit:** Kein echter Mehrwert ggü. aktuellem Claude-Code-Setup","  Hardware (M1/8GB) zu klein für gute lokale Modelle","  Mit Claude-API: 24/7-Betrieb wäre teuer (pro Token statt Abo)","  Vault-Integration fehlt, müsste neu aufgebaut werden","**Entscheidung:** Hermes wird nicht genutzt ### 🧠 Setup verbessert","Neue Regel: Claude lernt **proaktiv** über Oskar (Vorlieben/Muster) statt ständig nachzufragen – transparent, in editierbaren Memory-Dateien ### 🎙️ Diktieren / Spracheingabe","Claudian hat keine eingebaute Diktierfunktion → WhisperBar (lokal) funktioniert systemweit, aber auf M1/8GB zeitverzögert","Cloud-Alternativen recherchiert: **Wispr Flow** (Marktführer, systemweit, KI-Aufbereitung, ~15 $/Monat)","**Empfehlung:** zuerst gratis **Apple-Diktat** testen (Systemeinstellungen → Tastatur → Diktat, Sprache auf Deutsch) – reicht evtl. völlig, spart das Abo","Datenschutz: Cloud-Diktat schickt Inhalte an Drittanbieter → bei sensiblen Schulinhalten lokal/Apple bevorzugen"],"erkenntnisse":["Lokales Modell auf M1/8GB wäre deutlich schwächer als Claude – nur 3–7B-Modelle laufen, langsam und ungenau","Das „über dich lernen\"-Feature von Hermes hat Claude Code im Prinzip schon (MEMORY.md + CLAUDE.md) – sogar transparenter","Cloud-Diktat ist auf schwacher Hardware schneller als lokales Whisper, weil die Rechenlast extern liegt"],"offen":["[ ] Apple-Diktat aktivieren & testen (ob es WhisperBar ersetzen kann)"]}},{"d":"2026-06-18","teile":{"geschafft":["**Trigonometrie-Aufgabenpool** für die mündliche Prüfung Mathematik erstellt: 14 Aufgaben am Dreieck (Sinussatz, Kosinussatz, Flächenformel, rechtwinklig), jede Figur exakt aus Koordinaten gezeichnet, Winkel automatisch auf der Winkelhalbierenden platziert, Lösungen verifiziert","Aufgaben 11–14 sind die vier Original-Referenzaufgaben im gleichen Stil ergänzt","Drei Nutzungsformen: Obsidian-Notiz [[Trigonometrie Prüfungspool]] (PNGs zum Rausziehen), einzelne PNGs in `Bilder/`, und eine **eigenständige HTML-App** (`Trigonometrie Aufgabenpool.html`) zum Weitergeben an Kollegen – mit Auswahl-zum-Drucken und ausklappbaren Lösungen","Skizzen ohne Beschreibungstext (Schüler erklären selbst), „Gegeben\" steht in der Lösung","WhatsApp-Nachricht an die Turneltern (Sport-Absage Hitze) überarbeitet","Kennenlern-Interview für **Sonntag, 21.06. 10:00** als geplante Aufgabe terminiert"],"erkenntnisse":["Safari rendert Inline-SVGs nur mit fester `width`/`height` zuverlässig – nicht allein mit `viewBox`. Bei eigenständigen HTML-Dateien immer beides setzen.","Amtlicher BW-Knick/Schlüssel: siehe [[Notenschlüsselrechner – Doku]]"],"offen":["Aufgabenpool im Browser final gegenprüfen (Anzeige + Druck der Auswahl)","Optional: Lösungsblatt-Variante / weitere Aufgaben bei Bedarf ergänzen"]}},{"d":"2026-06-17","teile":{"geschafft":["Linearen **Notenschlüsselrechner** als eigenständige Browser-App gebaut (offline, ohne Internet)","Zwei Varianten: schlicht + **GDRS-Version** mit Logo, Hausfarbe Orange (#f29400) und Anthrazit-Header","Freie Formel gegen Referenztabelle verifiziert: **48/48 Zeilen identisch** (max 39, Zehntelnoten)","**Amtlichen Schlüssel der Realschulprüfung BW** ergänzt (aus PDF extrahiert), Formel verifiziert: **39/39 Stichproben** gegen die amtliche Tabelle","Drittes Tool: **eigenes Prüfungs-Tool** (amtlich, fest verdrahtet) zum Weitergeben an Kollegen","Übersicht „Alle Noten auf einen Blick\" auf **Spalten-Layout** der amtlichen Notenliste umgestellt","Oben **Umschalter** „Freier Schlüssel ↔ Realschulprüfung Mathematik\" in beiden Rechnern — funktioniert (von Oskar bestätigt)","**Knick-Option** für Fremdsprachen (z. B. Englisch: ab 50 % → Note 4,0) im freien Modus ergänzt, zweigeteilter Schlüssel, verifiziert (7/7); im Prüfungsmodus automatisch gesperrt","Alle Dateien in Vault (`04 Ressourcen/Notenschlüsselrechner/`) + Downloads; „Lehrerfreund\"-Bezüge entfernt","**Nachricht an die 10d** verfasst/überarbeitet (Anwesenheit/Unterrichtspflicht, mündliche Prüfung Mathe+Deutsch = Vorbereitung, Nebenfächer-Noten noch offen, Europapark-Rücklaufzettel, Schulfest-Abbau 26.06.)"],"erkenntnisse":["Freier linearer Schlüssel: `Note = beste + (schlechteste − beste) × (Schwelle − P) / (Schwelle − unterer Anker)`, Rundung kaufmännisch","**Amtlich BW:** lineare Note, dann **auf 0,1 abgerundet** (zugunsten der Schüler), geclampt 1,0–6,0 — bei 50 P. exakt die amtliche Tabelle","Doku dazu: [[Notenschlüsselrechner – Doku]]","**Schreibstil geschärft:** Fließtext statt Listen, nicht „nach KI\" (keine glatten/überbalancierten Sätze), Direktheit nicht glätten, faktentreu statt wirkungsvoll. Festgehalten in [[Schreibstil]] + Memory."],"offen":["Logo-Nutzung ggf. mit Schulleitung abstimmen, falls die App öffentlich verteilt wird","Pro Schuljahr einmal eine Zeile gegen die dann gültige amtliche Prüfungstabelle gegenprüfen (falls Verfahren/Punktzahl geändert wird)"]}},{"d":"2026-06-16","teile":{"geschafft":["**Schulfest-Orga – Lehrerliste befüllt** (Datei `Orga Schulfest .xlsx`, iCloud → GDRS ICloud/Schuljahr 25 26/Schulfest; finale Version in Downloads)","  Aus den Blättern „Schulfest Einteilung\" + „Planung\" für jede Lehrkraft Aufgabe(n) und mithelfende Klasse(n) ins Blatt „Lehrerliste\" übertragen.","  Klasse-Spalte war vorher komplett leer → jetzt gefüllt; fehlende Aufgaben ergänzt.","  Sicherungskopie angelegt; finale, korrekte Datei liegt in **Downloads** (`Orga Schulfest (bearbeitet).xlsx`).","**E-Mail an den Konrektor** überarbeitet (Schulfest: aktualisierte Karte, Lehrerliste, Schichtplan-Excel für die GLK).","**Schreibstil-Regel ergänzt** in `00 Kontext/Schreibstil.md`: Mails an den Konrektor locker-kollegial halten.","**Datenschutz-Regel angewendet:** Schul-Datenschutzregeln gelten ab jetzt überall (auch in Claude-Notizen/Memory), Personennamen aus abgeleiteten Notizen entfernt."],"erkenntnisse":["Kuchenverkauf-Team bewusst auf Gruppen-Klassen `5b, 5c, 5d` gelassen statt feiner Einzelaufteilung.","**Technische Lehre:** openpyxl löscht beim Speichern eingebettete Zeichnungen (Schichtpläne auf mehreren Blättern gingen zunächst verloren, Datei schrumpfte 122→26 KB). Lösung: nur das betroffene Blatt (sheet4.xml) chirurgisch im ZIP ändern, Rest unangetastet lassen.","iCloud + offene Excel-Sperrdatei (`~$…`) zeigten den alten Stand → finale Datei sicherheitshalber in Downloads ablegen.","**Datenschutz:** Kollegen-/Personennamen gehören nicht in Vault- oder Memory-Notizen, nur in die jeweilige Arbeitsdatei selbst."],"offen":["Lehrerliste vor GLK von Kollegen gegenchecken lassen; finale Downloads-Datei zurück in den iCloud-Ordner schieben (alte Version vorher schließen/ersetzen).","Reine Aufführungs-/Orga-Rollen haben naturgemäß keine helfende Klasse – das ist so korrekt.","Morgen ab ca. 8 Uhr Schule, Abstimmung mit dem Konrektor; Matheprüfung um 9 Uhr."]}},{"d":"2026-06-15","teile":{"geschafft":["Skill-Landschaft analysiert: zwei Engines auf dem Mac unterschieden – **Claude Code** (Obsidian + CLI, liest `~/.claude/` + Vault-`.claude/`) und **Cowork** (Desktop, kontogesteuert via `~/Library/Application Support/Claude/`)","8 Custom-Skills global gespiegelt nach `~/.claude/skills/` → **Code & Obsidian teilen jetzt dasselbe Set** (datenberichte-schulentwicklung, elternkommunikations-assistent, differentiation-adapter, criterion-referenced-rubric-generator, gap-analysis-from-student-work, professional-development-session-designer, excalidraw-diagram-skill, notebooklm-py)","7 Custom-Skills als saubere ZIPs verpackt (`~/Desktop/Cowork-Skills-Upload/`, ohn const $ = id => document.getElementById(id);
const WT = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const TITEL = { geschafft:"Geschafft", erkenntnisse:"Erkenntnisse", offen:"Offen" };
const BEFINDEN = ["", "#c0553d", "#d28a3c", "#bba94a", "#7fa860", "#4b7a47"];
let ansicht = "alle", sichtbareWochen = 6;

function datum(iso) { return new Date(iso + "T12:00:00"); }
function montag(d) { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function kw(d) {
  const t = new Date(d); t.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function wochenKopf(m) {
  const e = new Date(m); e.setDate(e.getDate() + 6);
  const von = m.getDate() + (m.getMonth() === e.getMonth() ? "" : ". " + MON[m.getMonth()]);
  return { titel: "Woche " + kw(m), zeit: von + (m.getMonth() === e.getMonth() ? "." : "") + " bis " + e.getDate() + ". " + MON[e.getMonth()] + " " + e.getFullYear() };
}
function z(t, frage) {
  const f = document.createDocumentFragment();
  const teile = String(t).replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g, "$2").split(/(\*\*[^*]+\*\*)/);
  teile.forEach(s => {
    const b = s.startsWith("**") && s.endsWith("**") && s.length > 4;
    const text = b ? s.slice(2, -2) : s;
    const el = b ? document.createElement("b") : document.createDocumentFragment();
    if (frage && text.toLowerCase().includes(frage)) {
      const i = text.toLowerCase().indexOf(frage);
      el.append(text.slice(0, i));
      const m = document.createElement("mark"); m.textContent = text.slice(i, i + frage.length); el.append(m, text.slice(i + frage.length));
    } else el.append(text);
    f.append(el);
  });
  return f;
}
function abschnitte(teile, frage) {
  const box = document.createDocumentFragment();
  ["geschafft", "erkenntnisse", "offen"].forEach(k => {
    if (!teile[k]) return;
    const s = document.createElement("section"); s.className = "abschnitt " + k;
    const h = document.createElement("h3"); h.textContent = TITEL[k];
    const ul = document.createElement("ul");
    teile[k].forEach(p => { const li = document.createElement("li"); if (p.startsWith("  ")) { li.className = "sub"; p = p.trim(); } li.append(z(p, frage)); ul.append(li); });
    s.append(h, ul); box.append(s);
  });
  return box;
}
function werte(t) {
  const w = [];
  if (t.schlaf) w.push("Schlaf " + String(t.schlaf).replace(".", ",") + " h");
  if (t.ruhepuls) w.push("Ruhepuls " + t.ruhepuls);
  if (t.hrv) w.push("HRV " + t.hrv);
  if (t.fokus) w.push("Fokus " + t.fokus + " min");
  if (!w.length) return null;
  const p = document.createElement("p"); p.className = "werte"; w.forEach(x => { const s = document.createElement("span"); s.textContent = x; p.append(s); }); return p;
}
function karte(t, frage, nurWoche) {
  const d = datum(t.d), a = document.createElement("article"); a.className = "tag" + (nurWoche ? " wochenkarte" : "");
  const l = document.createElement("div"); l.className = "datum";
  l.innerHTML = nurWoche ? "<b></b><small></small>" : "<b></b><small></small>";
  l.firstChild.textContent = nurWoche ? "KW " + t.woche.kw : d.getDate();
  l.lastChild.textContent = nurWoche ? "bis " + d.getDate() + ". " + MON[d.getMonth()].slice(0, 3) + "." : WT[d.getDay()].slice(0, 2) + ", " + MON[d.getMonth()].slice(0, 3) + ".";
  if (!nurWoche && t.befinden) { const p = document.createElement("span"); p.className = "punkt"; p.style.background = BEFINDEN[t.befinden]; p.title = "Befinden " + t.befinden + " von 5"; l.append(p); }
  const r = document.createElement("div");
  if (nurWoche) { const e = document.createElement("p"); e.className = "etikett"; e.textContent = "Wochenrückblick"; r.append(e, abschnitte(t.woche, frage)); }
  else { const w = werte(t); if (w) r.append(w); r.append(abschnitte(t.teile, frage)); }
  a.append(l, r); return a;
}
function passt(t, frage, nurWoche) {
  if (!frage) return true;
  const quelle = nurWoche ? t.woche : t.teile;
  return Object.values(quelle).some(v => Array.isArray(v) && v.some(p => p.toLowerCase().includes(frage)));
}
function zeichne() {
  const frage = $("suche").value.trim().toLowerCase();
  const nurWoche = ansicht === "woche";
  const eintraege = DATEN.filter(t => nurWoche ? t.woche : Object.keys(t.teile).length).filter(t => passt(t, frage, nurWoche));
  const liste = $("liste"); liste.innerHTML = "";
  $("unter").textContent = DATEN.length + " Tage mit Bericht, zuletzt " + (DATEN[0] ? datum(DATEN[0].d).getDate() + ". " + MON[datum(DATEN[0].d).getMonth()] : "noch keiner");
  if (!eintraege.length) { liste.innerHTML = '<p class="leer">' + (nurWoche && !frage ? "Noch kein Wochenrückblick. Sag Claude am Freitag oder Sonntag „Wochenbericht“." : "Nichts gefunden.") + '</p>'; $("mehr").style.display = "none"; return; }
  let letzte = "", wochen = 0, versteckt = false;
  for (const t of eintraege) {
    const m = montag(datum(t.d)), key = m.toISOString();
    if (key !== letzte) {
      if (wochen >= sichtbareWochen && !frage) { versteckt = true; break; }
      wochen++; letzte = key;
      if (!nurWoche) { const k = wochenKopf(m), h = document.createElement("div"); h.className = "woche";
        h.innerHTML = "<h2></h2><span></span>"; h.firstChild.textContent = k.titel; h.lastChild.textContent = k.zeit; liste.append(h); }
    }
    liste.append(karte(t, frage, nurWoche));
  }
  $("mehr").style.display = versteckt ? "" : "none";
}
$("r-alle").onclick = () => { ansicht = "alle"; $("r-alle").setAttribute("aria-pressed", true); $("r-woche").setAttribute("aria-pressed", false); zeichne(); };
$("r-woche").onclick = () => { ansicht = "woche"; $("r-woche").setAttribute("aria-pressed", true); $("r-alle").setAttribute("aria-pressed", false); zeichne(); };
$("suche").oninput = zeichne;
$("mehr").onclick = () => { sichtbareWochen += 6; zeichne(); };
zeichne();
</script>
