<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berichte</title>
<style>
  :root {
    --bg:#f3eee4; --karte:#fffcf5; --karte2:#f6f0e3; --linie:#e4dccb;
    --tinte:#2b2620; --leise:#7b7264; --akzent:#b4532a; --akzent-t:#fffcf5;
    --geschafft:#4b7a47; --erkenntnisse:#a2701a; --offen:#476a8c;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120e; --karte:#1e1a15; --karte2:#26211a; --linie:#332d24;
            --tinte:#ece5d6; --leise:#a0957f; --akzent:#e08a5c; --akzent-t:#1a120c;
            --geschafft:#86b982; --erkenntnisse:#d8a64e; --offen:#8fb0d1; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tinte); font:17px/1.55 var(--sans); }
  main { max-width:860px; margin:0 auto; padding:44px 20px 80px; }
  header { margin-bottom:30px; }
  h1 { font:600 2.5rem/1.1 var(--serif); margin:0 0 6px; letter-spacing:-.01em; }
  .unter { color:var(--leise); margin:0; font-family:var(--serif); font-style:italic; }
  .leiste { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:26px 0 8px; }
  .reiter { display:inline-flex; background:var(--karte2); border-radius:999px; padding:3px; }
  .reiter button { border:0; background:none; color:var(--leise); font:inherit; font-size:.85rem; padding:7px 16px; border-radius:999px; cursor:pointer; }
  .reiter button[aria-pressed="true"] { background:var(--karte); color:var(--tinte); font-weight:600; box-shadow:0 1px 2px #0002; }
  input[type=search] { flex:1; min-width:180px; font:inherit; font-size:.85rem; color:var(--tinte); background:var(--karte);
                       border:1px solid var(--linie); border-radius:999px; padding:8px 16px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--akzent); outline-offset:2px; }
  .woche { margin:44px 0 14px; display:flex; align-items:baseline; gap:12px; }
  .woche h2 { font:600 1.4rem/1.2 var(--serif); margin:0; }
  .woche span { color:var(--leise); font-size:.85rem; }
  .tag { display:grid; grid-template-columns:76px 1fr; gap:18px; background:var(--karte); border:1px solid var(--linie);
         border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  .datum { text-align:center; padding-top:2px; }
  .datum b { display:block; font:600 2.2rem/1 var(--serif); }
  .datum small { display:block; color:var(--leise); font-size:.85rem; margin-top:4px; }
  .punkt { display:inline-block; width:10px; height:10px; border-radius:50%; margin-top:10px; background:var(--linie); }
  .werte { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--leise); font-size:.85rem; margin:0 0 12px; }
  .abschnitt { margin:0 0 14px; }
  .abschnitt:last-child { margin-bottom:0; }
  .abschnitt h3 { font:700 .85rem/1 var(--sans); letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; }
  .geschafft h3 { color:var(--geschafft); } .erkenntnisse h3 { color:var(--erkenntnisse); } .offen h3 { color:var(--offen); }
  ul { margin:0; padding-left:1.1em; } li { margin:0 0 4px; } li.sub { margin-left:1.1em; list-style:circle; }
  li::marker { color:var(--leise); }
  .wochenkarte { border-color:var(--akzent); background:var(--karte2); }
  .wochenkarte .datum b { color:var(--akzent); font-size:1.5rem; padding-top:6px; }
  .etikett { color:var(--akzent); font-weight:700; font-size:.85rem; letter-spacing:.07em; text-transform:uppercase; margin:0 0 10px; }
  .leer { color:var(--leise); text-align:center; padding:40px 0; font-family:var(--serif); font-style:italic; }
  #mehr { display:block; margin:28px auto 0; border:1px solid var(--linie); background:var(--karte); color:var(--tinte);
          font:inherit; font-size:.85rem; padding:10px 24px; border-radius:999px; cursor:pointer; }
  mark { background:color-mix(in srgb, var(--akzent) 30%, transparent); color:inherit; border-radius:3px; }
  @media (max-width:560px) { .tag { grid-template-columns:1fr; gap:8px; } .datum { display:flex; gap:10px; align-items:baseline; text-align:left; }
                             .datum small { margin:0; } h1 { font-size:2rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Berichte</h1>
    <p class="unter" id="unter"></p>
    <div class="leiste">
      <div class="reiter" role="group" aria-label="Ansicht">
        <button type="button" id="r-alle" aria-pressed="true">Alle Tage</button>
        <button type="button" id="r-woche" aria-pressed="false">Wochenrückblicke</button>
      </div>
      <input type="search" id="suche" placeholder="Suchen, zum Beispiel Konrektor" aria-label="Suchen">
    </div>
  </header>
  <div id="liste"></div>
  <button type="button" id="mehr">Ältere Wochen zeigen</button>
</main>
<script>
const DATEN = [{"d":"2026-11-13","teile":{},"schlaf":6.5,"ruhepuls":36.0,"hrv":67.0,"befinden":3,"woche":{"kw":46,"geschafft":["Montag: Beerdigung vom Opa meiner Frau in Dürrenzimmern. Um 11 früher aus der Schule, mit meiner Frau die Kinder abgeholt, umgezogen und hingefahren. Es war kalt. Danach war es schön, wie die Familie zusammenkam, meine Eltern waren auch da.","Montag: Das Kinderfest, auf das sich eines der Kinder gefreut hatte, fiel wegen der Beerdigung aus.","Dienstag: ganz normaler Schultag.","Mittwoch: Auto geholt (BMW iX1). Morgens zum ersten Mal in 14 Jahren mit dem Bus zur Schule gefahren und im Bus Schüler getroffen, die ich direkt unterrichtet habe. Danach mit S-Bahn und Bus zum Auto, rund eine Stunde gewartet. Das Auto sieht schön aus und fährt sich gut. Akku bei der Abholung bei 30 %, das reichte locker bis nach Hause.","Donnerstag: beim Arzt wegen der Achillessehne, vierte Stoßwelle. Danach endlich wieder geschwommen, lief am Ende gut.","Freitag: um 11 Uhr aus, eine Stunde auf der Rolle gefahren, fühlt sich gut an. Mit meiner Frau die Kinder abgeholt, im Auto die Sitze umgebaut und das Auto geladen. Eine Stunde mit einem der Kinder draußen gewesen, gemeinsam gegessen, die Kinder ins Bett gebracht. Ich war richtig müde, fast eingeschlafen. Abends Fußball."],"erkenntnisse":["Verkehr in Stuttgart war eine Katastrophe. Das täglich zu fahren wäre für kein Geld der Welt etwas für mich.","Bei einer Stelle als Schulleiter oder stellvertretender Schulleiter in der Nähe, idealerweise [[Konrektor-Stelle Schulzentrum Rudersberg|in Rudersberg]], wäre ich bereit, dafür weniger zu verdienen.","Dritte Beerdigung in drei Jahren. Es wird Zeit, dass es ruhiger wird.","Achillessehne: im Alltag keine Probleme, beim Laufen fühlt es sich noch komisch und ein bisschen schmerzhaft an, ich kann es nicht richtig einschätzen.","Training ist oft ausgefallen, entweder war ich krank oder jemand aus der Familie oder die Beerdigung.","Gewicht: nicht gewogen, geschätzt eher 79 bis 80 kg als 75. Der Weg ist noch lang."]}},{"d":"2026-11-11","teile":{"geschafft":["BMW iX1 abgeholt, alles funktioniert. Das ist jetzt für die nächsten dreieinhalb Jahre mein Fahrzeug (Leasing).","Zum ersten Mal geladen, von ca. 25 % auf 80 %."],"erkenntnisse":["In der Kostal-App sieht man die Ladung deutlich im Verbrauch. Von 25 % auf 80 % zieht ordentlich Strom."]},"schlaf":6.2,"ruhepuls":37.0,"hrv":73.0,"befinden":3},{"d":"2026-10-17","teile":{"geschafft":["**Kinderturnen-Abrechnung Januar bis Juli 2026 rekonstruiert.** Die WhatsApp-Chats mit den Eltern löschen sich nach 90 Tagen, deshalb aus Ferien, Feiertagen, Hitzetagen und Oskars Angaben nachgerechnet: 17 Termine, 33 Stunden, 594 €. Details und Terminliste in [[STARK Übungsstunde TSV Rudersberg]], Abschnitt Abrechnung.","Abrechnungsformular als PDF nach dem Layout von 2025 gebaut (Jan–Jul 2026, dazu Variante mit den alten Terminen). Ablage in `~/Downloads/`, nicht im Vault, weil Bankdaten drin stehen.","Mailtext zur Abrechnung geschrieben und in die Zwischenablage gelegt.","Mod `namen-anzeige` nach `~/.claude/mods/` kopiert und in `CLAUDE_CODE_PLUGIN_DIRS` eingetragen. Oskar hat die Zeile selbst gesetzt, weil der Auto-Modus Änderungen an `settings.json` blockiert.","Gesundheitslogbuch für 16.10. und 17.10. ergänzt."],"erkenntnisse":["Der Namensschutz setzt Klarnamen in Bash-Befehlen (z. B. pbcopy) korrekt ein. Nur die Anzeige im Chat zeigt Platzhalter, wenn `namen-anzeige` nicht geladen ist.","Gesundheit: seit 16.10. Nebenhöhlenentzündung mit Gliederschmerzen. Ruhepuls heute 40 (Basis 36), HRV 48 (Median 60 Tage 79), 58 am Vortag. Schlaf mit 6,8 Stunden nicht das Problem. Form TSB +22, letzte Einheit 14.10."],"offen":["Abrechnung unterschreiben, datieren und mit dem Mailtext an den TSV schicken (Erinnerung in Reminders, Liste Familie, ist noch offen).","Klären, ob im ersten Halbjahr einzelne Turnstunden nur 1 Stunde hatten, dann Stundenzahl anpassen.","Neue Sitzung starten und prüfen, ob `namen-anzeige` die Klarnamen im Chat zeigt.","Training pausieren, bis Ruhepuls und HRV wieder an der Basis liegen."]},"befinden":1},{"d":"2026-10-10","teile":{"geschafft":["YouTube-Video zu zehn Claude-Code-Mods ausgewertet und mit den eigenen Mods (Schul-Cockpit, Ablage, Alltag) abgeglichen.","Cache-Meter, Schutz vor Löschen und Dateiübersicht sind bei mir schon abgedeckt.","Vorgeschlagen als Ausbau des Schul-Cockpits: Cache-Wächter (hält eine Nachricht an, wenn der Cache kalt ist und viel neu eingelesen würde), `/warmhalten`, Knopf „Zusammenfassen“ ab etwa 50 % Kontext, Schutzdialog mit Vorschau (Anzahl und Größe der Dateien).","Befinden 4 per Knopf ins Gesundheitslogbuch eingetragen."],"erkenntnisse":["Mods, die bei jeder Antwort ein zweites Modell aufrufen (Next Steps, You Should Know, Catch Me Up), passen nicht zum Pro-Abo, weil sie das Limit zusätzlich belasten.","Der Cache hält im Abo eine Stunde. Nach längerer Pause wird der ganze Verlauf neu eingelesen, das kostet bei langen Sessions am meisten Limit."],"offen":["Entscheidung, ob die vier Ausbauten ins Schul-Cockpit kommen.","Mods im Alltag testen, besonders Erinnerungen per Diktat („Erinnere mich …“).","Claude Code im Terminal aktualisieren (dort noch Version 2.1.196)."]},"befinden":4},{"d":"2026-10-05","teile":{"geschafft":["Die letzten 14 Tage Claude-Sessions ausgewertet (121 Sessions): Schwerpunkt Unterrichtsvorbereitung Physik 7/10 und Mathe 7c/10b, häufigste Reibung war fehlender iCloud-Export, mehrfach Limit mitten in der Arbeit erreicht.","Zwei Claude-Code-Mods gebaut und dauerhaft installiert (`~/.claude/mods/`):","  **Schul-Cockpit:** Statuszeile mit 5-h- und Wochenlimit, Cache-Restzeit und Kontext; Leiste mit Export-Button, wenn Mathe/Physik geändert, aber nicht nach iCloud exportiert ist; Schutzdialog vor gefährlichen Befehlen (Löschen, git, E-Mails endgültig löschen).","  **Ablage:** Panel `/ablage` mit allen Dateien der Session (Vault, iCloud, Scratchpad), neue HTML öffnen sich automatisch in Chrome.","Inbox geleert: Einhorn-Ausmalbilder nach `03 Bereiche/Familie/`, Zeitfenster-Plan 19.–23.10. nach iCloud `Klassenlehrer/09 Zeitfensterwoche/` (nur iCloud, wegen Kollegenkürzeln).","„00 Überblick – was wann“ (Klassenlehrer 7c) um 07 Klassenfahrt, 09 Zeitfensterwoche und die Dateien direkt im Ordner ergänzt, PDF neu in Vault und iCloud.","YouTube-Video zu Mods ausgewertet: Schutz-Mod („Blast Radius“) und Cache-Anzeige übernommen, Next Steps und You Should Know bewusst nicht (kosten pro Antwort zusätzliches Limit)."],"erkenntnisse":["Mods laufen lokal und kosten keine Tokens. Regeln, die bisher nur in CLAUDE.md oder Memory stehen, lassen sich damit fest durchsetzen.","Die Limitwerte kommen erst mit der ersten Antwort einer Session, vorher zeigt die Statuszeile einen Platzhalter.","Laufende Sessions lesen neue Mod-Einstellungen nicht nach, erst nach Neustart oder Fortsetzen.","Das `claude` im Terminal (nvm) ist veraltet (2.1.196), die App nutzt 2.1.286."],"offen":["Mods im Alltag testen, besonders den Schutzdialog und den iCloud-Export-Button in einer neuen Session.","Später eventuell: Routinen-Leiste (Gesundheits-Check Do/So, Befinden + Daily Note), To-Do-Warteschlange.","Optional: Claude Code im Terminal aktualisieren."]},"befinden":4},{"d":"2026-09-10","teile":{"geschafft":["Die Rektorstelle am Schulzentrum Rudersberg aus dem Amtsblatt Nr. 15–16 vom 07.09.2026 aufgearbeitet. Neue Projektnotiz [[Rektor-Stelle Schulzentrum Rudersberg]] mit Schule, Umfeld, Leitungssituation, Verfahren und Quellen.","Bewerbungsfrist ermittelt: **28. September 2026**, auf dem Dienstweg beim Staatlichen Schulamt Backnang.","Das Besetzungsverfahren nach § 40 Schulgesetz vollständig geklärt: vier Module, Zeiten, Rollen, Auswahlkommission, Anlassbeurteilung.","Kriterien geschärft: künftig nur noch Konrektorstellen an Realschulen, Rudersberg als einzige Ausnahme. In [[Konrektor-Bewerbung]] festgehalten.","Stellen-Radar automatisiert. Skript `.scripts/kuu_stellen.py` plus geplanter Task `kuu-stellen-check`, jeweils am 8. und 22. im Monat."],"erkenntnisse":["In Winnenden ist die **Rektorstelle** ausgeschrieben, nicht die erste Konrektorstelle. Die würde erst frei, wenn der dortige erste Konrektor nachrückt. Winnenden bleibt deshalb als Kaskade interessant, auch ohne eigene Bewerbung.","Im Schulamtsbezirk Backnang ist derzeit keine einzige Konrektorstelle an einer Realschule offen.","Die Unterrichtsanalyse im Auswahlverfahren findet bewusst in einem nicht affinen Fach statt. Geprüft wird ausdrücklich nicht die Fachkompetenz im Schulfach, sondern allgemeine Pädagogik, Didaktik und Beratung. Der vermeintliche Nachteil ist keiner.","In der Auswahlkommission sitzen neben zwei Vertretern der Schulaufsicht je einer von Schulkonferenz und Schulträger, beide mit Stimmrecht. In Rudersberg zählen Kollegium und Gemeinde also direkt mit.","Die Module Präsentation und schwierige Alltagssituation sind genau die Stellen, an denen es in Fellbach gekippt ist. Diesmal sind Format und Zeiten vorher bekannt und damit trainierbar.","Rudersberg wäre voraussichtlich die letzte Stelle. Das verschiebt den Maßstab weg vom Karriereschritt hin zur Endentscheidung."],"offen":["Abwarten, ob über Frau Flemming-Nikolov ein Signal von der Amtsleitung (Sabine Hagenmüller-Gehring) oder von Schulrat Ade-Thurow kommt. Ohne Signal keine Bewerbung.","Der erweiterte Ausschreibungstext zu Rudersberg fehlt in Lehrer Online BW. Erst über die Schulkategorie Schulverbund suchen, sonst beim Schulamt nachfragen.","Prüfen, ob die Anlassbeurteilung aus dem Fellbach-Verfahren noch innerhalb der Zwei-Jahres-Frist liegt.","Mit Julia besprechen.","Inbox: acht Einträge liegen unsortiert, unter anderem Brain Dump, Retro-Handheld und der EnBW-Widerspruch."]},"befinden":4},{"d":"2026-09-06","teile":{"geschafft":["Quellenangaben auf neun Folien der [[Lernen lernen – Konzept Schulstart Klasse 7|Präsentation]] ergänzt, als dezente graue Zeile am Fuß der Folie: Cowan/Miller, Oakley, Dweck, Blackwell, Roediger & Karpicke, Bjork, Dunlosky, Yerkes & Dodson.","Bei zwei Quellen steht die Einschränkung mit auf der Folie. Roediger & Karpicke: direkt nach dem Lernen liegt Lesen vorn, der Vorsprung des Testens zeigt sich erst nach Tagen. Yerkes-Dodson: die glatte Kurve ist stark vereinfacht und gilt nicht als belegtes Gesetz fürs schulische Lernen.","Fehler gefunden und behoben: Auf der Trennfolie „Ich kann das noch nicht\" stand ein typografisches statt eines geraden Anführungszeichens im Style-Attribut. Dadurch war „noch\" nicht hervorgehoben, also genau das Wort, um das es geht.","Sammel-Quellenzeile in den Fuß des Readers, PDF neu erzeugt, weiterhin vier Seiten.","Neue Notiz [[Erste Stunde – So läuft es bei mir]] samt PDF: Ablauf für den freien Teil der Kennenlernstunde, mit Wortlaut zum Danebenlegen. Die Rituale-Notiz ist entsprechend aufgeräumt, die festen Formulierungen stehen jetzt nur noch an einer Stelle.","Logo: sechs Runden Entwürfe, alle als PNG im Ordner Lernwissenschaft & Pädagogik. Danach gestoppt, nicht verworfen."],"erkenntnisse":["Das kleine l ist in einer Grotesk ein nackter Strich. „Kl\" liest sich deshalb als „KI\", und das heißt heute für jeden erst mal Künstliche Intelligenz. Lösbar über eine Serifenschrift, eine Schreibschrift oder ein von Hand gezeichnetes l mit Schwung am Fuß.","Das griechische Omikron ist zeichengleich mit dem lateinischen O. Eine korrekte Umschrift von Oskar wäre ΟΚ und damit optisch identisch mit OK. Sichtbar griechisch wird es nur mit Ω, und das ist dann bewusst falsch transliteriert.","Die Marke übersteht den Schulkopierer, weil die Palette nur sehr dunkle und sehr helle Töne enthält. Alles Mittlere fällt im harten Schwarz-Weiß zusammen. Das Orange #c2531e aus der Präsentation wird dabei schwarz und wäre auf dunklem Grund unsichtbar.","Ein Name schlägt ein Monogramm, wenn Schüler und Eltern die Materialien zuordnen sollen. „Klein\" muss niemand erklären.","Für die erste Stunde: alles einmal sagen, aber nur eine Sache üben. Das Reinkommen mit einer siebten Klasse am ersten Tag durchzuspielen, kippt leicht ins Grundschulhafte."],"offen":["Entscheiden, was bei vergessenem Material passiert. Zwei Wege stehen in der Erste-Stunde-Notiz, danach ist sie fertig.","Elterninfo für den ersten Elternabend.","Trainingskonzept Grundlagen Mathe: Kopfrechnen, Gleichungen lösen, Material über den Schnittpunkt hinaus.","Stundenplan kommt Montag und entscheidet, ob Doppelstunde oder zwei Einzelstunden.","`Lernen lernen – Plakat A2.html` ist seit dem Bastelplakat überflüssig, Löschen steht noch aus.","Logo, falls wieder aufgenommen: Basis ist das Fachwerk im schwarzen Sechseck. Die Blätter im Ordner heißen Logo-Entwuerfe-Dreiecke, Logo-Entwuerfe-Pfeil, Logo-Entwuerfe-Fachwerk-Initialen, Logo-Test-Schwarzweiss, Logo-Test-Kleingroessen, Logo-Test-3D, Logo-Kl-Positionen, Logo-Kl-Buchstabenformen, Logo-Kl-Schreibschrift und Logo-Wortmarke-Klein. Zuletzt lag „Klein\" als Wortmarke neben dem Zeichen vorn."]},"befinden":4},{"d":"2026-08-28","teile":{"geschafft":["GitHub-Backup für den ganzen Vault eingerichtet: privates Repo [second-brain-vault](https://github.com/UGFVegeta/second-brain-vault), neuer GitHub-Account `UGFVegeta` (Login über Apple), `gh` CLI installiert und angemeldet.","Erster Push des kompletten Vaults nach GitHub.","Aufgeräumt vor dem Push: Readwise-Token-Datei, `.firecrawl/`-Cache und `.claudian/`-Sitzungslogs aus der Versionierung genommen und in `.gitignore` eingetragen.","Readwise-API-Token war seit dem ersten Commit im Repo → alten Token auf readwise.io widerrufen, neuen erzeugt und lokal in die Plugin-Datei eingetragen. Sync läuft wieder.","Automatisches Backup umgestellt: Community-Plugin **Obsidian Git** übernimmt jetzt Commit + Push alle 15 Minuten, solange Obsidian offen ist. Testlauf erfolgreich (`vault backup: 2026-08-28 13:37:31` auf GitHub).","Alten LaunchAgent `com.oskar.vaultgit` abgeschaltet – lief seit 28.06. auf Fehler, weil macOS ihm den Documents-Zugriff verweigert (Grund für die aufgestauten 12.000 Zeilen)."],"erkenntnisse":["Der Git-Balken im Claudian-Plugin schaltet auf „PR erstellen\", sobald ein Remote verbunden ist. Für ein persönliches Backup nutzlos (PR von main nach main geht nicht) → ignorieren, Obsidian Git macht die Arbeit.","launchd-Agenten auf macOS bekommen ohne Festplattenvollzugriff keinen Zugriff auf `~/Documents` → für Vault-Automatik ungeeignet, besser plugin-basiert.","Backup-Setup ist in der `CLAUDE.md` dokumentiert (Abschnitt „GitHub-Backup des Vaults\")."],"offen":["Nichts Dringendes. Bei Bedarf: `.claude/settings.local.json` enthält Tavily- und Firecrawl-Key im Klartext – ist gitignored, also nicht im Backup, aber im Hinterkopf behalten."]}},{"d":"2026-08-23","teile":{"geschafft":["**Platz 3 in der Altersklasse.** Schwimmen gut, Radfahren stark, Laufen eingebrochen.","Rad: 79,66 km, 893 hm, 2:17:34, Ø 243 W bei NP 270 W. Die Vorgabe von NP ≤ 270 W exakt getroffen.","Laufen: 21,255 km in 1:32:59, also 4:22/km statt der geplanten 1:23:12.","Vollständige Auswertung in [[Rennauswertung Breisgau Triathlon 2026]].","Die fehlende Radleistung aus der Edge-Datei nachgeladen, nachdem intervals.icu sie beim Garmin-Import als Dublette verworfen hatte."],"erkenntnisse":["**Die naheliegende Erklärung stimmt nicht.** Der Laufeinbruch lag nicht am geringen Laufumfang. Die Laufleistung lag mit NP 459 W mitten im Zielbereich von 445–460 W, und die Ökonomie hat über 21 km nur 2,3 Prozent nachgelassen. Ein Umfangsdefizit sieht anders aus: hoher Puls, langsame Pace, fortschreitender Ökonomieverlust. Nichts davon steht in den Daten. Die Form war da, sie war nur nicht abrufbar.","**Die Verpflegung war doppelt.** Der Nrgy Drink 90 war mit rund 78 g/h exakt nach Herstellervorgabe dosiert. Die Gelflasche mit weiteren 180 g war ein kompletter zweiter Verpflegungsplan obendrauf, macht 157 g Kohlenhydrate pro Stunde. Auf der Laufstrecke gingen dann nur noch 30 g/h statt der geplanten 60, weil der Magen belegt war. Für die Zukunft: eine Quelle, rund 90 g/h, Wasser getrennt.","**Nur 435 ml Flüssigkeit pro Stunde bei 25,1 °C.** Zu wenig, und die 18-prozentige Lösung zieht zusätzlich Wasser in den Darm. Der Hersteller bewirbt diese Mischung ausdrücklich für kühle Bedingungen.","**Die Radetappe war gut gefahren, entgegen meiner ersten Einschätzung.** Am Streckenprofil ausgerichtet: drei Runden zu 24 km mit 262 / 262 / 255 W und Puls 132 / 130 / 130, am Anstieg jedes Mal 286 bis 290 W. Runde 2 und 3 waren sogar schneller als Runde 1. Dreimal Runde 1 hätte 2:09:21 gedauert statt der gefahrenen 2:05:34.","⚠️ **Methodenfehler auf meiner Seite:** Ich hatte km 0–35 gegen km 35–Ende verglichen, ohne dass beide Abschnitte gleich viel Anstieg enthalten, und daraus fälschlich einen Einbruch abgeleitet. Abschnitte nur vergleichen, wenn das Gelände dasselbe ist.","**Meine Radvorgabe war zu hoch.** NP 270 W sind bei geschätzter Zeitfahr-FTP von 295–310 W eine Intensität von 0,87 bis 0,92. Auf der Mitteldistanz üblich sind 0,75 bis 0,85.","**Acht Minuten Rückstand auf den direkten Konkurrenten, komplett im Lauf entstanden.** Sein Halbmarathon lag bei rund 1:24:59. Davon gehen etwa vier bis sechs Minuten auf die vier bekannten Ursachen, der Rest war schlicht ein starker Lauf von ihm.","**Die Strecke war nicht das Problem.** Mit 6,5 hm/km war sie der flachste der drei Referenzläufe, Schluchsee hatte 25,1 und Ravensburg 22,3. Was den langsameren Zielwert rechtfertigt, ist die mehr als verdoppelte Laufdistanz und die längere Radetappe davor.","**Beide Renn-Vorgaben waren zu ambitioniert.** NP ≤ 270 W auf dem Rad und 1:23:12 im Lauf, beide gegen geschätzte statt gemessene Werte. Die 1:23:12 kamen über zwei Optimismusschritte zustande: ein 9-km-Lauf auf 21 km hochgerechnet plus negativer Split. Realistisch wären 1:26 bis 1:29 gewesen. Regel für die Zukunft: erst messen, dann Zahlen setzen.","⚠️ **Der niedrige Puls bleibt ungeklärt** (Rad Ø 130, Lauf Ø 133 bei max 147, gegen 142 bis 153 in früheren Rennen). Entweder ist die Zeitfahr-FTP höher als geschätzt oder der Puls war gedeckelt. Ohne echten FTP-Test nicht auflösbar."],"offen":["Saisonplanung Herbst bis Frühjahr sauber ausarbeiten, inklusive Kraftroutine für zwei mal 45 Minuten.","**Blockiert dafür:** Was Orthopäde oder Physio zu Belastungsgrenzen für Hüfte und das alte Kreuzband sagen. Bei der Zweitmeinung zur Hüfte mit auf die Fragenliste setzen, zusammen mit der Frage, ob Crosslauf auf engem Rundkurs sinnvoll ist.","FTP-Test in Zeitfahrposition Ende September als Ausgangswert für den Winter.","Klären, ob für die DM Cross eine Qualifikation über den Landesverband nötig ist.","Zwei bis drei Vorbereitungs-Crossläufe im Oktober und November suchen.","Offen aus dem Rennen: Was war in der Gelflasche? Wurde unterwegs zusätzlich Wasser aufgenommen? Siehe [[Rennauswertung Breisgau Triathlon 2026]]."]},"befinden":4},{"d":"2026-08-22","teile":{"geschafft":["5 km locker in 24:23 mit fünf Steigerungen (Splits 5:07 / 5:12 / 5:32 / 4:28, die Steigerungen stecken im letzten Kilometer). Ohne Brustgurt gelaufen, die Pulswerte der Uhr sind deshalb wertlos.","9 km locker Rad, 158 W, reine Streckenerkundung vom Quartier zum See und zur Wechselzone.","**Form am Renntag: CTL 48,0, ATL 38,4, TSB +9,6.** Fast mittig im Zielfenster von +5 bis +20. **Die Rennwoche**","Di 18.08.: 3×1000 auf profilierter Strecke (Bahn Winnenden gesperrt). Real 3:41 / 3:31 / 3:44, nach Abzug der Hubarbeit **465 / 468 / 464 W** – vier Watt Streuung. Danach 2,35 km Schwimmen, erstes Wasser seit zwei Wochen.","Mi 19.08.: 3×6 Minuten auf der Rolle mit **299 / 300 / 300 W** bei HF 121 / 125 / 128. Sehr warmes Zimmer, die sieben Schläge Drift sind reine Wärme.","Do 20.08.: Schwimmen. Fr 21.08.: frei."],"erkenntnisse":["**Laufleistung ist auswertbar.** Die Garmin rechnet Watt beim Laufen, intervals.icu zeigt sie im Rundenüberblick nur nicht an. In den Rohdaten stehen sie. Gleiche Uhr über alle Einheiten, also sind die Werte untereinander vergleichbar.","**Referenzwerte Laufen:** 10-km-Einzelrennen 501 W bei HF 153, Ravensburg 5,2 km nach dem Rad 488 W bei HF 150, Schluchsee (Runden 1–3, ohne die Runde nach dem Umknicken) 455 W bei HF 142. Daraus abgeleitet für Malterdingen: **445–460 W über die 20,8 km, Deckel 470 W in den ersten drei Kilometern.**","**Das Rad kostet rund fünf Prozent Laufleistung** (501 W im Einzelrennen gegen 475 W über vergleichbare Distanz nach der Radstrecke). Erstmals eine Zahl statt eines Gefühls.","**Hitze kostet Tempo, aber keine Leistung.** Die beste 20-Minuten-Leistung liegt in Ravensburg bei 487 W, in Schluchsee bei 490 W und im Hitzelauf am 07.08. bei 490 W. Drei völlig verschiedene Tage, derselbe Deckel. Im Rennen deshalb bei Hitze über Watt und Puls steuern, nicht über die Pace.","**Das Umknicken in Schluchsee ist in den Daten sichtbar.** Runde 4 brauchte 534 W statt 450 W und war trotzdem langsamer, bei unveränderter Herzfrequenz und identischem Profil. Kosten über den ganzen Lauf grob zehn bis fünfzehn Sekunden, kein Einbruch. Ravensburg dagegen zeigt keinerlei Einschränkung, dort war die letzte Runde die schnellste.","**Übersetzung lässt sich aus den Daten ableiten, Zähnezahlen nicht.** Geschwindigkeit geteilt durch Trittfrequenz ergibt die Entfaltung; Radumfang und Zähne lassen sich nicht trennen. Kleinster genutzter Gang **2,65 m je Kurbelumdrehung**, am Berg im Median 3,43 m. Malterdingen verlangt bei 5 % und 300 W rund 3,86 m bei 85 Umdrehungen. Reserve ist reichlich da, es muss nichts umgebaut werden. Siehe [[Sitzposition Zeitfahrrad (Cube Aerium C68)]].","**Trittfrequenz am Berg ist mit 76 eher niedrig.** Am Sonntag bewusst einen Gang leichter Richtung 85, das schont die Beine für den Halbmarathon.","**TP-Virtual-Fahrten kommen nicht von allein in intervals.icu.** Sie gehen nie zu Garmin und sind über Strava an der API gesperrt. Drei Dateien fehlten (16.07., 20.07., 19.08.), alle nachgeladen. Die CTL lag dadurch einen Punkt zu niedrig. Nach jeder Rollenfahrt `python3 .scripts/intervals_tpv_upload.py` laufen lassen.","**Gewicht:** aktuell 78–79 kg, in Topform im Herbst 2025 waren es 74. Vier Kilo weniger wären auf der Mitteldistanz grob vier bis fünf Minuten wert (Laufen zwei bis dreieinhalb, Rad anderthalb bis zwei, Schwimmen leicht negativ wegen der Wasserlage). Kein Diätthema, sondern ein Süßigkeitenthema: keine Mahlzeit ändern, nur Schokolade und Gummibärchen weglassen. Der Hebel liegt beim Einkauf, nicht am Abend auf dem Sofa, und der eigentliche Auslöser ist die Schulzeit, nicht der Sommer. Ausdrücklich erst nach dem Rennen anfangen.","**Aeroposition ist kein offener Punkt mehr.** Zweieinhalb Stunden sind kein Problem, das war eine Lücke in den Daten und kein Problem am Rad."],"offen":["Neoprenfrage klären: Wassertemperatur und Regel am Renntag bei der Anmeldung.","Nach dem Rennen: sauberer FTP-Test in Zeitradposition, die 295–310 W sind bisher nur geschätzt.","Nach dem Rennen: Schwimmen als Winterthema angehen. Nicht die Ausdauer ist das Limit, sondern Wasserlage und Grundschnelligkeit, dafür kurze Intervalle statt langer Strecken.","LaunchAgent für den TP-Virtual-Upload einrichten, damit die Rollenfahrten automatisch ankommen.","Auswertung des Rennens gegen die hier festgehaltenen Zielwerte. Siehe [[Laufform & Renntempo Mitteldistanz]] und [[Sitzposition Zeitfahrrad (Cube Aerium C68)]]."]}},{"d":"2026-08-18","teile":{"geschafft":["**Grußworte auf einer Seite.** Neu unter `/grussworte` mit allen vier Grußworten als Karten: Klaus Silbernagel (neu, aus PDF), Michael Scharmann, Dr. Richard Sigel, Dieter Schneider. Damit ist erledigt, was Oskar seit Wochen gestört hat, nämlich vier Einzelseiten im Klappmenü unter *DM Cross*. Die drei alten Seiten werden gelöscht, vorher geprüft dass nichts mehr darauf verlinkt.","**Klaus Silbernagels Unterschrift** aus dem PDF freigestellt. Das PDF ist ein Scan, die Unterschrift steckte im Seitenbild. Über die **Tintenfarbe** isoliert statt über die Helligkeit, dadurch bleibt der schwarze Text darunter weg. 7 KB mit Transparenz.","**Ergebnisarchiv** neu als Kartenraster. Vorher hießen alle neun Links „Click here\". Beim Umbau alle Ziele geprüft: fünf zeigten auf abavent.de, das inzwischen auf datasport.de umleitet, jetzt direkt aufs Endziel. 2017 läuft nun über https, 2016 bleibt bei http, weil der Server dort die verschlüsselte Verbindung abbricht.","**Maultaschenparty** (Wunsch von Nicole): Infoschreiben und Anmeldung auf einer Seite. Eckdaten als Karten, Texte wortgleich zum Flyer, Flyer als Bild, PDF zum Herunterladen, Sprungknopf nach unten zur Anmeldung.","**Ausschreibung des DLV** als Menüpunkt „Ausschreibung DLV\" unter *DM Cross*.","**SG Weinstadt verlinkt** (Wunsch von Jürgen Illg, Abteilungsleiter LA): Vereinslogo bei den Partnern auf der Startseite und ein Veranstalter-Block im Fußbereich, der auf jeder Seite steht. Logo aus dem offiziellen SVG der Vereinsseite nach PNG gewandelt.","Dabei das **Archiv-Widget** aus dem Fußbereich entfernt, das seit Jahren auf jeder Seite eine Monatsliste seit 2022 ausgab.","**Begrüßungstext der Startseite ersetzt.** Dort stand noch der Dankestext nach dem Rennen 2025 („Danke an über 550 begeisterte Teilnehmerinnen und Teilnehmer\"), die Startseite las sich also wie ein Rückblick statt wie eine Einladung. Neuer Text vom Orga-Team, unverändert übernommen, mit zwei Links auf die Maultaschenparty-Seite und deren Anmeldebereich. **Kein neues CSS nötig**, der Begrüßungstext wird bereits von TEIL 1 über `body.home .column_column` gestaltet.","**Copyright-Zeile** ersetzt. Dort stand die Voreinstellung „© 2026 Betheme by Muffin group | All Rights Reserved | Powered by WordPress\", jetzt „© 2026 Volksbank WeinstadtCross · Veranstalter: SG Weinstadt e. V., Abteilung Leichtathletik\". Zu ändern in den Betheme Theme Options unter *Footer & Sidebars*, Abschnitt *Copyright & Social Bar*."],"offen":["Die drei alten Grußwort-Seiten löschen: `/grusswort-dieter-schneider`, `/grusswort-dr-richard-sigel`, `/impressum-2`.","Menüpunkt „Ausschreibung DLV\" öffnet noch im selben Tab. Häkchen „Linkziel\" im Menü-Editor unter *Ansicht anpassen* einblenden.","⚠️ Der DLV-Link enthält ein Datum im Dateinamen. Bei einer neuen Fassung ändert sich die Adresse und der Link geht still ins Leere. Vor dem Wettkampf prüfen.","Auf der Anmeldeseite ist der raceresult-Baustein **doppelt** eingebunden. Der zweite Container bleibt leer und wirft einen Fehler in der Browser-Konsole. Kann raus.","Kaputte YouTube-Einbettung auf der Sponsorenseite, eine vollständige Adresse steht hinter `/embed/`.","Zeitplan wartet weiter auf die DLV-Genehmigung."]}},{"d":"2026-08-17","teile":{"geschafft":["R46H Handheld angekommen. Komplette Original-SD-Karte (64 GB) gesichert nach `iCloud Drive/R46H/`.","Spiele-Sicherung auf Dateiebene: 49.135 Dateien, 46,24 GB. Gegen die Karte verifiziert über Dateizahl und exakte Bytesumme, Abweichung nur vier bewusst ausgelassene macOS-Metadateien.","System-Image der Karte gezogen: `System-Image.img`, 10.957.602.304 Bytes, enthält Partitionstabelle, FAT32-Boot-Partition und die ext4-Systempartition `root`. Inhalt geprüft (MBR-Signatur, FAT32-Kennung, ext4-Magic).","Neue Karte (SanDisk Ultra 64 GB, 63.864.569.856 Bytes) mit dem System-Image bespielt. Boot-Partition Datei für Datei per Prüfsumme gegen die Sicherung verifiziert, identisch.","Skript-Kette in den Backup-Ordner gelegt: Sichern, Image vervollständigen, neue Karte bespielen, Partition vergrößern, formatieren und kopieren. Alle mit Sicherheitsabfragen gegen die falsche Zielplatte. ### Mietverwaltung (Übergabepaket, Termin heute)","Aus der Demo-Attrappe ein lauffähiges Paket gemacht: [[02 Projekte/Mietverwaltung/Mietverwaltung]] mit dem Übergabeordner `mietverwaltung/`, gebaut für Claude Code auf Windows. Acht Python-Skripte ohne Fremdbibliotheken, fünf Skills, drei .bat-Dateien zum Anklicken, CLAUDE.md mit Grundregeln, Doku zu Bankanbindung und Datenschutz.","Zahlungszuordnung über ein Punktesystem: IBAN 60, Mietername 30, Betrag 25, Objektname 15, ab 70 gilt sie als sicher. Ungeprüfte Vorschläge zählen bewusst nicht als bezahlt.","CSV-Import für die gängigen Banken plus camt-XML. Drei fremde Formate gegengetestet: DKB mit Vorspann, N26 mit englischen Spalten und Punkt als Dezimaltrenner, alte Sparkassendatei mit Soll/Haben-Kennzeichen.","Eigener xlsx-Leser gebaut, ohne Fremdbibliothek, inklusive Rückrechnung der Excel-Datumszahlen. Damit werden vorhandene Vermieter-Listen übernommen statt abgefragt.","Selbsttest mit 20 Prüfungen, dazu den Leerzustand komplett durchgespielt, in dem der Kollege heute startet.","Gedruckte Einrichtungsanleitung als PDF, drei Seiten, bewusst allgemein formuliert statt auf eine Person zugeschnitten. Liegt im Paket selbst, damit jeder sie dabeihat, der den Ordner bekommt. Generator daneben.","Demo aus 01 Inbox/ ins Projekt verschoben."],"erkenntnisse":["**Zwei echte Fehler kamen erst beim Testen mit Daten heraus.** Monate ohne importierte Kontoumsätze galten als unbezahlt, das Dashboard hätte beim ersten Import fünfstellige Phantom-Rückstände gemeldet. Und die Textnormalisierung zerstörte die Trennzeichen, weshalb „Miete 07/2026 plus Restbetrag Juni\" im Juni landete statt im Juli. Beides wäre in einer reinen Codedurchsicht nicht aufgefallen.","**Claude Code liest PDFs direkt, Excel nicht.** Deshalb war ein Konverter nur für xlsx nötig. Eine xlsx-Datei ist ein ZIP mit XML darin, das geht mit Bordmitteln.","**Messen statt schätzen bei Kontextkosten.** Eine Excel-Liste mit 30 Einheiten sind 5.125 Zeichen, also rund 1.500 Tokens. Ein zehnseitiger Mietvertrag als PDF liegt bei grob 10.000 bis 16.000. Konsequenz: Tabellen komplett lesen, Verträge nie auf Vorrat.","**Der Direktabruf per FinTS lohnt erst bei täglichem Abruf.** Monatlich spart er eine Minute und kostet einen Einrichtungsnachmittag. Dazu zwei Haken: Vollautomatisch gibt es wegen PSD2 nicht, alle 90 Tage kommt eine TAN-Abfrage, und unbeaufsichtigter Betrieb heißt zwangsläufig gespeicherte PIN.","**Bibliotheken geprüft:** `fints` 5.0.0 (Januar 2026) und `mt-940` 5.0.0 (Juni 2026) werden gepflegt. Die FinTS-Institutsdatenbank auf hbci-zka.de und die Preisseite von Enable Banking waren nicht erreichbar, deshalb steht dazu nichts in der Doku. ### Handheld","**Ein Handheld dieser Bauart lässt sich nicht per Datei-Kopie umziehen.** Die Karte hat drei Partitionen, das Betriebssystem liegt auf einer 10,8 GB großen ext4-Partition, die macOS nicht lesen kann. Ohne Roh-Image der ersten Partitionen bootet eine neue Karte nicht.","**`du -sh` liefert Gibibyte, nicht Gigabyte.** Ich hatte die Spielemenge deshalb als 43 GB geführt, tatsächlich sind es 46,24 GB. Die Original-Partition fasst 46,71 GB, die Karte war also zu 99 Prozent voll statt zu 92. Diese Fehleinschätzung war die Wurzel des Folgeproblems.","**Die exFAT-Blockgröße entscheidet hier über Erfolg oder Misserfolg.** `diskutil eraseVolume` wählt 128-KB-Blöcke. Bei 49.135 Dateien wachsen 46,24 GB Nutzdaten dadurch auf 50,43 GB Belegung. Die Partition lief bei 43,3 GB voll, 8.043 Dateien fehlten. Mit 32 KB sind es 47,20 GB, mit 4 KB 46,34 GB.","**Ein `rsync`-Trockenlauf ohne `-v` beweist gar nichts.** Er gibt grundsätzlich nichts aus, leere Ausgabe heißt nicht „identisch\". Belastbar sind nur Vergleiche von Dateizahl und Bytesumme.","**`AC attached` heißt nicht `lädt`.** Ein zu schwaches Netzteil wird erkannt, der Rechner zieht aber weiter aus dem Akku. Kontrolle über `IsCharging` und die Stromstärke in `ioreg`, negative Werte bedeuten Entladung."],"offen":["**Termin heute.** Ablauf: Paket aufspielen und Selbsttest, dann ein Objekt vollständig erfassen, dann echter Kontoauszug und Dashboard, erst danach der Rest der Liste. Der Durchstich mit einem Objekt zeigt, ob die Zuordnung mit seinen echten Verwendungszwecken zurechtkommt.","Vorab bereitlegen: alles Digitale zu den Wohnungen in einen Ordner, und Python vorher installieren mit dem Häkchen bei „Add Python to PATH\". Das ist die einzige Stelle, an der es hakeln kann.","Formulierung im Paket bewusst allgemein gehalten, nicht auf eine Person zugeschnitten. Es lässt sich damit ohne Änderung an weitere Interessierte weitergeben.","Nicht heute: FinTS-Direktanbindung. Der CSV-Weg funktioniert mit jeder Bank sofort.","Noch nicht gebaut: Nebenkostenabrechnung, der größte nächste Brocken und die größte Zeitersparnis für ihn. Danach das Mieterhöhungs- und Index-Radar, das ist einfacher, weil der Verbraucherpreisindex frei abrufbar ist. Beides erst angehen, wenn die Grundlage bei ihm ein paar Wochen läuft. ### Handheld","Schritt 4 laufen lassen: ROM-Partition der neuen Karte von 46,71 auf 52,91 GB ausdehnen, in den freien Bereich am Kartenende.","Danach Schritt 5: mit 32-KB-Blöcken als exFAT formatieren und die Spiele zurückkopieren, rund anderthalb Stunden. Danach etwa 5,7 GB frei für Spielstände.","Neue Karte im Gerät testen, Spiele aus mehreren Systemen starten.","Alte Karte bis dahin unangetastet aufheben, sie ist der einzige echte Rückweg.","Offene Unsicherheit: ob das System die ROM-Partition über den Namen EASYROMS oder über die Seriennummer sucht. Die originale exFAT-Seriennummer ist gesichert, falls nachgezogen werden muss.","iCloud-Upload der 46 GB läuft im Hintergrund weiter. Details und die Befehle stehen in `iCloud Drive/R46H/LIESMICH.md`."]}},{"d":"2026-08-15","teile":{"geschafft":["**Zweiter schmerzfreier Tag in Folge**, Hüfte und Sprunggelenk. Gestern war der erste.","Komplettes **Hüft-Paket** im Vault aufgebaut, drei verzahnte Notizen:","  [[Hüfte – Übersicht & Entscheidungsstand]] als Einstiegspunkt mit Trigger-Kriterien und Verlauf","  [[Krafttraining Hüfte – Coxarthrose]] mit Block A, Block B und Abendroutine","  [[Hüftarthrose – Zweitmeinung, Klinikoptionen & Fragenliste]] mit 22 Fragen für die Sprechstunde","**18 eigene SVG-Zeichnungen** für alle Übungen und die Schlafpositionen erstellt.","**15 Videolinks** gesucht, einzeln auf Abrufbarkeit geprüft und pro Übung eingetragen, bevorzugt Physio-Quellen.","Aus jedem Video ein **Standbild** geschnitten und neben die Zeichnung gestellt.","**Studio-Karte als PDF** gebaut, zwei Seiten, mit Bildern und antippbaren Videolinks. Skript zum Neubauen liegt daneben.","Instagram-Archiv ausgewertet: 11 gespeicherte Posts gesichtet, 4 im Detail. Zwei Übungen übernommen (B6 seitlicher Ausfallschritt, R5 Innenrotation).","Trainingsdaten aus intervals.icu gezogen: 28 Tage, 36 Einheiten, **0 Krafteinheiten**, Laufumfang ca. 16 km/Woche."],"erkenntnisse":["**Der Nachtschmerz im Juli und August war vermutlich konfundiert.** Zeitachse: Hyaluronspritze Mitte/Ende Mai → schmerzfrei. Supinationstrauma am 11.07. → Orthese → verändertes Gangbild → Hüftschmerz. Ausheilung laut Prognose 08.–22.08. → beides gleichzeitig weg. Der Schmerz kam also wahrscheinlich aus der veränderten Mechanik, **nicht** aus einem Fortschreiten der Arthrose.","**Warum diese Erklärung die bessere ist:** „Die Spritze lässt nach\" erklärt zwar das Auftreten, aber nicht das Verschwinden an einem einzigen Tag. Die Sprunggelenk-Erklärung deckt beide Enden ab.","**Konsequenz:** Die Uhr für das Trigger-Kriterium Nachtschmerz startet neu, ab jetzt mit ausgeheiltem Sprunggelenk und normalem Gangbild.","**Was das über die Hüfte verrät:** Sie verträgt normale Belastung gut, reagiert aber empfindlich auf veränderte Mechanik. Das ist das stärkste Argument für den Kraftplan.","**Krafttraining ist die einzige Maßnahme mit belastbarer Evidenz** bei Coxarthrose. Effektgröße auf den Schmerz in der Größenordnung von Schmerzmitteln. Wirkt doppelt: verschiebt den OP-Zeitpunkt und verbessert das Ergebnis danach.","**Stammzellen bringen nichts.** Keine randomisierten Studien für die Hüfte, kein Nachweis von Knorpelregeneration, Selbstzahler.","**Oberflächenersatz** wäre für das Profil interessant, aber das OZF operiert über den vorderen DAA-Zugang und bietet ihn deshalb systematisch nicht an. Klinikum Stuttgart nennt ihn ausdrücklich im Spektrum. Dritte Option: Kurzschaftprothese als Mittelweg.","Das **Blackroll-Band im Stand** ist bereits B3, nur zuhause. Aktivierung ist aber nicht Krafttraining und ersetzt die Studio-Version nicht.","Vieles im Plan war nicht neu, sondern hat sortiert, was ohnehin schon gemacht wurde. Die echten Lücken waren **schwere progressive Last** und die **Frontalebene**."],"offen":["[ ] **Tracking führen**, ab jetzt jede Woche eine Zeile: Nächte mit Aufwachen, Krafteinheiten, Lauf-km. Erst ab jetzt aussagekräftig.","[ ] **Krafttraining starten**, 2× pro Woche, Block A und B im Wechsel","[ ] **DXA-Knochendichtemessung** am OZF (T-Score −1,5 oder besser ist Voraussetzung für Oberflächenersatz)","[ ] Röntgenbilder und Befundbericht als Kopie anfordern","[ ] Termin **EndoProthetikZentrum Klinikum Stuttgart**, Oberflächenersatz bei der Anmeldung ausdrücklich nennen","[ ] Dr. Roser auf knochensparende Verfahren und eine Zweitmeinung ansprechen, plus Wiederholung der Hyaluronspritze","[ ] Fragenliste als PDF zum Ausdrucken (steht noch aus)","[ ] Beobachten: Falls der Schmerz in 4–8 Wochen bei **normalem Gangbild** zurückkommt, spricht das für nachlassende Spritzenwirkung, nicht für Fortschreiten"]}},{"d":"2026-08-08","teile":{"geschafft":["**Seitentitel** gesetzt: „Volksbank WeinstadtCross 2026 | DM Crosslauf in Weinstadt\", 57 Zeichen.","**Meta-Beschreibung** der Startseite: 154 Zeichen, mit Datum und Ort. Vorher stand dort seit Jahren „Just another WordPress site\".","**WordPress-Untertitel** auf „Deutsche Crosslauf-Meisterschaften am 28. und 29. November 2026 in Weinstadt\" geändert.","**Schema.org-Event** als JSON-LD auf der Startseite: `SportsEvent`, 28.–29.11.2026, Stadion Benzach, Veranstalter SG Weinstadt e.V., beide Wettkampftage einzeln. Google kann die Veranstaltung jetzt als Termin lesen.","**Vorschaubild fürs Teilen** (og:image) erstellt und gesetzt, 1200 × 630, Foto vom Massenstart unter dem gelben Bogen mit Titel und Datum im Stil des Hero-Blocks. Liegt auf der Startseite und auf Anreise und Parken, Übernachten, Strecken, Ausschreibung und Prämien. In WhatsApp geprüft, sieht gut aus."],"offen":["**Meta-Beschreibungen der fünf Unterseiten** bewusst zurückgestellt. Texte liegen fertig in `Meta-Beschreibungen Unterseiten.txt` im Homepage-Ordner. Bei Gelegenheit in einem Durchgang eintragen, oben unter der Google-Vorschau.","Vorschaubild fehlt noch bei den News-**Beiträgen**.","**Zeitplan wartet auf die DLV-Freigabe.** Danach: Block und PDF neu erzeugen, Versionsnummer an den PDF-Link, einen der beiden Download-Knöpfe entfernen, Seite ins Menü, Yoast wieder auf indexierbar. Dann auch die Startzeiten ins Event-Markup nachtragen.","Alte Doppelseiten `/zeitplan` und `/strecken-neu-2` löschen oder umleiten.","Offene Inhaltsfragen ans Orga-Team: genaue Parkadressen, Fußweg von ITT Cannon, und die Rundenlängen (4 CR = 4,2 km bricht das sonst durchgehende 1,1-km-Muster).","Datenschutz der Seite: Google Analytics, Google Fonts und YouTube laden weiterhin ohne Einwilligung."]}},{"d":"2026-08-06","teile":{"geschafft":["**Zwei neue Reiter gebaut**: Anreise & Parken mit vier Lageplänen aus dem PDF des Orga-Teams, sowie Übernachten mit 16 geprüften Links zu Hotels, Ferienwohnungen und Wohnmobilstellplätzen. Beide liegen fertig im iCloud-Ordner, sind aber noch nicht in WordPress angelegt.","**Startseite modernisiert**, ohne Inhalt oder Arbeitsablauf zu ändern. Umgesetzt als reines Stylesheet, damit die Beiträge weiterhin dynamisch aus WordPress kommen. Inzwischen acht Teile, das Stylesheet deckt Startseite, Unterseiten, Hero, Prämien, Strecken, Download-Knopf und Zeitplan ab.","**Hero-Bereich** an der Stelle des kaputten LayerSliders. Fünf Fotos, Bildwechsel per CSS ohne JavaScript. Nach Kritik an der ersten Fassung in zwei ruhigeren Varianten neu gebaut, Variante A gewonnen.","**Prämien- und Streckenseite** von eingebetteten PDFs auf echtes HTML umgestellt. Streckenplan zweimal aktualisiert, weil der Kollege nachgeliefert hat.","**Zeitplan** komplett neu aus der Excel erzeugt, dazu ein einseitiges PDF im Seitendesign für die Vorlage beim DLV. Alles skriptgesteuert, keine Zahl von Hand abgetippt.","**Technik-Prüfung der Startseite**: 77 Anfragen, 4,5 MB. Acht Sponsorenlogos machen 2,6 MB aus, optimierte Fassungen mit zusammen 255 KB liegen bereit."],"erkenntnisse":["**Bei Excel-Dateien immer zuerst alle Tabellenblätter auflisten.** Ich hatte Blatt 1 gelesen und daraus geschlossen, es fehlten sieben Startzeiten. Der fertige Plan lag in Blatt 2. Oskars Einwand hat den Fehler aufgedeckt. Das Skript wählt das Blatt jetzt selbst anhand des Inhalts.","**Bilder unter gleichem Namen zu ersetzen reicht nicht.** Der Server erlaubt vier Wochen Zwischenspeicherung, Chrome zeigte deshalb tagelang die alte Strecke. Lösung ist eine Versionsnummer an der Bildadresse, nicht ein neuer Dateiname.","**Erst prüfen ob die Datei überhaupt ankommt, dann an Selektoren schrauben.** Ein vermeintliches CSS-Problem war ein abgestürzter Testserver. Netzwerkprotokoll schlägt Vermutung.","**HTML-Bausteine für WordPress in reinem ASCII ausliefern**, Umlaute als Entities. Beim ersten Einfügen kamen sonst Zeichensalat-Umlaute an, verursacht durch den Kopierweg über eine Textdatei.","**Was für Web und Druck dient, braucht vor dem Drucken eine Bereinigung.** Im PDF stand ein Link zum Herunterladen genau dieses PDF.","Grundsatz, der sich mehrfach bewährt hat: **behaupten erst nach dem Messen.** Prüfsummen, Zeilenvergleiche und Netzwerkprotokolle haben an diesem Tag mehrere falsche Vermutungen von mir widerlegt, darunter auch eigene."],"offen":["**Sponsorenlogos austauschen** (morgen). Fertige Dateien in `Homepage WeinstadtCross/2026/Logos optimiert/`, spart 2,3 MB.","**Meta-Beschreibung ersetzen.** Google zeigt weiterhin „Just another WordPress site\". Fertiger Text liegt seit dem 01.06. in [[WeinstadtCross – SEO-Optimierung]]. Fünf Minuten, größte Außenwirkung.","Danach Seitentitel, Vorschaubild fürs Teilen und Schema.org-Event aus derselben Notiz.","**Die beiden Reiter** Anreise & Parken und Übernachten in WordPress anlegen und ins Menü hängen.","**Zeitplan wartet auf die DLV-Genehmigung.** Danach Excel neu einlesen, PDF-Link mit Versionsnummer versehen, einen der beiden Download-Knöpfe entfernen, Seite ins Menü. Bis dahin bei Yoast auf „nicht in Suchergebnissen\" stellen.","Offene inhaltliche Fragen ans Orga-Team: Adressen der Parkplätze, Fußwegzeit vom ITT Cannon, Prämienzahlen 2026, sowie die Rundenlogik (zwischen drei und vier Runden fehlen 100 m).","Datenschutz: Google Analytics, Google Fonts und YouTube laden ohne Einwilligung."]}},{"d":"2026-08-03","teile":{"geschafft":["Kaufentscheidung Retro-Handheld abgeschlossen und dokumentiert in [[Retro-Handheld Kaufentscheidung R46H]]","**R46H bestellt** (4,2\", 1024 × 768, RK3326, WLAN) für 58 € inkl. Versand, Zoll und Aufbewahrungsbox","Vorher bestellten R36H Pro Max storniert, weil der R46H dieselbe Hardware mit besserer Tastenanordnung hat (Steuerkreuz oben)","Recherche zur gesamten R36-Serie: Display-Vergleichstabelle, Chip-Wahrheit, Verkäuferbewertung","AYN Thor als späteren Zweitkauf durchgerechnet, inklusive Preise, AliExpress-Rabattcodes und Wiederverkaufsrechnung","**Kostenlose Routenplanung für Garmin** recherchiert, Ergebnis: [cycle.travel](https://cycle.travel/map) für Radstrecken, GPX-Export und direkter Versand an Garmin Connect","**Switch 2 Kaufsuche** gestartet: Marktpreis ermittelt, Shop smartport.com geprüft und verworfen, vier Kleinanzeigen-Angebote bewertet, Preisvorschlag über 345 € abgeschickt"],"erkenntnisse":["**Die komplette R36-Serie läuft auf demselben RK3326.** S, H, Plus, Max, Ultra, Ultra X, Pro Max und auch der R46H. Der Modellname kauft nur Bildschirm, Gehäuse und Tastenanordnung, keine Rechenleistung. Angaben wie „RK3566, 2 GB RAM\" in Angeboten sind nicht verlässlich, weil die Namen nicht geschützt sind.","Der R36 Ultra X hat trotz größtem Display das schlechteste Bild der Serie: 640 × 480 auf 4,5 Zoll gezogen sind nur 178 PPI. Größer heißt hier nicht besser.","Bei diesen Geräten stimmen die Spezifikationen meistens, **das Risiko liegt beim Verkäufer**. Verkaufszahlen und Bewertungsmasse sind wichtiger als die letzten sechs Euro Preisunterschied. Häufigste Masche ist eine Speicherkarte mit gefälschter Kapazität.","Die Tastenanordnung ist die einzige Angabe, die kein Verkäufer im Text schönschreiben kann. Sie ist auf den Produktfotos sichtbar.","Für Kinder ist nicht das Baujahr das Auswahlkriterium, sondern die Bedienbarkeit. 8-Bit und Game Boy sind oft der bessere Einstieg als SNES, und die frühen Arcade-Klassiker funktionieren hervorragend, obwohl sie älter sind als das NES.","AliExpress-Produktseiten kann Claude wegen reCAPTCHA nicht auslesen, und Produktlinks sind an Region und Session gebunden. Der zuverlässige Weg ist ein Screenshot der Spezifikationstabelle aus Oskars eigener App.","⚠️ **Claude kann bei Kleinanzeigen nicht erkennen, ob eine Anzeige reserviert oder gelöscht ist.** Die Wörter „Reserviert\" und „Gelöscht\" stehen im Quelltext jeder Seite als ausgeblendete Elemente. Ich hatte deshalb drei Anzeigen fälschlich als vergriffen gemeldet. Verfügbarkeit prüft Oskar selbst, Preis und Plausibilität kann Claude weiter bewerten.","**Zahlungswege bei Kleinanzeigen:** PayPal Freunde und Familie gibt null Käuferschutz und ist der häufigste Betrugsweg. Bei PayPal Waren und Dienstleistungen zahlt der **Verkäufer** 2,49 % plus 0,35 € Gebühr, bei Kleinanzeigens „Sicher bezahlen\" zahlt der **Käufer** die Gebühr. Daraus lassen sich Angebote bauen, bei denen beide Seiten besser dastehen.","Komoot ist seit der Übernahme durch Bending Spoons ein Abo (ca. 50 bis 80 $/Jahr), das alte Modell mit gekauften Regionen gibt es nicht mehr. Stravas Routenplaner ist ohnehin abopflichtig. Die Strava-Heatmap bleibt mit kostenlosem Konto nutzbar und lässt sich in bikerouter.de als Kartenebene einblenden.","Bei Elektronik aus Grauimport-Shops (Beispiel smartport.com, Sitz Zug/Schweiz) ist nicht der Preis das Problem, sondern dass Gewährleistung gegen ein Nicht-EU-Unternehmen läuft. Immer den realen Marktpreis als Vergleich nehmen, nicht die UVP, sonst wirkt die Ersparnis doppelt so groß wie sie ist."],"offen":["Wenn das Paket ankommt: **`f3`-Test auf die mitgelieferte Speicherkarte**, solange der AliExpress-Käuferschutz noch läuft","Danach Originalkarte unangetastet lassen und auf einer der beiden eigenen 64-GB-Karten die aufgeräumte Version aufbauen","Prüfen, ob der R46H zwei Kartenslots hat","Kinderkarte kuratieren, sobald die Tochter soweit ist (in ca. einem Jahr), Systemliste steht bereits in der Notiz","AYN Thor Base bleibt als späterer Kauf offen, Recherche ist dokumentiert","Notiz liegt in 01 Inbox/ und kann bei Gelegenheit nach 04 Ressourcen/ einsortiert werden"]}},{"d":"2026-07-28","teile":{"geschafft":["**Wettkampf-Dashboard-System aufgebaut** unter `04 Ressourcen/Triathlon & Training/Wettkampf-Dashboards/`: eine Übersichtsseite mit Filter (Alle / Triathlon / Laufen / Nur kommende) und dahinter je ein eigenes Renn-Dashboard. Gemeinsames `dashboard.css` und `dashboard.js` für Karte, Höhenprofil, Anstiege, Untergrund-Balken, Countdown und Theme.","**Ravensburger Triathlon (Sprint, 01.08.2026)**: Dashboard mit allen offiziellen Streckenplänen, Zeitplan, Wechselzone, Anfahrt und Renn-Notizen. Radstrecke aus dem Komoot-Track des Veranstalters berechnet: 24,83 km, 394 hm, durchgehend asphaltiert. Zwei entscheidende Anstiege bei km 2,4–3,6 (68 hm, 5,9 %) und km 13,9–15,8 (98 hm, Spitzen bis 13 %).","**Breisgau Triathlon (Mitteldistanz, 23.08.2026)**: Dashboard mit GPS-Daten für alle drei Disziplinen. Rad 80,16 km / 908 hm, davon ~7 km Anfahrt plus drei Runden à 24,4 km. Lauf zwei Runden à 10,4 km, nur gut 30 % Asphalt, rund ein Drittel Naturboden. Dazu Neopren-Grenzen, Beutelsystem, Zeitlimits und Punkt-zu-Punkt-Logistik aus der Ausschreibung.","**Volksbank WeinstadtCross (28./29.11.2026)**: Dashboard aus den PDFs des Veranstalters (Streckenplan, Zeitplan, Ausschreibung), automatisch als Bild gerendert und zugeschnitten. Rundensystem 150 / 300 / 600 / 1.100 m, Einlaufrunde mit 300 m aus dem Zeitplan hergeleitet.","**Update-Pipeline** gebaut: `.scripts/tri_races.json` als Konfiguration und `.scripts/tri_update.py` als Skript. Lädt GPS-Tracks, Bilder und PDFs neu, rechnet Profile und Untergrund aus, schreibt die Übersicht und meldet über Hash-Vergleich, welche Veranstalterseite sich geändert hat. Zwei `.command`-Dateien zum Öffnen und Aktualisieren per Doppelklick.","Projektnotiz [[BW Meister Sprint Triathlon 2026]] und Bereichsnotiz [[Triathlon & Training]] auf die neue Struktur gezogen."],"erkenntnisse":["**Reiter in Vault-HTML nie über JavaScript lösen.** In der Claude-Vorschau und in Obsidian-Einbettungen werden Klicks nicht an die Seite durchgereicht. Jetzt laufen alle Reiter über versteckte Radio-Buttons plus CSS und funktionieren überall.","**Veranstalterangaben und GPS-Tracks widersprechen sich regelmäßig.** Breisgau nennt 1.119 hm auf dem Rad, der eigene eingebundene Komoot-Track ergibt 908 hm. Beim Lauf stehen 278 hm gegen 97 hm. Beide Werte stehen im Dashboard mit ⚠️ nebeneinander statt aufgelöst.","**Komoot-Einbettungen sind eine sehr gute Datenquelle.** Aus Tour-ID plus Share-Token liefert die API Koordinaten, Höhen, Untergrund und Wegtypen. Damit lassen sich Untergrund-Anteile belegen statt zu schätzen, zum Beispiel dass der Breisgau-Halbmarathon überwiegend über Feldwege führt.","**Automatik nur für Zahlen, nicht für Texte.** Distanzen, Höhenprofile und Untergrund kommen aus den Tracks, Zeitpläne und Gebühren bleiben redaktionell im HTML. Das Skript meldet stattdessen, wo sich eine Quellenseite geändert hat."],"offen":["Höhenmeter-Widersprüche beim Breisgau Triathlon beim Veranstalter klären","WeinstadtCross: Meldeweg für die DM-Altersklassen und die Zielschlusszeiten sind nicht veröffentlicht","Im offiziellen WeinstadtCross-Zeitplan ist die Altersspalte um zwei Zeilen verrutscht, bei Gelegenheit dem Orga-Team melden (passt zu [[WeinstadtCross Website Relaunch]])","Ravensburg am Samstag: Startgruppen-Zuordnung abwarten, Neoprenfrage entscheidet sich am Wettkampftag","Für weitere Wettkämpfe einfach einen Block in `.scripts/tri_races.json` ergänzen"]}},{"d":"2026-07-22","teile":{"geschafft":["**SNES Classic Mini auf Werkszustand zurückgesetzt.** Die Homebrew (hakchi2 v2.32) ließ sich nicht per Menü-Reset entfernen, weil der hakchi-Kernel unangetastet blieb. Lösung: in hakchi2 am PC über `Kernel → Deinstallieren` mit der Datei `dump/kernel_snes.img`, Konsole vorher im FEL-Modus (RESET gedrückt halten beim Einschalten, schwarzer Bildschirm ist korrekt). Hat funktioniert, Konsole ist wieder original mit 21 Spielen.","**New Nintendo 2DS XL verkaufsfertig gemacht:** SD-Karte entfernt und Konsole formatiert. Die Custom Firmware bleibt drauf (Begründung siehe Erkenntnisse).","**Zwei Kleinanzeigen-Inserate geschrieben und eingestellt**, beide inzwischen freigegeben: New Nintendo 2DS XL schwarz/türkis mit OVP, Netzteil, ungeöffneten AR-Karten und Die Sims 3 Einfach Tierisch für **299 € VB**; SNES Classic Mini mit OVP, zwei Controllern und 8Bitdo Retro Receiver für **139 € VB**.","**Alle Verkaufsfotos als JPEG in den Downloads-Ordner konvertiert** (sechs für den 2DS XL, fünf für den SNES Mini).","**Kaufentscheidung getroffen: Nintendo Switch 2**, sobald beide Geräte verkauft sind. Steam Deck OLED und AYN Thor sind damit vorerst vom Tisch."],"erkenntnisse":["**Die Custom Firmware bleibt auf dem 2DS XL.** Boot9strap sitzt im NAND und überlebt sowohl das Entfernen der SD-Karte als auch eine Formatierung. Da Luma3DS zusätzlich im CTRNAND liegt, startet die Konsole auch ohne SD-Karte ganz normal. Ein Entfernen wäre laut 3ds.hacks.guide mit Brick-Risiko verbunden und damit riskanter als der Verbleib.","**Kleinanzeigen hält Anzeigen mit Begriffen wie Custom Firmware, Homebrew oder gemoddet automatisch zur Prüfung an.** Kein Verbot, vergleichbare Anzeigen laufen dort. Die 2DS-Anzeige wurde nach kurzer Verzögerung freigegeben. **eBay** dagegen löscht CFW-Anzeigen auf Betreiben der Spieleindustrie, deshalb war Kleinanzeigen die richtige Plattform.","**Steam Deck OLED ist gerade massiv überteuert.** Valve hat die Preise im Mai 2026 wegen der Speicherkrise um bis zu 37 % erhöht: 512 GB jetzt 779 € statt 569 €, 1 TB 919 € statt 679 €. Gebraucht liegen die OLEDs auf Kleinanzeigen bei 600 bis 730 €. Ein Steam Deck 2 kommt laut Valve nicht so bald, der einzige Grund zu warten ist also der Preisaufschlag. Später erneut prüfen, auch Valves Certified-Refurbished-Shop.","**Die drei Geräte decken unterschiedliche Bedürfnisse ab, keins ersetzt ein anderes.** Nintendo-Exklusivtitel gibt es nur auf der Switch 2. Xbox-Streaming aufs Sofa gibt es nur auf Steam Deck (per Greenlight) oder AYN Thor (offizielle Xbox-App unter Android), auf der Switch 2 gar nicht. Steam Deck und Thor wären untereinander redundant.","**Nintendo Switch Online umfasst aktuell 385 Klassiker.** Basis-Abo: NES (94), SNES (86), Game Boy/Color (48). Erweiterungspaket zusätzlich: N64 (45), Mega Drive (51), GBA (33), Virtual Boy (17), GameCube (11, nur Switch 2). Erweiterungspaket 39,99 €/Jahr einzeln, 69,99 €/Jahr als Familienmitgliedschaft für bis zu acht Accounts. Für die Kinder reicht das Basis-Abo, dort sind NES, SNES und Game Boy vollständig drin.","**Nintendos Klassiker sind nur mietbar, nicht kaufbar.** Die Virtual Console gibt es auf der Switch nicht mehr, der Wii-U- und 3DS-eShop ist seit März 2023 dicht. Andere Retro-Sammlungen (Arcade Archives, Capcom Arcade Stadium, Atari 50, Sega Genesis Classics, Konami-Collections) sind dagegen dauerhaft kaufbar, viele davon auch auf Steam.","**Der eShop ist praktisch nie die günstigste Option.** Nintendo senkt dort kaum Preise, der Handel unterbietet die UVP dauerhaft. Switch-1-Klassiker stehen im eShop teils bei 59,99 €, dieselben Titel als gebrauchtes Modul bei 30 bis 45 €. Bei Switch-2-Modulen auf **Game-Key Cards** achten, da steckt das Spiel nicht auf der Karte."],"offen":["2DS XL von 289 € auf **255 € VB gesenkt** (Untergrenze 240 €). Die Senkung benachrichtigt die drei Favoriten automatisch. Bei weiterhin ausbleibenden Anfragen nächste Stufe 199 €, aber erst ein bis zwei Wochen abwarten. Markt: Asking-Preise mit OVP grob 160 bis 280 €, verkauft eher am unteren Ende; die Custom Firmware schreckt einen Teil der Käufer ab.","Standort für die Abholung in beide Anzeigen eintragen.","Möglichen Fleck am 2DS-Deckel unten rechts prüfen und bei Bedarf fotografieren.","Genauen Titel auf dem Sims-Modul abgleichen (deutsch „Einfach Tierisch\" oder englisch „Pets\").","**Switch 2 kaufen, sobald beide Geräte verkauft sind.** UVP 469,99 €, im Handel zeitweise unter 400 € (MediaMarkt-Aktion, Amazon zieht nach). Preisalarm bei Geizhals oder idealo setzen. Mario-Kart-World-Bundle bei 509,99 € UVP im Blick behalten, lohnt sich falls Mario Kart ohnehin gewünscht.","Switch-1-Klassiker gebraucht als Modul kaufen, nicht digital im eShop.","Steam Deck OLED in drei bis sechs Monaten erneut prüfen, wenn die Speicherpreise nachgeben."]}},{"d":"2026-07-20","teile":{"geschafft":["**Daily-Notes-Kachel im Lebens-Dashboard gebaut:** offene Punkte der letzten Wochen gesammelt und zusammengefasst, letzte Einträge mit Klick nach Obsidian, Geschafft-Abgleich räumt Erledigtes künftig automatisch weg.","**Aufräum-Aktion:** die gesammelten 53 offenen Punkte gemeinsam durchgesehen, 14 als erledigt/hinfällig abgehakt (siehe unten – Formulierungen bewusst wiederholt, damit der Dashboard-Abgleich greift).","Erledigt abgehakt: Ggf. weitere Arbeitsblätter der Serie (z. B. lineare Funktionen, Stochastik) nach gleichem Muster","Erledigt abgehakt: DBZ-/WM-Variante im Unterricht testen – kommt der Themen-Ansatz bei der Klasse an?","Hinfällig: Lese-Heatmap wäre erst möglich, wenn wir den Lesefortschritt regelmäßig mitschreiben (ab jetzt sammelbar).","Hinfällig: Optional weiterhin: Whispersync-Fortschritt für alle 288 Bücher einmalig durchlaufen lassen (~40 min).","Erledigt abgehakt: Morgen: Garagenboden Schicht 2 streichen.","Erledigt abgehakt: Kommunale Förderung / Stadtwerke vor Ort auf ein eigenes Wallbox-Programm prüfen (einzige verbliebene Förderchance).","Erledigt abgehakt: ENECTOR bestellen (inkl. Solar-Code) + Elektriker-Termin mit Fokus KSEM-Anbindung.","Erledigt abgehakt: Wasserraketen-Stunde morgen durchführen; danach ggf. echte Messwerte ins Merkheft-Protokoll übernehmen.","Erledigt abgehakt: DEMO-Dateien (3 Stück, „… DEMO.xlsx\") löschen, sobald genug angeschaut, danach „Dashboard aktualisieren\" doppelklicken.","Erledigt abgehakt: Echte Klassenlisten anlegen: Vorlage kopieren, Namen eintragen, speichern, Dashboard aktualisieren.","Keine Aufgabe (nur Notiz): Erinnerung dazu in Apple Reminders angelegt.","Keine Aufgabe (nur Notiz): Kurzaufgaben-Leitplanke nicht nötig (schon klar in `ANLEITUNG.md`).","Keine Aufgabe (nur Notiz): Ideen aus der Analyse, bewusst zurückgestellt: Satz-Code/Seed in der URL (Sätze reproduzierbar/teilbar), Bewertungs-/Notizbereich auf dem Lehrerblatt, Kurzaufgaben als Reserve an Sätze anhängen, Export/Import der „verwendet\"-Liste.","Überholt: Mi 24.06., 11:45: Schulrat-Gespräch. Fellbach-Arc vorher 2–3× laut durchsprechen, nicht ablesen. Danach: ChatGPT/Gemini zur Gegenkritik der Vorbereitung.","**Konsolen-Recherche (Verkauf & Kauf):** Marktpreise für den New Nintendo 2DS XL (schwarz/blau, Top-Zustand mit OVP, aktuell mit Custom Firmware) und die Nintendo Switch 2 recherchiert, Verkaufs- und Kaufplan festgelegt."],"erkenntnisse":["Beim Abhaken erledigter Punkte in Daily Notes die Formulierung des offenen Punkts wiederholen – dann erkennt der Lebens-Dashboard-Abgleich (Wortübereinstimmung ≥ 50 %) sie automatisch und räumt die Liste auf.","**2DS XL verkaufen:** Gebraucht mit OVP liegt der Markt bei 200–310 €. Plan: Custom Firmware entfernen, Konsole formatieren (inkl. Nintendo-Konto trennen), als Sammlerstück mit OVP für **289 € VB** inserieren, realistisch 250–270 €. Kopierte Spiele/ROMs dürfen keinesfalls mitverkauft oder im Inserat erwähnt werden (Urheberrecht).","**Switch 2 kaufen:** Neu ab ~424–430 € bei Galaxus/Amazon/Müller (UVP 469,99 €). Gebraucht privat 360–410 € – lohnt kaum gegenüber neu. Kleinanzeigen-Angebote um 280 € sind Betrug (neue Accounts, nur Versand, Vorkasse). Mario-Kart-World-Bundle ab ~490 € spart 10–20 € gegenüber Einzelkauf."],"offen":["2DS XL: CFW entfernen, formatieren, Fotos machen (alle Seiten, Displays an, OVP), Inserat auf Kleinanzeigen mit 289 € VB einstellen. Scharnier-/Display-Zustand und Ladekabel im Text erwähnen. Versand nur mit „Sicher bezahlen\".","Switch 2: Nach dem 2DS-Verkauf neu kaufen für ~429 € (Galaxus/Amazon/Müller; Müller ggf. Abholung in Filiale). Vorher prüfen ob Mario Kart World gewünscht → dann Bundle ab ~490 €."]}},{"d":"2026-07-19","teile":{"geschafft":["Neue Arbeitsblatt-Serie in [[04 Ressourcen/Mathematik/Arbeitsblätter]] aufgebaut (neuer Themenordner):","  **Grundlagen Klasse 6–9** (2 Seiten + separates Lösungsblatt): Wiederholung für Klasse 9 zum Schuljahresende – Brüche/Dezimalzahlen/Größen (Kl. 6), Prozent/Zinsen/rationale Zahlen (Kl. 7), Terme/Gleichungen/lineare Funktionen (Kl. 8), Potenzen/Wurzeln/Pythagoras (Kl. 9, nur dort TR erlaubt)","  **Terme und Gleichungen Klasse 9** („Fit für Klasse 10\", 2 Seiten + Lösungsblatt): 97 Teilaufgaben mit Steigerung Terme zusammenfassen → Klammern → binomische Formeln → Faktorisieren → lineare Gleichungen → quadratische Gleichungen (Mitternachtsformel + reinquadratisch, TR nur bei Teil F). Auf Wunsch beide Seiten randvoll gefüllt, u. a. mit neuen Aufgabentypen: Termwerte, Monom·Klammer, bF-Lückenaufgaben, Bruchterme kürzen, Textgleichungen, Diskriminanten-Check","  **Zwei Themen-Varianten** desselben Blatts mit identischer Nummerierung: Dragon-Ball-Z-Style (Power-Level, Kampfkraft, „Scouter erlaubt\") und WM-2026-Style (Turnierbaum Gruppenphase→Finale, „VAR erlaubt\") – ein Lösungsblatt gilt für alle drei Versionen"],"erkenntnisse":["Workflow etabliert: Arbeitsblätter als HTML mit Druck-CSS bauen, per Headless-Chrome zu PDF rendern, Seitenzahl automatisch prüfen. HTML-Quellen bleiben liegen → Aufgaben tauschen ohne Layoutarbeit","Alle Lösungen werden maschinell gegengeprüft (Python: Einsetzproben, Stichprobenpunkte für Termidentitäten, Mitternachtsformel unabhängig nachgerechnet) – bei ~130 geprüften Ergebnissen null Fehler","Themen-Varianten (DBZ, WM) mit identischer Aufgabennummerierung erlauben gemischtes Austeilen ohne Mehraufwand beim Korrigieren"],"offen":["Ggf. weitere Arbeitsblätter der Serie (z. B. lineare Funktionen, Stochastik) nach gleichem Muster","DBZ-/WM-Variante im Unterricht testen – kommt der Themen-Ansatz bei der Klasse an?"]}},{"d":"2026-07-18","teile":{"geschafft":["**Wissenskarte um zwei Ansichten erweitert:** Umschalter Karte / Globus / Ring. **Globus** = alle Notizen auf einer drehbaren 3D-Kugel mit Auto-Rotation; die Suche fliegt die Kugel zur Fundstelle. **Ring** = das komplette Claude-Setup auf einen Blick, ehrlich von der Platte eingesammelt: 20 Skills, 13 Memory-Einträge, 8 Anbindungen, 4 Automatiken, 10 Skripte, 8 Dashboards – Klick zeigt Details, Dashboards direkt öffenbar.","**LLM-Wiki gestartet** (Karpathy-Prinzip, letzter Baustein aus dem Video): [[04 Ressourcen/Wiki/Wiki.md|Wiki-Startseite]] mit Pflegeregeln (nur Belegtes, Quellen nennen, **Widersprüche mit ⚠️ markieren statt überschreiben**, kurz, Praxisbezug). Regeln auch in CLAUDE.md verankert – Trigger: „arbeite X ins Wiki ein\".","**Vier Wiki-Seiten aus eigenen Kindle-Highlights destilliert:** [[04 Ressourcen/Wiki/Lernen & Gedächtnis.md|Lernen & Gedächtnis]], [[04 Ressourcen/Wiki/Selbstbild & Gewohnheiten.md|Selbstbild & Gewohnheiten]], [[04 Ressourcen/Wiki/Energie & Klima.md|Energie & Klima]] (Schaustück mit 5 echten Quellen-Widersprüchen: Hegenberg vs. Lomborg, 1,5-Grad-Kritik, Ganteförs Senken-These …), [[04 Ressourcen/Wiki/Bewegung & Gehirn.md|Bewegung & Gehirn]].","**Netz-Effekt messbar:** Die vier Wiki-Seiten brachten 31 neue Wikilink-Verbindungen (122 → 153); eigener Wiki-Cluster in der Wissenskarte."],"erkenntnisse":["Viele Notizen in Bücher & Learnings sind reine Metadaten-Stubs – die inhaltliche Substanz liegt in Readwise/Books (Kindle-Highlights). Wiki-Seiten daher immer aus Readwise destillieren.","Von 637 Wikilinks im Vault zeigten nur 122 auf existierende Notizen – das Wiki füllt genau diese Lücke und macht die Wissenskarte dichter.","Die Klima-Bücher im Vault sind sich in der Physik einig und widersprechen sich in Ökonomie/Tempo/Werturteilen – gutes Unterrichtsmaterial, um Sach- von Werturteilen zu trennen."],"offen":["Wiki wachsen lassen: nächste Kandidaten z. B. Kommunikation & Verhandlung (Voss, Modler, Abrahams), Finanzen, Klassenführung (sobald Running the Room & Co. gelesen sind).","Beim nächsten ausgelesenen Buch: direkt ins Wiki einarbeiten (Trigger merken).","Weiterhin offen von gestern: Finder-Brücke, Lese-Heatmap-Datensammlung, optionaler Whispersync-Lauf für alle 288 Bücher, 4 Inbox-Notizen einsortieren."]}},{"d":"2026-07-17","teile":{"geschafft":["**Buch-Chat fertiggestellt:** Jede Buchzeile in der [[04 Ressourcen/Lese-Bibliothek.html|Lese-Bibliothek]] hat jetzt einen 💬-Button. Antworten kommen von Claude Code aus dem Vault (liest Readwise-Highlights und Buchnotizen, nur lesend). Start per Doppelklick auf „Buch-Chat starten.command\" in 04 Ressourcen. Kosten: grob 10–20 Cent pro Frage (Sonnet über API), Folgefragen behalten den Kontext.","**Lebens-Dashboard gebaut:** [[04 Ressourcen/Lebens-Dashboard.html|Lebens-Dashboard]] als neue Übersichts-Ebene über alles – Apple Kalender (heute & morgen), aktive Projekte (Klick öffnet Obsidian), zwei Aktivitäts-Heatmaps (Training aus intervals.icu, Vault aus Notizen + Git), Trainingsform (CTL/ATL/TSB + Wochenbalken), Schule (GDRS-iCloud-Fächer, Schuljahre, Links zu allen Unterrichts-Dashboards), Lesen (aus dem Lese-Dashboard) und Kostal-PV live. Dunkles Bento-Design mit Hell-Schalter.","**Automatik eingerichtet:** LaunchAgent aktualisiert die Dashboard-Daten jeden Morgen um 6:30 Uhr (Testlauf erfolgreich, Log in ~/Library/Logs/leben-dashboard.log). Manuell: „Lebens-Dashboard aktualisieren.command\".","**Wissenskarte gebaut (spätabends):** Inspiriert vom The-Node-AI-Video ([[04 Ressourcen/Wissenskarte.html|Wissenskarte]]) – alle ~350 Notizen als interaktive Cluster-Karte mit Wikilink-Verbindungen, Suche mit Kameraflug, Notiz-Vorschau direkt in der Karte und Obsidian-Links. Button im Lebens-Dashboard, läuft im 6:30-Refresh mit."],"erkenntnisse":["Kalenderzugriff für Skripte: EventKit ist für Kommandozeilen-Python TCC-gesperrt (kein Erlauben-Dialog) – AppleScript über die Kalender-App funktioniert, zeigt Serientermine aber nur eingeschränkt.","Design-Richtung für persönliche Dashboards: dunkles Bento-Grid mit Akzentfarben pro Lebensbereich und GitHub-Heatmaps gefällt Oskar besser als der bisherige cleane helle Karten-Stil.","Lese-Dashboard bleibt die Quelle der Wahrheit für den Lesestand; das Lebens-Dashboard liest ihn von dort."],"offen":["Lebens-Dashboard im Alltag testen; bei Bedarf: Finder-Brücke nachrüsten (iCloud-Schulordner per Klick öffnen), Wetter- oder Finanzen-Kachel ergänzen.","Lese-Heatmap wäre erst möglich, wenn wir den Lesefortschritt regelmäßig mitschreiben (ab jetzt sammelbar).","Optional weiterhin: Whispersync-Fortschritt für alle 288 Bücher einmalig durchlaufen lassen (~40 min).","01 Inbox enthält 4 unsortierte Notizen – bei Gelegenheit einsortieren."]}},{"d":"2026-07-16","teile":{"geschafft":["**Wallbox-Recherche für die Garage abgeschlossen** → Entscheidung für **Kostal ENECTOR AC 11 kW**. Gründe, Kosten, Angebote und Elektriker-Checkliste in [[Wallbox Kaufentscheidung]].","KSEM (Kostal Smart Energy Meter) über die Live-Daten der Anlage als verbaut bestätigt → ENECTOR läuft nativ mit der PV-Anlage.","Geklärt: keine staatliche Förderung mehr (KfW 442 & Charge@BW eingestellt); BMW iX1 lädt 11 kW Typ 2 → kein Adapter, kein 22-kW-Upgrade nötig.","**Garagenboden gestrichen – Schicht 1.**"],"erkenntnisse":["Für die bestehende Kostal-Anlage ist der ENECTOR die günstigste UND einfachste Lösung, weil er den schon verbauten KSEM mitnutzt (kein Zusatz-Meter wie beim Fronius).","ENECTOR-Nachteil: keine automatische Phasenumschaltung → Überschussladen erst ab ~4 kW; im Sommer bei 13 kWp irrelevant.","Solar-Freischaltung (~280 €) muss beim Kauf mitbedacht werden – sonst lädt die Box nicht solargeführt."],"offen":["**Morgen: Garagenboden Schicht 2 streichen.**","Kommunale Förderung / Stadtwerke vor Ort auf ein eigenes Wallbox-Programm prüfen (einzige verbliebene Förderchance).","ENECTOR bestellen (inkl. Solar-Code) + Elektriker-Termin mit Fokus KSEM-Anbindung."]}},{"d":"2026-07-15","teile":{"geschafft":["`grill-me`-Skill besprochen und angelegt: löchert mich gnadenlos zu einem Plan/Entscheidung, bis gemeinsames Verständnis steht. Bewusst die schlanke Version behalten.","Skill-Ablage aufgeräumt: Doppelungen zwischen global (`~/.claude/skills/`) und lokal (Vault `.claude/skills/`) entfernt. Faustregel etabliert – Skill kennt/braucht den Vault → lokal; allgemeines Denkwerkzeug → global.","API-Keys aus dem getrackten Git-Bereich ausgelagert: Firecrawl- und Tavily-Key liegen jetzt in der ignorierten `settings.local.json`; Datei aus Git-Tracking genommen, `.gitignore` ergänzt (Commit `beb0e3c`).","`grill-me` git-gesichert: eigene `.gitignore`-Ausnahme, damit der Skill nicht erneut verschwindet (Commit `21e3105`)."],"erkenntnisse":["`.claude/skills/` ist gitignored – lokale Skills sind NICHT im Backup, außer man macht eine gezielte Ausnahme.","`~/.claude/skills/` ist in diesem Setup kein verlässlicher Ablageort für eigene Skills: manuell abgelegte Ordner können verschwinden (grill-me + 8 andere waren weg), nur marktplatzverwaltete Skills wie `firecrawl-*` überleben. Plugin-Skills bleiben ohnehin über die Marktplätze verfügbar.","Lehre für Claude: nichts als „gesichert/zurückholbar\" bezeichnen, ohne den Ablageort tatsächlich zu prüfen (git ls-files, git check-ignore, ls). Als Feedback-Memory festgehalten.","Git-Repo des Vaults hat kein Remote → wird nicht gepusht, liegt rein lokal. Deshalb kein akutes Key-Rotationsrisiko."],"offen":["Optional: Firecrawl-/Tavily-Keys bei Gelegenheit neu generieren, falls das Vault doch mal online gesichert wird (aktuell nicht nötig).","`grill-me` mal im echten Einsatz testen (z. B. an einer anstehenden Entscheidung), prüfen ob er scharf genug nachbohrt."]}},{"d":"2026-07-13","teile":{"geschafft":["**EnBW-Stromverträge analysiert** – Rätsel „warum zwei Verträge / zwei Abschläge\" geklärt: zwei getrennte Zählpunkte (Marktlokationen) an derselben Adresse, korrekt getrennt, keine Doppelabrechnung.","**Zähler-Zuordnung eindeutig bestimmt** (Zählernummer + Beschriftung am Zählerschrank):","  **…7941 „Haushalt\"** = Vertrag 701055910928 „EnBW Planbar und Sicher\", Abschlag 44 €, aktuell **40,07 ct/kWh** + 18,30 € GP, kündbar bis 22.10.2026.","  **…7936 „MK Kaskade\" / §14a** = Vertrag 701055470353 „EnBW Grün und Sicher\", Abschlag 60 €, aktuell **38,57 ct/kWh** + 18,30 € GP, Laufzeit bis 10.08.2026, kündbar bis 13.07.2026 → **das ist die Wärmepumpe**.","Setup laut EnBW-Portal: „komplexe Anlage mit hintereinander geschalteten Zählern\" (PV + Wärmestrom, Kaskadenmessung).","**EnBW-Wärmepumpenstromtarif für PLZ 73635 durchgerechnet** (getrennter Zähler, §14a Modul 2 inkl.)."],"erkenntnisse":["**Kernbefund: Die Wärmepumpe läuft auf einem normalen Haushaltstarif zum Haushaltspreis – falsches Produkt.** Beim selben Versorger EnBW gibt es den passenden Wärmepumpenstromtarif deutlich günstiger: | Tarif (WP-Zähler …7936) | Grundpreis | Arbeitspreis | Preisgarantie | |---|---|---|---| | Aktuell: Grün und Sicher | 18,30 € | **38,57 ct** | – | | EnBW „Wechselangebot\" (Planbar u. Sicher) | 17,08 € | 34,77 ct | 24 Mon (netto) | | **EnBW Strom effektiv S** (Wärmepumpenstrom) | 5,71 € | **22,23 ct** | keine | | **EnBW Strom effektiv M** (Wärmepumpenstrom) | 6,71 € | **23,25 ct** | 18 Mon | | EnBW Strom effektiv L (Wärmepumpenstrom) | 6,71 € | 24,26 ct | bis 24 Mon | Alle WP-Tarife: 100 % Ökostrom, 292 € Bonus nach 1. Lieferjahr.","**Solider Stückpreis-Abstand: ~15 ct/kWh + ~146 €/Jahr Grundpreis** günstiger als aktuell. Grobe Euro-Ersparnis ~600–900 €/Jahr – **aber auf Platzhalter-Verbrauch 4.900 kWh (100 m²) gerechnet, echte Zahl braucht den WP-Jahresverbrauch.**","EnBWs im Portal angezeigtes „Wechselangebot\" senkt nur den Haushaltstarif marginal (34,77 ct) – der richtige WP-Tarif wird dort **nicht** angeboten.","Kein Zeitdruck trotz Stichtag 13.07.: Wechsel läuft innerhalb EnBW, Vertrag verlängert sich sonst und ist danach mit 4 Wochen Frist kündbar. „Netto-Preisgarantie\" garantiert nur EnBWs eigene Preisbestandteile, nicht Steuern/Netzentgelte.","Es gibt zusätzlich einen **EnBW Kombi-Tarif (Haushalt + Wärmestrom)** – Option, auch den Haushaltszähler mit zu optimieren."],"offen":["**Oskar: letzte Jahresabrechnungen prüfen** → echten Jahresverbrauch beider Zähler (v. a. WP …7936) besorgen.","Dann mit Claude **finalen Tarif auswählen** – Favorit bisher: **EnBW Strom effektiv M** (23,25 ct, 18 Mon. Garantie, kaum teurer als S ohne Garantie). Optional Gegen-Check WP-Spezialisten / dynamische Tarife (Octopus, Tibber).","WP-Zähler …7936 auf Wärmepumpenstrom umstellen (Anruf/Online bei EnBW).","Haushaltszähler …7941 (40,07 ct) als zweiten, uneiligen Schritt optimieren (kündbar bis 22.10.2026).","Erinnerung dazu in Apple Reminders angelegt."]}},{"d":"2026-07-09","teile":{"geschafft":["**Wasserraketen-Stunde (Physik) vorbereitet:** Merkheft im Rise-Stil als HTML gebaut – `04 Ressourcen/Physik/Kinematik/Wasserrakete (Merkheft).html`. 7 Lektionen mit Skizzen, Beispielrechnungen, Tabellen und selbst generierten v-t-/s-t-Diagrammen (SVG). Ablauf: Einstiegsfrage an der Tafel → Rückstoßprinzip → Aufbau/Sicherheit → Messprotokoll (vor dem Rausgehen austeilen) → draußen messen (AltimeterTwo-Sensor) → drinnen rechnen (a = Δv/Δt, s = ½gt²) → Rückbezug zur Anfangsschätzung.","**PHYWE-Sets geprüft:** Wichtiger Fund – der eigentliche Sensor (AltimeterTwo, Art. 02679-04) ist separat vom Raketenkörper (02679-03); Oskar hat ihn bestätigt vorhanden. Sensor zeigt nach dem Flug feste Werte (Höhe, v_max, Brenndauer, a_max/a_avg, Sinkrate, Flugdauer) – kein Live-Logger.","**Unterrichtsmaterial nach Fach neu strukturiert:** Alles unter `04 Ressourcen/<Fach>/<Thema>/` einsortiert – Physik (Kinematik, Klassenarbeiten, Prüfungsaufgaben), Mathematik (Quadratische Funktionen, Prüfungsaufgaben), Sport. Große bestehende Ordner (Mathe-Prüfungsaufgaben mit Generator + Archiv, Physik-MC-Generator, „Naturwissenschaften\" → Physik/Klassenarbeiten) mitgezogen. Alle Pfadverweise (Generator-Skripte, launch.json, Skill, Projekt-Notiz, Daily Notes) nachgezogen und getestet – Generator & Prüfungsarchiv laufen einwandfrei.","**Dashboard gebaut:** `04 Ressourcen/Dashboard.html` – Direktzugriff auf alle 19 HTML-Tools, gruppiert nach Fach und Thema."],"erkenntnisse":["**Safari file://-Regel:** Ein lokal geöffnetes `file://`-Dokument darf nur auf Dateien im eigenen Ordner oder darunter zugreifen – nicht per `../` in einen anderen Zweig. Deshalb muss das Dashboard in `04 Ressourcen/` liegen (alle Fächer darunter), damit die Klick-Links auch in Safari funktionieren. Chrome ist da lockerer. Zusätzlich `target=\"_blank\"` bei lokalen Links vermeiden (Safari öffnet neue Tabs für file:// oft gar nicht).","**Neue Ablage-Konvention** in CLAUDE.md festgehalten: Unterrichtsmaterial gehört nach `04 Ressourcen/<Fach>/<Thema>/`, nicht mehr lose in „Schule & Unterricht\"."],"offen":["Wasserraketen-Stunde morgen durchführen; danach ggf. echte Messwerte ins Merkheft-Protokoll übernehmen.","Sport-Ordner hat noch keine HTML-Tools (nur Curriculum + Sprengeltabelle als Markdown).","Parallel bestehen noch `03 Bereiche/Sport & Triathlon/` und `03 Bereiche/Triathlon/` – bei Gelegenheit aufräumen (unabhängig von der Schul-Reorg)."]}},{"d":"2026-07-07","teile":{"geschafft":["**PDF-Fähigkeiten geklärt:** Fill, Sign, Merge, Split, Extract laufen über die `pdf`-Skill – Merge/Split/Extract/Fill zuverlässig, „Sign
