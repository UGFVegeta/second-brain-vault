<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Whiteboard-Blatt – karierte Seite</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e5dc}
  .blatt{width:210mm; height:297mm; background:#fff; margin:8mm auto;
         box-shadow:0 3mm 14mm rgba(0,0,0,.15)}
  svg{display:block}
  @media print{
    @page{size:A4 portrait; margin:0}
    body{background:#fff}
    .blatt{margin:0; box-shadow:none}
  }
</style>
</head>
<body>
<div class="blatt">
<svg width="210mm" height="297mm" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="karo" x="10" y="15.5" width="19" height="19" patternUnits="userSpaceOnUse">
      <path d="M 19 0 L 0 0 L 0 19" fill="none" stroke="#22272e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="10" y="15.5" width="190" height="266" fill="url(#karo)"/>
  <rect x="10" y="15.5" width="190" height="266" fill="none" stroke="#22272e" stroke-width="0.5"/>
  <line x1="105" y1="15.5" x2="105" y2="281.5" stroke="#22272e" stroke-width="0.75"/>
  <line x1="10" y1="148.5" x2="200" y2="148.5" stroke="#22272e" stroke-width="0.75"/>
</svg>
</div>
</body>
</html>
