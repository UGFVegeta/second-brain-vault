<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernen lernen – Präsentation Klasse 7</title>
<style>
  :root{
    --ink:#1c2230; --bg:#fdf8ef; --paper:#fffdf6;
    --accent:#2f6f4f; --accent2:#c2531e; --muted:#6b7280; --line:#d9d3c7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #stage{
    position:relative;
    width:min(96vw, calc(96vh * 16/9));
    height:min(96vh, calc(96vw * 9/16));
    background:var(--bg);
    border-radius:14px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .slide{
    position:absolute; inset:0; padding:6.2% 7.5%;
    display:none; flex-direction:column; justify-content:center;
  }
  .slide.active{display:flex}
  .kicker{font-size:1.15vw; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:1.4em}
  h1{font-size:4.4vw; line-height:1.05; letter-spacing:-.02em}
  h2{font-size:3.1vw; line-height:1.12; letter-spacing:-.01em; margin-bottom:.7em}
  p{font-size:1.9vw; line-height:1.5; max-width:42em; color:#333}
  p + p{margin-top:.7em}
  .big{font-size:2.4vw}
  ul{margin:.6em 0 0 1.1em; font-size:1.9vw; line-height:1.6}
  li{margin:.35em 0}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; letter-spacing:.22em; font-weight:700}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:1em 1.2em}
  .divider{background:var(--accent); color:#fff}
  .divider .kicker{color:#bfe6d1}
  .divider h1{font-size:4vw}
  .quote{font-size:2.1vw; line-height:1.5; font-style:italic; border-left:3px solid var(--line); padding-left:.8em; max-width:40em}
  .note{margin-top:1.1em; font-size:1.35vw; color:var(--muted)}
  .row{display:flex; gap:4%; align-items:center}
  .col{flex:1}
  /* bar chart */
  .bars{display:flex; gap:4vw; align-items:flex-end; height:32vh; margin:1.4em 0 5em}
  .bar{width:10vw; background:var(--line); border-radius:8px 8px 0 0; position:relative; display:flex; justify-content:center}
  .bar span{position:absolute; top:-2.6em; font-size:1.5vw; font-weight:700; white-space:nowrap}
  .bar small{position:absolute; bottom:-3.6em; font-size:1.3vw; color:var(--muted); text-align:center; width:14vw; left:50%; transform:translateX(-50%)}
  .bar.read{height:42%}
  .bar.test{height:80%; background:var(--accent)}
  /* desk -> shelf */
  .flow{display:flex; align-items:center; gap:2.5vw; margin-top:1em; font-size:1.7vw}
  .flow .box{background:var(--paper); border:2px solid var(--ink); border-radius:10px; padding:1.1em 1.3em; text-align:center; flex:1}
  .flow .arrow{font-size:3vw; color:var(--accent)}
  /* curve */
  svg.curve{width:34vw; height:auto}
  /* progress */
  #dots{position:absolute; bottom:2.4%; left:26%; right:26%; display:flex; gap:.5vw; justify-content:center}
  #dots i{width:.7vw; height:.7vw; border-radius:50%; background:var(--line); transition:background .2s}
  #dots i.on{background:var(--accent)}
  #counter{position:absolute; bottom:2%; right:3%; font-size:1.1vw; color:var(--muted)}
  #hint{position:absolute; bottom:2%; left:3%; font-size:.95vw; color:var(--muted)}
  /* Schrittweises Aufdecken: Platz bleibt reserviert, damit nichts springt */
  [data-step]{opacity:1; transition:opacity .28s}
  [data-step].shown{opacity:1}
  @media (max-width:700px){
    h1{font-size:7vw} h2{font-size:5.5vw} p,ul{font-size:3.6vw} .kicker{font-size:2.6vw}
  }
</style>
</head>
<body>
<div id="stage"><section class="slide active">
    <div class="row">
      <div class="col">
        <h2>Dein Gehirn wächst<br>wie ein Muskel</h2>
        <p>Jedes Mal, wenn du etwas Schwieriges übst, baut dein Gehirn neue Verbindungen auf. Das kostet Kraft und fühlt sich anstrengend an. Genau dann passiert das Wachstum.</p>
      </div>
      <div class="col" style="text-align:center">
        <img src="bild-gehirn.jpg" alt="" style="width:88%; max-height:52vh; object-fit:contain">
      </div>
    </div>
  </section>
<div id="dots"></div>
  <div id="counter"></div>
  <div id="hint">→ aufdecken · ← zurück · F Vollbild</div>
</div>


</body>
</html>
