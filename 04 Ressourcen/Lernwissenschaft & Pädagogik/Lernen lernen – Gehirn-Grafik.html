<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gehirn wächst wie ein Muskel – Grafik</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e5dc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1c2230}
  .sheet{width:210mm; height:297mm; background:#fffdf9; margin:8mm auto; padding:18mm; display:flex; align-items:center; justify-content:center; box-shadow:0 3mm 14mm rgba(0,0,0,.15)}
  .cut{border:1mm dashed #c9c2b4; border-radius:8mm; padding:14mm 10mm; width:100%; display:flex; flex-direction:column; align-items:center; gap:8mm; text-align:center}
  .cut h1{font-size:16mm; line-height:1.1; letter-spacing:-.01em}
  .cut p{font-size:8mm; color:#6b7280; max-width:150mm; line-height:1.4}
  svg{width:135mm; height:auto}
  .scissors{position:absolute; font-size:7mm; color:#9a9484}
  @media print{
    @page{size:A4; margin:0}
    body{background:#fff}
    .sheet{margin:0; box-shadow:none}
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="cut">
      <h1>Dein Gehirn wächst<br>wie ein Muskel</h1>
      <svg viewBox="0 0 420 400" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#1c2230" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grosshirn mit ausgepraegtem Temporallappen -->
    <path d="M74 168 C68 112, 108 62, 164 56 C224 49, 278 68, 310 106
             C338 140, 338 186, 312 212 C298 226, 276 236, 250 236
             L214 236 C206 256, 188 268, 164 270
             C132 272, 102 256, 88 232 C80 216, 76 190, 74 168 Z"
          fill="#fffdf9" stroke-width="5"/>
    <!-- Sylvische Furche -->
    <path d="M92 206 C134 222, 182 224, 212 206" stroke-width="4"/>
    <!-- Zentralfurche -->
    <path d="M196 64 C204 94, 212 126, 226 152" stroke-width="4"/>
    <!-- Windungen Grosshirn -->
    <g stroke-width="3.4">
      <path d="M104 122 C132 102, 166 98, 190 110"/>
      <path d="M120 92 C146 78, 178 76, 200 86"/>
      <path d="M216 78 C242 86, 264 102, 274 124"/>
      <path d="M244 134 C266 146, 278 164, 274 184"/>
      <path d="M148 144 C174 134, 198 136, 214 150"/>
      <path d="M110 162 C136 154, 158 158, 172 172"/>
      <path d="M232 106 C250 116, 262 130, 266 144"/>
      <path d="M236 174 C252 184, 262 196, 262 208"/>
    </g>
    <!-- Windungen Temporallappen -->
    <g stroke-width="3">
      <path d="M104 232 C128 244, 158 248, 184 240"/>
      <path d="M112 248 C134 258, 158 262, 178 258"/>
    </g>
    <!-- Kleinhirn -->
    <path d="M252 232 C282 226, 306 236, 312 256 C317 276, 301 292, 277 294
             C253 296, 236 283, 234 263 C233 247, 241 235, 252 232 Z"
          fill="#fffdf9" stroke-width="5"/>
    <g stroke-width="2.6">
      <path d="M242 248 C264 242, 290 244, 308 252"/>
      <path d="M238 262 C262 256, 290 258, 312 266"/>
      <path d="M243 276 C264 270, 287 272, 304 280"/>
    </g>
    <!-- Hirnstamm, kurz -->
    <path d="M212 240 C208 258, 210 276, 218 292" stroke-width="5"/>
    <path d="M230 244 C228 260, 230 276, 236 290" stroke-width="5"/>
    <path d="M218 292 C224 298, 230 298, 236 290" stroke-width="5"/>
  </g>
  <!-- Wachstums-Zeichen -->
  <g stroke="#2f6f4f" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M338 72 v-20 M328 62 h20"/>
    <path d="M366 40 v-14 M359 33 h14"/>
    <path d="M306 44 v-12 M300 38 h12"/>
  </g>
  <!-- Hantel, klar abgesetzt -->
  <g fill="#1c2230">
    <rect x="128" y="346" width="164" height="13" rx="6"/>
    <rect x="106" y="329" width="21" height="47" rx="6"/>
    <rect x="85" y="338" width="17" height="29" rx="5"/>
    <rect x="293" y="329" width="21" height="47" rx="6"/>
    <rect x="318" y="338" width="17" height="29" rx="5"/>
  </g>
      </svg>
      <p>Jede Wiederholung baut neue Verbindungen auf. Anstrengung ist das Zeichen, dass es gerade passiert.</p>
    </div>
  </div>
</body>
</html>
