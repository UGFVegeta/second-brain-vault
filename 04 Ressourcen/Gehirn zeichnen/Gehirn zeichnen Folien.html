<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Gehirn zeichnen Folien</title>
<style>
/* Folienlook wie "Lernen lernen": cremefarbene 16:9-Bühne auf dunklem Grund, grüner Kicker, orange Akzent. */
:root{
  --ink:#1c2230; --bg:#fcf8ef; --paper:#fcf8ef; --accent:#c2531e; --green:#2f6f4f; --muted:#6b7280;
  --line:#1c2230; --hair:#d9d3c7; --brain:#efe7d6; --brain-2:#e0d6c0;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(96vw,calc(96vh * 16/9));height:min(96vh,calc(96vw * 9/16));background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);outline:none}
.slide{position:absolute;inset:0;padding:4.6% 5.5% 5.5%;display:none;flex-direction:column;justify-content:flex-start}
.slide.active{display:flex}
.slide.center{justify-content:center;padding:6.2% 7.5%}
.kicker{font-size:1.1vw;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:.7em}
h1{font-size:4.4vw;line-height:1.05;letter-spacing:-.02em}
h2{font-size:2.9vw;line-height:1.1;letter-spacing:-.01em;margin-bottom:.4em}
p{font-size:1.9vw;line-height:1.5;max-width:42em;color:#333}
.note{margin-top:1.1em;font-size:1.35vw;color:var(--muted)}
.big{font-size:2.4vw}
.body{flex:1;display:flex;gap:3%;align-items:center;min-height:0}
.fig{flex:0 0 66%;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.side{flex:1;min-width:0;align-self:center}
.side .cap{font-size:1vw;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.8em}
.side ol{margin:0 0 0 1.2em;font-size:1.2vw;line-height:1.38}
.side li{margin:.4em 0}
.side li::marker{color:var(--accent);font-weight:700}
.side .memo{margin-top:.7em;font-size:1.05vw;line-height:1.35;padding:.5em .8em;border-left:3px solid var(--accent);background:#f4ecdb;border-radius:0 8px 8px 0}
.side .noteb{margin-top:.7em;font-size:1vw;line-height:1.4;color:var(--muted)}
#dots{position:absolute;bottom:1.9%;left:20%;right:20%;display:flex;gap:.25vw;justify-content:center}
#dots i{width:1.2vw;height:1.2vw;border:.25vw solid transparent;background-clip:padding-box;border-radius:50%;background-color:var(--hair);transition:background-color .2s;cursor:pointer}
#dots i.on{background-color:var(--green)}
#counter{position:absolute;bottom:2%;right:3%;font-size:1.1vw;color:var(--muted);display:flex;gap:.6vw;align-items:center}
#counter button{border:1px solid var(--hair);background:var(--bg);border-radius:50%;width:2.4vw;height:2.4vw;font-size:1.2vw;cursor:pointer;color:var(--ink)}
#quizBtn{position:absolute;bottom:1.6%;left:3%;border:1px solid var(--hair);background:var(--bg);border-radius:999px;padding:.35vw 1vw;font-size:1.05vw;cursor:pointer;color:var(--ink)}
#quizBtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[data-step]{opacity:0;transition:opacity .28s}
[data-step].shown{opacity:1}
.fig .lab .nm{font-size:25px}
.fig .lab .lt{font-size:16px}
/* Zeichnung */
.s{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.s.on{opacity:1;visibility:visible;transition:opacity .45s}
.base{fill:var(--brain)}
.base2{fill:var(--brain-2);transition:fill .6s}
.col .base2.cb{fill:rgba(140,100,205,.42)}
.col .base2.stem{fill:rgba(120,135,150,.5)}
.ink{fill:none;stroke:var(--line);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s}
.ink.thin{stroke-width:2.6}
.ink.gy{stroke-width:4;opacity:.8}
.s.cur .ink.gy{stroke:var(--line)}
.ink.thick{stroke-width:6}
.ink.dash{stroke-dasharray:9 7;stroke-width:2.3}
.s.cur .ink{stroke:var(--accent)}
.s.cur.anim .ink:not(.dash){stroke-dasharray:1 2;stroke-dashoffset:1;animation:draw 1.9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fl{fill:rgba(var(--c),var(--a,.6));stroke:none}
.band{fill:none;stroke:rgba(var(--c),var(--a,.6));stroke-width:30;stroke-linecap:round}
.lobe{--a:.42}.area{--a:.82}
.c-front{--c:82,140,222}.c-par{--c:238,190,40}.c-temp{--c:60,170,120}.c-occ{--c:232,98,86}
.c-mot{--c:240,138,36}.c-sen{--c:20,160,185}.c-bro{--c:195,60,155}.c-wer{--c:120,80,215}
.c-aud{--c:125,185,40}.c-v1{--c:224,69,58}.c-pfc{--c:31,95,168}
.c-cc{--c:70,130,230}.c-thal{--c:224,117,45}.c-hyp{--c:209,75,124}.c-pit{--c:201,54,43;--a:.8}
.c-pin{--c:123,76,198;--a:.85}.c-tec{--c:242,179,61;--a:.8}.c-mid{--c:232,163,61;--a:.5}
.c-pons{--c:61,178,166;--a:.5}.c-medu{--c:77,143,224;--a:.5}.c-sc{--c:142,154,166;--a:.5}
.c-v4{--c:85,183,232;--a:.85}.c-cing{--c:61,178,166;--a:.45}.c-v1m{--c:224,69,58;--a:.45}
.band.cing,.band.v1m{stroke-width:24}.band.v1m{stroke-width:26}
.guide{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;opacity:.85}
.gtxt{font:400 15px var(--f-body);fill:var(--muted)}

/* Beschriftung */
.lab{cursor:pointer;outline:none}
.lab .ln{stroke:var(--muted);stroke-width:1.4}
.lab .dot{fill:var(--accent);stroke:var(--paper);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:transform .2s}
.lab .hit{fill:transparent}
.lab .nm{font:600 21px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round;transition:opacity .25s}
.lab .lt{font:italic 400 15px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;transition:opacity .25s}
.quiz .lab:not(.rev) .nm,.quiz .lab:not(.rev) .lt{opacity:0}
.quiz .lab:not(.rev) .dot{transform:scale(1.9)}
.none .lab{display:none}
.lab.hl .dot{animation:pulse .7s ease-in-out 3}
@keyframes pulse{50%{transform:scale(2.6)}}


@media (prefers-reduced-motion:reduce){.s.cur.anim .ink:not(.dash){animation:none;stroke-dasharray:none;stroke-dashoffset:0}.lab.hl .dot{animation:none}.s,.s.on,.base2{transition:none}}
</style>

function labelSvg(L){
  var an=L.side==='r'?'start':L.side==='l'?'end':'middle';
  var ex=L.side==='r'?L.tx-8:L.side==='l'?L.tx+8:L.tx;
  var ey=L.side==='t'?L.ty+26:L.side==='b'?L.ty-24:L.ty-6;
  return '<g class="s lab" tabindex="0" role="button" data-s="'+L.s+'" data-until="'+(L.u||99)+'" data-id="'+L.id+'" aria-label="'+L.n+'">'+
   '<line class="ln" x1="'+L.ax+'" y1="'+L.ay+'" x2="'+ex+'" y2="'+ey+'"/>'+
   '<circle class="dot" cx="'+L.ax+'" cy="'+L.ay+'" r="5.5"/><circle class="hit" cx="'+L.ax+'" cy="'+L.ay+'" r="20"/>'+
   '<text class="nm" x="'+L.tx+'" y="'+L.ty+'" text-anchor="'+an+'">'+L.n+'</text>'+
   '<text class="lt" x="'+L.tx+'" y="'+(L.ty+19)+'" text-anchor="'+an+'">'+L.l+'</text></g>';
}
function build(svg,els,labs,defs){
  var h='<defs>'+defs+'</defs>';
  els.forEach(function(e){h+='<g class="s" data-s="'+e.s+'" data-until="'+(e.u||99)+'">'+e.h+'</g>';});
  labs.forEach(function(L){h+=labelSvg(L);});
  svg.innerHTML=h;
}

var stage=$('#stage'), rev={};
function defsFor(v,n){
  return v==='lat'?'<clipPath id="s'+n+'clipL"><path d="'+LOUT+'"/></clipPath><clipPath id="s'+n+'clipCb"><path d="'+CBL+'"/></clipPath>'
    :'<clipPath id="s'+n+'clipM"><path d="'+MOUT+'"/></clipPath><clipPath id="s'+n+'clipS"><path d="'+STEMM+'"/></clipPath>';
}
function makeSvg(n){
  var v=steps[n-1].v, els=v==='lat'?lat:med, labs=labels[v];
  var h='<svg viewBox="-200 -30 1230 630" class="'+(v==='lat'&&n>=3?'col':'')+'" role="img" aria-label="'+steps[n-1].t+'"><defs>'+defsFor(v,n)+'</defs>';
  els.forEach(function(e){
    if(!(e.s<=n&&n<=(e.u||99)))return;
    h+='<g class="s on'+(e.s===n?' cur':'')+'">'+e.h.replace(/url\(#clip/g,'url(#s'+n+'clip')+'</g>';
  });
  labs.forEach(function(L){
    if(!(L.s<=n&&n<=(L.u||99)))return;
    h+=labelSvg(L).replace('class="s lab"','class="s lab on"');
  });
  return h+'</svg>';
}

var slides=[].slice.call(stage.querySelectorAll('.slide')), idx=0, shown=0;
var dots=$('#dots');
slides.forEach(function(_,k){var d=document.createElement('i');d.addEventListener('click',function(e){e.stopPropagation();show(k,false)});dots.appendChild(d);});
function items(i){return [].slice.call(slides[i].querySelectorAll('[data-step]'));}
function show(i,all){
  idx=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach(function(s,k){s.classList.toggle('active',k===idx)});
  var it=items(idx);it.forEach(function(x){x.classList.toggle('shown',!!all)});shown=all?it.length:0;
  [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===idx)});
  $('#cnt').textContent=(idx+1)+' / '+slides.length;
  slides[idx].querySelectorAll('.s.cur').forEach(function(g){g.classList.remove('anim');void g.getBoundingClientRect();g.classList.add('anim');});
  syncRev();
  try{history.replaceState(null,'','#'+(idx+1));}catch(e){}
}
function next(){var it=items(idx);if(shown<it.length){it[shown].classList.add('shown');shown++;}else if(idx<slides.length-1)show(idx+1,false);}
function prev(){var it=items(idx);if(shown>0){shown--;it[shown].classList.remove('shown');}else if(idx>0)show(idx-1,true);}
$('#bn').addEventListener('click',function(e){e.stopPropagation();next()});
$('#bp').addEventListener('click',function(e){e.stopPropagation();prev()});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')show(0,false); else if(e.key==='End')show(slides.length-1,true);
  else if(e.key==='a'||e.key==='A')toggleQuiz();
});
stage.addEventListener('click',function(e){
  if(e.target.closest('.lab,button,#dots'))return;
  var r=stage.getBoundingClientRect();
  if(e.clientX-r.left<r.width*.3)prev();else next();
});

/* Abfragen */
function syncRev(){stage.querySelectorAll('.lab').forEach(function(el){el.classList.toggle('rev',!!rev[el.dataset.id]);});}
function toggleQuiz(){
  var on=!stage.classList.contains('quiz');
  stage.classList.toggle('quiz',on);$('#quizBtn').setAttribute('aria-pressed',on?'true':'false');
  if(on)rev={};syncRev();
}
$('#quizBtn').addEventListener('click',function(e){e.stopPropagation();toggleQuiz();});
stage.addEventListener('click',function(e){
  var g=e.target.closest('.lab');if(!g)return;
  if(stage.classList.contains('quiz')){rev[g.dataset.id]=!rev[g.dataset.id];syncRev();}
  g.classList.remove('hl');void g.getBoundingClientRect();g.classList.add('hl');
});

var start=parseInt((location.hash||'').slice(1),10);
show(start>=1&&start<=slides.length?start-1:0,false);
stage.focus();
})();
