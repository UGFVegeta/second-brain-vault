<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfungsarchiv Realschule BW · Mathematik 2011–2026</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #dfe3e8;
    --text: #1d2733;
    --muted: #6b7683;
    --accent: #1a5fb4;
    --accent-soft: #e7eefb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 8px; font-size: 17px; }
  header h1 small { color: var(--muted); font-weight: normal; font-size: 12px; margin-left: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  .fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fgroup > span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  select {
    font-size: 13px; padding: 3px 6px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--text);
  }
  .chip {
    font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff; cursor: pointer; user-select: none;
    color: var(--text);
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .65; font-size: 11px; }
  main { flex: 1; display: flex; min-height: 0; }
  #liste {
    width: 330px; min-width: 260px; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  #count { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .item { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--accent-soft); }
  .item.sel { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 9px; }
  .item .kopf { font-size: 13px; font-weight: 600; }
  .item .kopf .teil { color: var(--muted); font-weight: normal; font-size: 12px; }
  .item .themen { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .item .snip { margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.35;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .kopf { display: flex; align-items: baseline; }
  .item .kopf .titeltext { flex: 1; }
  .pick {
    width: 15px; height: 15px; margin-left: 8px; flex-shrink: 0; cursor: pointer;
    accent-color: var(--accent); align-self: center;
  }
  #werkzeug {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px;
  }
  #werkzeug .zahl { color: var(--muted); }
  #werkzeug button {
    font-size: 12px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; cursor: pointer; color: var(--text);
  }
  #werkzeug button:hover { border-color: var(--accent); }
  #werkzeug button.primaer { background: var(--accent); color: #fff; border-color: var(--accent); }
  #werkzeug button:disabled { opacity: .45; cursor: default; }
  #viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #vkopf {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #vtitel { font-size: 14px; font-weight: 600; margin-right: auto; }
  .tab {
    font-size: 13px; padding: 5px 16px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; border-radius: 6px; color: var(--text);
  }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn {
    font-size: 13px; padding: 5px 10px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; border-radius: 6px; color: var(--text);
  }
  .nav-btn:hover, .tab:hover { border-color: var(--accent); }
  iframe { flex: 1; border: 0; background: #fff; width: 100%; }
  #leer {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #liste { width: 100%; max-height: 40%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Prüfungsarchiv Realschule BW – Mathematik
    <small>2011–2024: walterbauer.net (lokal gespiegelt) · 2026: Original-PDF mit Schul-Lösung – nur für den Dienstgebrauch</small>
  </h1>
  <div class="filters">
    <div class="fgroup">
      <span>Jahr</span>
      <select id="fJahr"><option value="">Alle</option></select>
    </div>
    <div class="fgroup" id="fTeil"><span>Teil</span></div>
    <div class="fgroup" id="fThema"><span>Thema</span></div>
    <div class="fgroup" id="fSatz"><span>Eigene Übungssätze</span></div>
  </div>
  <div id="werkzeug">
    <span>🖨</span>
    <span class="zahl" id="wAnzahl">0 Aufgaben ausgewählt</span>
    <button class="primaer" id="wDruck">Arbeitsblatt drucken</button>
    <button id="wDruckL">Mit Lösungen drucken</button>
    <button id="wLeeren">Auswahl leeren</button>
    <span style="border-left:1px solid var(--line); align-self:stretch"></span>
    <button id="wGesamt" title="Öffnet den gewählten Jahrgang oder Übungssatz als ein Dokument (Aufgaben + Lösungsteil)">Komplettdokument</button>
  </div>
</header>
<main>
  <div id="liste">
    <div id="count"></div>
    <div id="items"></div>
  </div>
  <div id="viewer">
    <div id="vkopf" style="display:none">
      <span id="vtitel"></span>
      <button class="tab" id="tabA">Aufgabe</button>
      <button class="tab" id="tabL">Lösung</button>
      <button class="nav-btn" id="prev" title="Vorherige Aufgabe (←)">‹</button>
      <button class="nav-btn" id="next" title="Nächste Aufgabe (→)">›</button>
      <a class="nav-btn" id="neu" target="_blank" title="In neuem Tab öffnen" style="text-decoration:none">⧉</a>
    </div>
    <div id="leer">Aufgabe links auswählen</div>
    <iframe id="frame" style="display:none"></iframe>
  </div>
</main>
<script src="daten.js"></script>
<script>
(function () {
  var TEILE = ["Pflichtteil", "Wahlteil", "A1 – ohne Taschenrechner", "A2 – mit Taschenrechner", "Wahlteil B"];
  var THEMEN = [];
  AUFGABEN.forEach(function (a) {
    a.themen.forEach(function (t) { if (THEMEN.indexOf(t) < 0) THEMEN.push(t); });
  });
  THEMEN.sort();

  var state = { jahr: "", teile: [], themen: [], saetze: [], sel: null, ansicht: "aufgabe" };
  var auswahl = [];
  try {
    auswahl = JSON.parse(localStorage.getItem("pruefungsarchiv_auswahl") || "[]");
  } catch (e) {}
  try {
    var saved = JSON.parse(localStorage.getItem("pruefungsarchiv") || "{}");
    if (saved.jahr !== undefined) state.jahr = saved.jahr;
    if (saved.teile) state.teile = saved.teile;
    if (saved.themen) state.themen = saved.themen;
    if (saved.saetze) state.saetze = saved.saetze;
  } catch (e) {}

  function speichern() {
    try {
      localStorage.setItem("pruefungsarchiv",
        JSON.stringify({ jahr: state.jahr, teile: state.teile, themen: state.themen,
                         saetze: state.saetze }));
    } catch (e) {}
  }

  function anzeigename(a) {
    return (a.satz ? "Ü-" + a.satz : a.jahr) + " · " + a.label;
  }

  // --- Filter-UI aufbauen ---
  var selJahr = document.getElementById("fJahr");
  var jahre = [];
  AUFGABEN.forEach(function (a) {
    if (a.jahr > 0 && jahre.indexOf(a.jahr) < 0) jahre.push(a.jahr);
  });
  jahre.sort();
  jahre.forEach(function (j) {
    var o = document.createElement("option");
    o.value = j; o.textContent = j;
    selJahr.appendChild(o);
  });
  selJahr.value = state.jahr;
  selJahr.onchange = function () { state.jahr = selJahr.value; render(); speichern(); };

  function chips(containerId, werte, aktiv) {
    var box = document.getElementById(containerId);
    werte.forEach(function (w) {
      var c = document.createElement("button");
      c.className = "chip" + (aktiv.indexOf(w) >= 0 ? " on" : "");
      var kurz = w.replace(" – ohne Taschenrechner", " (ohne TR)").replace(" – mit Taschenrechner", " (mit TR)");
      var n = AUFGABEN.filter(function (a) {
        return containerId === "fTeil" ? a.teil === w : a.themen.indexOf(w) >= 0;
      }).length;
      c.innerHTML = kurz + ' <span class="n">' + n + "</span>";
      c.onclick = function () {
        var arr = containerId === "fTeil" ? state.teile : state.themen;
        var i = arr.indexOf(w);
        if (i >= 0) arr.splice(i, 1); else arr.push(w);
        c.classList.toggle("on");
        render(); speichern();
      };
      box.appendChild(c);
    });
  }
  chips("fTeil", TEILE, state.teile);
  chips("fThema", THEMEN, state.themen);

  // Übungssatz-Chips (eigene Sätze, standardmäßig ausgeblendet)
  var SAETZE = [];
  AUFGABEN.forEach(function (a) {
    if (a.satz && SAETZE.indexOf(a.satz) < 0) SAETZE.push(a.satz);
  });
  SAETZE.sort();
  var satzbox = document.getElementById("fSatz");
  if (!SAETZE.length) satzbox.style.display = "none";
  SAETZE.forEach(function (s) {
    var c = document.createElement("button");
    c.className = "chip" + (state.saetze.indexOf(s) >= 0 ? " on" : "");
    var n = AUFGABEN.filter(function (a) { return a.satz === s; }).length;
    c.innerHTML = "Übungssatz " + s + ' <span class="n">' + n + "</span>";
    c.onclick = function () {
      var i = state.saetze.indexOf(s);
      if (i >= 0) state.saetze.splice(i, 1); else state.saetze.push(s);
      c.classList.toggle("on");
      render(); speichern();
    };
    satzbox.appendChild(c);
  });

  // --- Liste rendern ---
  var gefiltert = [];
  function render() {
    gefiltert = AUFGABEN.filter(function (a) {
      if (state.saetze.length) {
        if (!a.satz || state.saetze.indexOf(a.satz) < 0) return false;
      } else if (a.satz) {
        return false;
      } else if (state.jahr && String(a.jahr) !== String(state.jahr)) {
        return false;
      }
      if (state.teile.length && state.teile.indexOf(a.teil) < 0) return false;
      if (state.themen.length && !a.themen.some(function (t) { return state.themen.indexOf(t) >= 0; })) return false;
      return true;
    });
    document.getElementById("count").textContent =
      gefiltert.length + " von " + AUFGABEN.length + " Aufgaben";
    var box = document.getElementById("items");
    box.innerHTML = "";
    gefiltert.forEach(function (a) {
      var d = document.createElement("div");
      d.className = "item" + (state.sel === a.slug ? " sel" : "");
      d.dataset.slug = a.slug;
      var teilKurz = a.teil.replace(" – ohne Taschenrechner", "").replace(" – mit Taschenrechner", "");
      d.innerHTML =
        '<div class="kopf"><span class="titeltext">' + anzeigename(a) +
        ' <span class="teil">' + teilKurz + "</span></span>" +
        '<input type="checkbox" class="pick" title="Für Arbeitsblatt auswählen"' +
        (auswahl.indexOf(a.slug) >= 0 ? " checked" : "") + "></div>" +
        '<div class="themen">' + a.themen.map(function (t) {
          return '<span class="tag">' + t + "</span>";
        }).join("") + "</div>" +
        (a.snippet ? '<div class="snip">' + a.snippet.replace(/</g, "&lt;") + "</div>" : "");
      d.onclick = function () { zeige(a.slug, "aufgabe"); };
      var cb = d.querySelector(".pick");
      cb.onclick = function (e) {
        e.stopPropagation();
        var i = auswahl.indexOf(a.slug);
        if (cb.checked && i < 0) auswahl.push(a.slug);
        if (!cb.checked && i >= 0) auswahl.splice(i, 1);
        werkzeugAktualisieren();
      };
      box.appendChild(d);
    });
  }

  // --- Viewer ---
  var frame = document.getElementById("frame");
  var leer = document.getElementById("leer");
  var vkopf = document.getElementById("vkopf");
  var tabA = document.getElementById("tabA");
  var tabL = document.getElementById("tabL");

  function aufgabeVon(slug) {
    for (var i = 0; i < AUFGABEN.length; i++) if (AUFGABEN[i].slug === slug) return AUFGABEN[i];
    return null;
  }

  function zeige(slug, ansicht) {
    var a = aufgabeVon(slug);
    if (!a) return;
    state.sel = slug;
    if (ansicht) state.ansicht = ansicht;
    var datei = state.ansicht === "loesung" ? a.loesung : a.aufgabe;
    if (!datei) { state.ansicht = "aufgabe"; datei = a.aufgabe; }
    frame.src = datei;
    frame.style.display = "";
    leer.style.display = "none";
    vkopf.style.display = "";
    document.getElementById("vtitel").textContent = anzeigename(a) + " · " + a.teil;
    tabA.className = "tab" + (state.ansicht === "aufgabe" ? " on" : "");
    tabL.className = "tab" + (state.ansicht === "loesung" ? " on" : "");
    document.getElementById("neu").href = datei;
    var alt = document.querySelector(".item.sel");
    if (alt) { alt.classList.remove("sel"); }
    var neu = document.querySelector('.item[data-slug="' + slug + '"]');
    if (neu) {
      neu.classList.add("sel");
      neu.scrollIntoView({ block: "nearest" });
    }
  }

  tabA.onclick = function () { if (state.sel) zeige(state.sel, "aufgabe"); };
  tabL.onclick = function () { if (state.sel) zeige(state.sel, "loesung"); };

  function schritt(delta) {
    if (!gefiltert.length) return;
    var i = -1;
    for (var k = 0; k < gefiltert.length; k++) if (gefiltert[k].slug === state.sel) { i = k; break; }
    var ziel = i < 0 ? 0 : Math.min(Math.max(i + delta, 0), gefiltert.length - 1);
    zeige(gefiltert[ziel].slug);
  }
  document.getElementById("prev").onclick = function () { schritt(-1); };
  document.getElementById("next").onclick = function () { schritt(1); };

  // --- Arbeitsblatt-Druck ---
  function werkzeugAktualisieren() {
    var n = auswahl.length;
    document.getElementById("wAnzahl").textContent =
      n + (n === 1 ? " Aufgabe" : " Aufgaben") + " ausgewählt";
    document.getElementById("wDruck").disabled = !n;
    document.getElementById("wDruckL").disabled = !n;
    document.getElementById("wLeeren").disabled = !n;
    try { localStorage.setItem("pruefungsarchiv_auswahl", JSON.stringify(auswahl)); } catch (e) {}
  }

  function baueDokHTML(tasks, mitLoesung, titel, untertitel, mitNameDatum) {
    var DRUCKBREITE = 703; // nutzbare A4-Breite in px (96 dpi, 12 mm Ränder)
    function abs(p) { return new URL(p, location.href).href; }
    function block(a, i, art) {
      var url = art === "l" ? a.loesung : a.aufgabe;
      var box = (art === "l" ? a.bl : a.ba) || [900, 1400, 0];
      var w = box[0], unten = box[1], oben = box[2];
      var h = unten - oben + 12;
      var s = Math.min(1, DRUCKBREITE / (w + 6));
      var hs = Math.ceil(h * s);
      // zoom statt transform: verändert die echte Layoutgröße und druckt
      // zuverlässig (transform auf iframes erzeugt Leerseiten in Chrome)
      return '<div class="task' + (hs < 900 ? " zusammen" : "") + '">' +
        '<div class="cap">Aufgabe ' + (i + 1) +
        ' <span>(' + anzeigename(a) + ")</span></div>" +
        '<div class="rahmen" style="height:' + hs + "px;width:" + Math.ceil(w * s) + 'px">' +
        '<iframe src="' + abs(url) + '" scrolling="no" style="zoom:' + s.toFixed(4) +
        ";width:" + (w + 20) + "px;height:" + (unten + 30) + "px;margin-top:-" +
        oben + 'px"></iframe>' +
        "</div></div>";
    }
    var teile = tasks.map(function (a, i) { return block(a, i, "a"); }).join("");
    var loes = "";
    if (mitLoesung) {
      loes = '<div class="loesungen"><h1>Lösungen</h1>' +
        tasks.map(function (a, i) { return block(a, i, "l"); }).join("") + "</div>";
    }
    return '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">' +
      "<title>" + titel + "</title><style>" +
      "body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:16px}" +
      "h1{font-size:17px;margin:0 0 2px}" +
      ".kopfzeile{display:flex;justify-content:space-between;align-items:flex-end;" +
      "border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:6px}" +
      ".kopfzeile .nd{font-size:13px}" +
      "html,body{height:auto}" +
      ".rahmen{overflow:hidden}" +
      ".rahmen iframe{border:0}" +
      ".task{margin-bottom:2px}.task.zusammen{break-inside:avoid}" +
      ".cap{font-weight:bold;font-size:13px;margin:8px 0 2px;border-top:1px solid #ccc;padding-top:6px}" +
      ".cap span{font-weight:normal;color:#555;font-size:11px}" +
      ".loesungen{break-before:page}.loesungen h1{margin-top:14px}" +
      ".hinweis{position:fixed;top:8px;right:8px;background:#1a5fb4;color:#fff;border:0;" +
      "border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer}" +
      "@media print{.hinweis{display:none}}@page{margin:12mm}" +
      "</style></head><body>" +
      '<button class="hinweis" onclick="window.print()">Drucken</button>' +
      '<div class="kopfzeile"><div><h1>' + titel + "</h1>" +
      '<div style="font-size:11px;color:#555">' + untertitel + "</div></div>" +
      (mitNameDatum ? '<div class="nd">Name: ____________________&emsp;Datum: ____________</div>' : "") +
      "</div>" + teile + loes + "</body></html>";
  }

  function baueDruckHTML(mitLoesung) {
    var tasks = auswahl.map(aufgabeVon).filter(Boolean);
    tasks.sort(function (x, y) {
      return x.jahr - y.jahr || (x.sort < y.sort ? -1 : 1);
    });
    return baueDokHTML(tasks, mitLoesung,
      "Arbeitsblatt – Prüfungsaufgaben Mathematik" + (mitLoesung ? " (mit Lösungen)" : ""),
      "Realschulabschlussprüfung BW · zusammengestellt aus " + tasks.length + " Aufgaben",
      true);
  }

  function gesamtOeffnen() {
    if (state.saetze.length === 1) {
      window.open("uebung/satz_" + state.saetze[0] + "_komplett.html", "_blank");
      return;
    }
    if (state.saetze.length === 0 && state.jahr) {
      var tasks = AUFGABEN.filter(function (a) {
        return !a.satz && String(a.jahr) === String(state.jahr);
      });
      tasks.sort(function (x, y) { return x.sort < y.sort ? -1 : 1; });
      var w = window.open("", "_blank");
      if (!w) { alert("Popup wurde blockiert – bitte Popups erlauben."); return; }
      w.document.write(baueDokHTML(tasks, true,
        "Prüfung " + state.jahr + " – Gesamtansicht",
        "alle " + tasks.length + " Aufgaben, Lösungen ab der letzten Seite", false));
      w.document.close();
      return;
    }
    alert("Bitte zuerst oben einen Jahrgang (Jahr-Auswahl) oder genau einen Übungssatz anklicken.");
  }

  function druck(mitLoesung) {
    if (!auswahl.length) return;
    var w = window.open("", "_blank");
    if (!w) { alert("Popup wurde blockiert – bitte Popups für diese Seite erlauben."); return; }
    w.document.write(baueDruckHTML(mitLoesung));
    w.document.close();
  }
  window.baueDruckHTML = baueDruckHTML;

  document.getElementById("wGesamt").onclick = gesamtOeffnen;
  document.getElementById("wDruck").onclick = function () { druck(false); };
  document.getElementById("wDruckL").onclick = function () { druck(true); };
  document.getElementById("wLeeren").onclick = function () {
    auswahl = [];
    werkzeugAktualisieren();
    document.querySelectorAll(".pick").forEach(function (c) { c.checked = false; });
  };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") { schritt(-1); e.preventDefault(); }
    if (e.key === "ArrowRight") { schritt(1); e.preventDefault(); }
    if (e.key.toLowerCase() === "a" && state.sel) zeige(state.sel, "aufgabe");
    if (e.key.toLowerCase() === "l" && state.sel) zeige(state.sel, "loesung");
  });

  render();
  werkzeugAktualisieren();
})();
</script>
</body>
</html>
