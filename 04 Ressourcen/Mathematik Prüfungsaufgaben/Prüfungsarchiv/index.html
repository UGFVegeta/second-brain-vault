<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfungsarchiv Realschule BW · Mathematik 2011–2026</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #dfe3e8;
    --text: #1d2733;
    --muted: #6b7683;
    --accent: #1a5fb4;
    --accent-soft: #e7eefb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 8px; font-size: 17px; }
  header h1 small { color: var(--muted); font-weight: normal; font-size: 12px; margin-left: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  .fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fgroup > span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  select {
    font-size: 13px; padding: 3px 6px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--text);
  }
  .chip {
    font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff; cursor: pointer; user-select: none;
    color: var(--text);
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .65; font-size: 11px; }
  main { flex: 1; display: flex; min-height: 0; }
  #liste {
    width: 330px; min-width: 260px; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  #count { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .item { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--accent-soft); }
  .item.sel { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 9px; }
  .item .kopf { font-size: 13px; font-weight: 600; }
  .item .kopf .teil { color: var(--muted); font-weight: normal; font-size: 12px; }
  .item .themen { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .item .snip { margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.35;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #vkopf {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #vtitel { font-size: 14px; font-weight: 600; margin-right: auto; }
  .tab {
    font-size: 13px; padding: 5px 16px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; border-radius: 6px; color: var(--text);
  }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn {
    font-size: 13px; padding: 5px 10px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; border-radius: 6px; color: var(--text);
  }
  .nav-btn:hover, .tab:hover { border-color: var(--accent); }
  iframe { flex: 1; border: 0; background: #fff; width: 100%; }
  #leer {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #liste { width: 100%; max-height: 40%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Prüfungsarchiv Realschule BW – Mathematik
    <small>2011–2024: walterbauer.net (lokal gespiegelt) · 2026: Original-PDF mit Schul-Lösung – nur für den Dienstgebrauch</small>
  </h1>
  <div class="filters">
    <div class="fgroup">
      <span>Jahr</span>
      <select id="fJahr"><option value="">Alle</option></select>
    </div>
    <div class="fgroup" id="fTeil"><span>Teil</span></div>
    <div class="fgroup" id="fThema"><span>Thema</span></div>
  </div>
</header>
<main>
  <div id="liste">
    <div id="count"></div>
    <div id="items"></div>
  </div>
  <div id="viewer">
    <div id="vkopf" style="display:none">
      <span id="vtitel"></span>
      <button class="tab" id="tabA">Aufgabe</button>
      <button class="tab" id="tabL">Lösung</button>
      <button class="nav-btn" id="prev" title="Vorherige Aufgabe (←)">‹</button>
      <button class="nav-btn" id="next" title="Nächste Aufgabe (→)">›</button>
      <a class="nav-btn" id="neu" target="_blank" title="In neuem Tab öffnen" style="text-decoration:none">⧉</a>
    </div>
    <div id="leer">Aufgabe links auswählen</div>
    <iframe id="frame" style="display:none"></iframe>
  </div>
</main>
<script src="daten.js"></script>
<script>
(function () {
  var TEILE = ["Pflichtteil", "Wahlteil", "A1 – ohne Taschenrechner", "A2 – mit Taschenrechner", "Wahlteil B"];
  var THEMEN = [];
  AUFGABEN.forEach(function (a) {
    a.themen.forEach(function (t) { if (THEMEN.indexOf(t) < 0) THEMEN.push(t); });
  });
  THEMEN.sort();

  var state = { jahr: "", teile: [], themen: [], sel: null, ansicht: "aufgabe" };
  try {
    var saved = JSON.parse(localStorage.getItem("pruefungsarchiv") || "{}");
    if (saved.jahr !== undefined) state.jahr = saved.jahr;
    if (saved.teile) state.teile = saved.teile;
    if (saved.themen) state.themen = saved.themen;
  } catch (e) {}

  function speichern() {
    try {
      localStorage.setItem("pruefungsarchiv",
        JSON.stringify({ jahr: state.jahr, teile: state.teile, themen: state.themen }));
    } catch (e) {}
  }

  // --- Filter-UI aufbauen ---
  var selJahr = document.getElementById("fJahr");
  var jahre = [];
  AUFGABEN.forEach(function (a) { if (jahre.indexOf(a.jahr) < 0) jahre.push(a.jahr); });
  jahre.sort();
  jahre.forEach(function (j) {
    var o = document.createElement("option");
    o.value = j; o.textContent = j;
    selJahr.appendChild(o);
  });
  selJahr.value = state.jahr;
  selJahr.onchange = function () { state.jahr = selJahr.value; render(); speichern(); };

  function chips(containerId, werte, aktiv) {
    var box = document.getElementById(containerId);
    werte.forEach(function (w) {
      var c = document.createElement("button");
      c.className = "chip" + (aktiv.indexOf(w) >= 0 ? " on" : "");
      var kurz = w.replace(" – ohne Taschenrechner", " (ohne TR)").replace(" – mit Taschenrechner", " (mit TR)");
      var n = AUFGABEN.filter(function (a) {
        return containerId === "fTeil" ? a.teil === w : a.themen.indexOf(w) >= 0;
      }).length;
      c.innerHTML = kurz + ' <span class="n">' + n + "</span>";
      c.onclick = function () {
        var arr = containerId === "fTeil" ? state.teile : state.themen;
        var i = arr.indexOf(w);
        if (i >= 0) arr.splice(i, 1); else arr.push(w);
        c.classList.toggle("on");
        render(); speichern();
      };
      box.appendChild(c);
    });
  }
  chips("fTeil", TEILE, state.teile);
  chips("fThema", THEMEN, state.themen);

  // --- Liste rendern ---
  var gefiltert = [];
  function render() {
    gefiltert = AUFGABEN.filter(function (a) {
      if (state.jahr && String(a.jahr) !== String(state.jahr)) return false;
      if (state.teile.length && state.teile.indexOf(a.teil) < 0) return false;
      if (state.themen.length && !a.themen.some(function (t) { return state.themen.indexOf(t) >= 0; })) return false;
      return true;
    });
    document.getElementById("count").textContent =
      gefiltert.length + " von " + AUFGABEN.length + " Aufgaben";
    var box = document.getElementById("items");
    box.innerHTML = "";
    gefiltert.forEach(function (a) {
      var d = document.createElement("div");
      d.className = "item" + (state.sel === a.slug ? " sel" : "");
      d.dataset.slug = a.slug;
      var teilKurz = a.teil.replace(" – ohne Taschenrechner", "").replace(" – mit Taschenrechner", "");
      d.innerHTML =
        '<div class="kopf">' + a.jahr + " · " + a.label +
        ' <span class="teil">' + teilKurz + "</span></div>" +
        '<div class="themen">' + a.themen.map(function (t) {
          return '<span class="tag">' + t + "</span>";
        }).join("") + "</div>" +
        (a.snippet ? '<div class="snip">' + a.snippet.replace(/</g, "&lt;") + "</div>" : "");
      d.onclick = function () { zeige(a.slug, "aufgabe"); };
      box.appendChild(d);
    });
  }

  // --- Viewer ---
  var frame = document.getElementById("frame");
  var leer = document.getElementById("leer");
  var vkopf = document.getElementById("vkopf");
  var tabA = document.getElementById("tabA");
  var tabL = document.getElementById("tabL");

  function aufgabeVon(slug) {
    for (var i = 0; i < AUFGABEN.length; i++) if (AUFGABEN[i].slug === slug) return AUFGABEN[i];
    return null;
  }

  function zeige(slug, ansicht) {
    var a = aufgabeVon(slug);
    if (!a) return;
    state.sel = slug;
    if (ansicht) state.ansicht = ansicht;
    var datei = state.ansicht === "loesung" ? a.loesung : a.aufgabe;
    if (!datei) { state.ansicht = "aufgabe"; datei = a.aufgabe; }
    frame.src = datei;
    frame.style.display = "";
    leer.style.display = "none";
    vkopf.style.display = "";
    document.getElementById("vtitel").textContent = a.jahr + " · " + a.label + " · " + a.teil;
    tabA.className = "tab" + (state.ansicht === "aufgabe" ? " on" : "");
    tabL.className = "tab" + (state.ansicht === "loesung" ? " on" : "");
    document.getElementById("neu").href = datei;
    var alt = document.querySelector(".item.sel");
    if (alt) { alt.classList.remove("sel"); }
    var neu = document.querySelector('.item[data-slug="' + slug + '"]');
    if (neu) {
      neu.classList.add("sel");
      neu.scrollIntoView({ block: "nearest" });
    }
  }

  tabA.onclick = function () { if (state.sel) zeige(state.sel, "aufgabe"); };
  tabL.onclick = function () { if (state.sel) zeige(state.sel, "loesung"); };

  function schritt(delta) {
    if (!gefiltert.length) return;
    var i = -1;
    for (var k = 0; k < gefiltert.length; k++) if (gefiltert[k].slug === state.sel) { i = k; break; }
    var ziel = i < 0 ? 0 : Math.min(Math.max(i + delta, 0), gefiltert.length - 1);
    zeige(gefiltert[ziel].slug);
  }
  document.getElementById("prev").onclick = function () { schritt(-1); };
  document.getElementById("next").onclick = function () { schritt(1); };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") { schritt(-1); e.preventDefault(); }
    if (e.key === "ArrowRight") { schritt(1); e.preventDefault(); }
    if (e.key.toLowerCase() === "a" && state.sel) zeige(state.sel, "aufgabe");
    if (e.key.toLowerCase() === "l" && state.sel) zeige(state.sel, "loesung");
  });

  render();
})();
</script>
</body>
</html>
