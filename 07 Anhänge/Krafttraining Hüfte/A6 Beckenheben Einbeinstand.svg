      <path d="M0,0 L12,6 L0,12 z" fill="#e8590c"/>
    </marker>
  </defs>
  <rect width="440" height="300" rx="12" fill="#f7f8fa"/>

  <text x="220" y="28" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2c3e50" text-anchor="middle">A6 · Beckenheben im Einbeinstand (Frontansicht)</text>
  <text x="220" y="48" font-family="system-ui,sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">Standbeinknie bleibt gestreckt · nur das Becken sinkt und hebt</text>

  <line x1="40" y1="278" x2="400" y2="278" stroke="#9aa3b0" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="212" width="108" height="66" rx="4" fill="#e3e7ec" stroke="#9aa3b0" stroke-width="3.5"/>

