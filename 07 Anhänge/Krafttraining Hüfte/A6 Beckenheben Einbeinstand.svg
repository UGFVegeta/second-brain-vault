  <text x="300" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#9aa3b0">waagerecht</text>

  <circle cx="220" cy="148" r="20" fill="#e8590c" opacity="0.17"/>

  <g fill="none" stroke="#2c3e50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220,148 L268,160" stroke-width="7.5"/>
    <path d="M220,148 L222,180 L222,212" stroke-width="7.5"/>
    <path d="M268,160 L276,206 L280,250" stroke-width="7.5"/>
    <path d="M244,154 L242,100" stroke-width="7.5"/>
    <path d="M216,100 L272,100" stroke-width="7.5"/>
    <path d="M216,102 L194,150" stroke-width="5"/>
    <path d="M272,102 L294,150" stroke-width="5"/>
