  <text x="318" y="268" font-family="system-ui,sans-serif" font-size="11.5" fill="#2f9e44" text-anchor="middle">hängt frei</text>

  <path d="M340,192 L340,150" fill="none" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="366" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#e8590c" text-anchor="middle">heben</text>

  <text x="122" y="148" font-family="system-ui,sans-serif" font-size="11.5" fill="#e8590c" text-anchor="middle">Standbein</text>
  <text x="122" y="163" font-family="system-ui,sans-serif" font-size="11.5" fill="#e8590c" text-anchor="middle">arbeitet</text>

  <text x="220" y="294" font-family="system-ui,sans-serif" font-size="12.5" fill="#e8590c" text-anchor="middle">3 × 12 je Seite · genau die Funktion, die beim Laufen gebraucht wird</text>
