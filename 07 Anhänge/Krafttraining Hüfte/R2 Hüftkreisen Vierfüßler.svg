  </defs>
  <rect width="440" height="290" rx="12" fill="#f7f8fa"/>

  <text x="220" y="28" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2c3e50" text-anchor="middle">R2 · Hüftkreisen im Vierfüßlerstand</text>
  <text x="220" y="48" font-family="system-ui,sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">Rücken bleibt ruhig · nur die Hüfte kreist, kein Ausweichen im Becken</text>

