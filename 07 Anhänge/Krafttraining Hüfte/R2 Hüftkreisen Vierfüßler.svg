    <path d="M248,176 L296,206" stroke-width="7.5"/>
    <path d="M296,206 L318,242" stroke-width="7.5"/>
  </g>
  <circle cx="110" cy="160" r="18" fill="#2c3e50"/>

  <path d="M336,182 A34,34 0 1,1 300,166" fill="none" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar)"/>

  <text x="220" y="284" font-family="system-ui,sans-serif" font-size="12.5" fill="#e8590c" text-anchor="middle">10 Kreise je Richtung · langsam, ohne in die Endgradigkeit zu gehen</text>
