<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 295" width="440" height="295" role="img" aria-label="Aktive Innenrotation der Hüfte in Bauchlage">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#e8590c"/>
    </marker>
  </defs>
  <rect width="440" height="295" rx="12" fill="#f7f8fa"/>

  <text x="220" y="30" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2c3e50" text-anchor="middle">R5 · Aktive Innenrotation, Bauchlage</text>
  <text x="220" y="50" font-family="system-ui,sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">Blick von den Füßen her · Knie 90° gebeugt, Becken bleibt am Boden</text>

  <!-- kleine Seitenansicht links -->
  <g opacity="0.75">
    <line x1="34" y1="248" x2="150" y2="248" stroke="#9aa3b0" stroke-width="3"/>
    <g fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52,238 L112,238"/>
      <path d="M112,238 L112,196"/>
    </g>
    <circle cx="42" cy="234" r="9" fill="#2c3e50"/>
    <text x="92" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ausgangslage</text>
  </g>
  <line x1="168" y1="86" x2="168" y2="262" stroke="#dde1e6" stroke-width="2"/>

  <!-- Hauptansicht: von den Füßen -->
  <rect x="212" y="232" width="130" height="16" rx="6" fill="#e3e7ec" stroke="#9aa3b0" stroke-width="3"/>
  <circle cx="277" cy="226" r="19" fill="#e8590c" opacity="0.15"/>

  <path d="M277,214 L332,148" fill="none" stroke="#b6bdc8" stroke-width="6" stroke-linecap="round" stroke-dasharray="7 9"/>

  <g fill="none" stroke="#2c3e50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222,232 L332,232" stroke-width="8"/>
    <path d="M277,226 L277,120" stroke-width="7.5"/>
    <path d="M277,120 L302,112" stroke-width="7"/>
  </g>

  <path d="M300,124 Q334,138 344,164" fill="none" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar)"/>

  <text x="360" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#e8590c" text-anchor="middle">Fuß nach</text>
  <text x="360" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#e8590c" text-anchor="middle">außen</text>
  <text x="252" y="196" font-family="system-ui,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="end">Schienbein</text>

  <text x="220" y="288" font-family="system-ui,sans-serif" font-size="12.5" fill="#e8590c" text-anchor="middle">3 × 12 je Seite · Fuß nach außen = Innenrotation der Hüfte</text>
</svg>
