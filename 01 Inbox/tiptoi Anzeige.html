:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(246,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 0 10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.stats{color:var(--muted);font-size:14px}
.stats b{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px}
input[type=search]{flex:1 1 220px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px}
main{padding:18px 0 60px}
section.kat{margin-bottom:22px}
h2{font-size:15px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
h2 small{color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#faf9f7}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#faf9f7}
tr.sel{background:var(--sel)!important}
td.c{width:36px;text-align:center}
td.id{width:46px;color:var(--muted);font-variant-numeric:tabular-nums}
td.foto{width:62px;color:var(--muted);font-size:13px}
td.p{width:90px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.z{width:96px;color:var(--muted);font-size:13px}
td.l{width:150px;font-size:13px}
td.l a{color:var(--accent);text-decoration:none}
td.l a:hover{text-decoration:underline}
.mm{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dup{display:inline-block;margin-left:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.none{color:#b0aea8;font-weight:400}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h3{margin:0 0 8px;font-size:15px}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:9px;padding:12px;font:14px/1.5 inherit;font-family:inherit;resize:vertical}
.btn{border:0;background:var(--accent);color:#fff;padding:9px 16px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hint{color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.sum td{font-weight:650;background:#faf9f7}
@media (max-width:760px){
  td.foto,th.foto,td.z,th.z{display:none}
  td.l{width:auto}
}
</style>

const ITEMS=[]; let n=0;
for(const [kat,foto,titel,anz] of ROH){ for(let i=1;i<=anz;i++){ n++; ITEMS.push({id:n,kat,foto,titel,ex:anz>1?i+'/'+anz:'',p:PREISE[titel]||null}); } }

const KEY='tiptoi-auswahl-v1';
let sel=new Set(); try{ sel=new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify([...sel])); }catch(e){} };
let filterKat=null, query='';

const eur=v=>v==null?'':v.toFixed(2).replace('.',',')+' €';
const num=p=>p&&p[0]?parseFloat(p[0].replace(',','.')):null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rowHtml(it,withBox=true){
  const p=it.p, pr=num(p);
  const link=p&&p[3]?`<a href="https://www.medimops.de${p[3]}" target="_blank" rel="noopener">bei Medimops ↗</a>`:'<span class="none">kein Preis</span>';
  const mm=p&&p[2]?`<span class="mm">${esc(p[2])}</span>`:'';
  return `<tr data-id="${it.id}" class="${sel.has(it.id)?'sel':''}">
    ${withBox?`<td class="c"><input type="checkbox" ${sel.has(it.id)?'checked':''} aria-label="auswählen"></td>`:''}
    <td class="id">${it.id}</td>
    <td>${esc(it.titel)}${it.ex?`<span class="dup">Exemplar ${it.ex}</span>`:''}${mm}</td>
    <td class="foto">Foto ${it.foto}</td>
    <td class="p">${pr!=null?eur(pr):'<span class="none">–</span>'}</td>
    <td class="z">${p&&p[1]?esc(p[1]):''}</td>
    <td class="l">${link}</td>
  </tr>`;
}
const head=(box=true)=>`<thead><tr>${box?'<th></th>':''}<th>Nr.</th><th>Titel</th><th class="foto">Foto</th><th style="text-align:right">Medimops</th><th class="z">Zustand</th><th>Link</th></tr></thead>`;

function renderAlle(){
  const q=query.toLowerCase();
  const vis=ITEMS.filter(it=>(!filterKat||it.kat===filterKat)&&(!q||it.titel.toLowerCase().includes(q)));
  const kats=[...new Set(vis.map(i=>i.kat))];
  document.getElementById('alle').innerHTML = vis.length? kats.map(k=>{
    const rows=vis.filter(i=>i.kat===k);
    return `<section class="kat"><h2>${esc(k)} <small>${rows.length} Artikel</small></h2><table>${head()}<tbody>${rows.map(r=>rowHtml(r)).join('')}</tbody></table></section>`;
  }).join('') : '<div class="empty">Kein Titel passt zur Suche.</div>';
}

function nachricht(list){
  const zeilen=list.map(i=>`- ${i.titel.replace(/ \(Anzahl nachfragen\)/,'')}${i.kat==='Wieso? Weshalb? Warum?'?' (Wieso? Weshalb? Warum?)':''}`);
  // Doppelte Titel zusammenfassen
  const cnt={}; zeilen.forEach(z=>cnt[z]=(cnt[z]||0)+1);
  const uniq=[...new Set(zeilen)].map(z=>cnt[z]>1?`${z} (${cnt[z]}×)`:z);
  return `Hallo,\n\nich interessiere mich für folgende tiptoi-Sachen aus deiner Anzeige:\n\n${uniq.join('\n')}\n\nWas hättest du dir dafür vorgestellt?\n\nViele Grüße\nOskar`;
}

function renderAuswahl(){
  const list=ITEMS.filter(i=>sel.has(i.id));
  const box=document.getElementById('auswahl');
  if(!list.length){ box.innerHTML='<div class="empty">Noch nichts ausgewählt. Unter „Alle Artikel“ einfach Zeilen anklicken.</div>'; return; }
  const sum=list.reduce((s,i)=>s+(num(i.p)||0),0);
  const ohne=list.filter(i=>num(i.p)==null).length;
  box.innerHTML=`<table>${head(false)}<tbody>${list.map(r=>rowHtml(r,false)).join('')}
    <tr class="sum"><td></td><td>${list.length} Artikel${ohne?` <span class="hint">(${ohne} ohne Medimops-Preis)</span>`:''}</td><td class="foto"></td><td class="p">${eur(sum)}</td><td class="z"></td><td class="l"></td></tr></tbody></table>
    <div class="panel"><h3>Nachricht für Kleinanzeigen</h3>
      <p class="hint" style="margin:0 0 10px">Kannst du hier noch anpassen, dann kopieren und im Chat der Anzeige einfügen.</p>
      <textarea id="msg">${esc(nachricht(list))}</textarea>
      <div class="row"><button class="btn" id="copy">Nachricht kopieren</button><button class="btn ghost" id="reset">Auswahl leeren</button><span class="hint" id="cmsg"></span></div>
    </div>`;
  document.getElementById('copy').onclick=async()=>{ const t=document.getElementById('msg').value; try{ await navigator.clipboard.writeText(t); document.getElementById('cmsg').textContent='Kopiert.'; }catch(e){ document.getElementById('msg').select(); document.execCommand('copy'); document.getElementById('cmsg').textContent='Kopiert.'; } };
  document.getElementById('reset').onclick=()=>{ if(confirm('Auswahl wirklich leeren?')){ sel.clear(); save(); update(); } };
}

function update(){
  document.getElementById('nsel').textContent=sel.size;
  const total=ITEMS.reduce((s,i)=>s+(num(i.p)||0),0), found=ITEMS.filter(i=>num(i.p)!=null).length;
  const selSum=ITEMS.filter(i=>sel.has(i.id)).reduce((s,i)=>s+(num(i.p)||0),0);
  document.getElementById('stats').innerHTML=`<b>${ITEMS.length}</b> Artikel; Medimops-Preis für ${found} gefunden; zusammen <b>${eur(total)}</b>; Auswahl: <b>${sel.size}</b> (${eur(selSum)})`;
  renderAlle(); renderAuswahl();
}

document.getElementById('alle').addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const tr=e.target.closest('tr[data-id]'); if(!tr) return;
  const id=+tr.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); save();
  tr.classList.toggle('sel',sel.has(id)); tr.querySelector('input').checked=sel.has(id);
  document.getElementById('nsel').textContent=sel.size; update();
});
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;renderAlle();});
const kats=[...new Set(ITEMS.map(i=>i.kat))];
document.getElementById('chips').innerHTML=['Alle',...kats].map(k=>`<button class="chip ${k==='Alle'?'on':''}" data-k="${esc(k)}">${esc(k)}</button>`).join('');
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; filterKat=b.dataset.k==='Alle'?null:b.dataset.k; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b)); renderAlle();});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); const v=t.dataset.v; document.getElementById('alle').hidden=v!=='alle'; document.getElementById('auswahl').hidden=v!=='auswahl'; document.getElementById('controls').style.display=v==='alle'?'flex':'none'; window.scrollTo(0,0);});
update();
</script>
